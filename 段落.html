<title>分章短文 · 雅思考点词</title>
<style>
:root{--bg:#f7f6f2;--panel:#fff;--ink:#1f2328;--ink2:#5b6470;--line:#e6e2da;--chip:#efece6;
 --accent:#0f766e;--acc-soft:#eaf4f2;--mark:#d7ece8;--green:#1f7a52;--warn:#b4452e;--serif:"Iowan Old Style","Palatino Linotype",Georgia,"Songti SC",serif}
html.dark{color-scheme:dark;--bg:#14181a;--panel:#1b2124;--ink:#e8eaed;--ink2:#9aa3ad;--line:#2b3236;
 --chip:#232b2e;--acc-soft:#16302d;--mark:#1d4a44;--green:#6cc38b;--warn:#f0776a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 -apple-system,BlinkMacSystemFont,
 "PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;padding-bottom:80px;
 -webkit-text-size-adjust:100%}
.wrap{max-width:820px;margin:0 auto;padding:0 18px}
header{padding:26px 0 8px}
h1{margin:0;font-size:24px;font-weight:750;letter-spacing:-.3px}
.sub{color:var(--ink2);font-size:13px;margin-top:6px;line-height:1.65}
.back{display:inline-block;font-size:13px;color:var(--ink2);text-decoration:none;border:1px solid var(--line);
 border-radius:999px;padding:3px 12px;margin-bottom:14px;background:var(--panel)}
.back:hover{color:var(--accent);border-color:var(--accent)}
#chs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 4px}
.cb{font:inherit;font-size:12.5px;cursor:pointer;border:1px solid var(--line);background:var(--panel);
 color:var(--ink2);border-radius:9px;padding:5px 10px;line-height:1.2}
.cb:hover{border-color:var(--accent);color:var(--accent)}
.cb.on{background:var(--accent);border-color:var(--accent);color:#fff}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 0 10px;
 border-top:1px solid var(--line);padding-top:13px}
.ttl{font-size:17px;font-weight:700;letter-spacing:-.2px}
.ttl em{font-style:normal;color:var(--ink2);font-weight:500;font-size:13px;margin-left:7px}
.acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.acts button{font:inherit;font-size:12.5px;font-weight:650;border-radius:9px;cursor:pointer;
 border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 11px}
.acts button:hover{border-color:var(--accent);color:var(--accent)}
.acts button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.cov{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:14px}
.cv1{display:flex;align-items:baseline;gap:8px;font-size:12.8px;color:var(--ink2);flex-wrap:wrap}
.cv1 b{font-size:15px;color:var(--accent);font-variant-numeric:tabular-nums}
.cvp{height:5px;border-radius:3px;background:var(--chip);margin-top:8px;overflow:hidden}
.cvp i{display:block;height:100%;background:var(--accent);border-radius:3px}
.cov details{margin-top:4px}
.cov summary{font-size:12.5px;color:var(--ink2);cursor:pointer;list-style:none;outline:none}
.cov summary::-webkit-details-marker{display:none}
.cov summary:hover{color:var(--accent)}
.left{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.left span{font-size:12px;background:var(--chip);color:var(--ink2);border-radius:6px;padding:2px 7px;cursor:help}
.pass{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:15px 17px 11px;margin-bottom:12px}
.ph{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.pn{font-size:11px;font-weight:800;letter-spacing:.5px;color:var(--accent);background:var(--acc-soft);
 border-radius:5px;padding:2px 6px;font-variant-numeric:tabular-nums}
.pt{font-size:14.5px;font-weight:700}
.ph .say{margin-left:auto}
.ps{margin:0}
.ps .pen{margin:0;font:16.4px/1.78 var(--serif);letter-spacing:.1px;color:var(--ink)}
.ps .pzh{margin:9px 0 0;font-size:13px;line-height:1.8;color:var(--ink2);
 padding-top:9px;border-top:1px dashed var(--line)}
.sn{padding:0;border-radius:3px;transition:background .15s}
.sn .en{color:inherit}
/* 段落版 */
body.para .ps .pen{text-align:justify;text-justify:inter-word;hyphens:auto}
body.para .sn{display:inline}
body.para .sn .zh{display:none}
body.para .ps .pzh{display:block;text-align:justify}
/* 逐句版 */
body.sent .sn{display:block;margin:0 0 12px;padding:1px 4px}
body.sent .sn:last-of-type{margin-bottom:0}
body.sent .sn .en{display:block;font:16.4px/1.62 var(--serif)}
body.sent .sn .zh{display:block;font-size:12.6px;line-height:1.55;color:var(--ink2);margin-top:2px}
body.sent .ps .pzh{display:none}
.ps .zh b,.ps .pzh b{font-weight:800;color:var(--ink)}
body.nozh .ps .pzh,body.nozh .sn .zh{display:none}
.sn.cur{background:var(--acc-soft);box-shadow:none;border-radius:3px}
.sn.cur .en{color:var(--accent)}
mark.pv{background:none;color:inherit;cursor:pointer;padding:0 1px;border-radius:2px;font-weight:680;
 box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--accent) 32%,transparent)}
mark.pv:hover{background:var(--mark);box-shadow:none}
mark.pv.on{background:var(--accent);color:#fff;box-shadow:none}
body.blurred mark.pv{color:transparent;background:var(--chip);box-shadow:none;border-radius:3px}
body.blurred mark.pv.on{color:inherit;background:var(--mark);box-shadow:none}
body.para.blind .ps .pen{filter:blur(4.5px);cursor:pointer;user-select:none}
body.para.blind .ps.rev .pen{filter:none}
body.sent.blind .sn .en{filter:blur(4.5px);cursor:pointer;user-select:none}
body.sent.blind .sn.rev .en{filter:none}
.say{border:0;background:none;cursor:pointer;color:var(--ink2);padding:2px;line-height:0;border-radius:6px}
.say:hover{color:var(--accent);background:var(--acc-soft)}
.say svg{width:15px;height:15px}
.wlist{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px;padding-top:9px;border-top:1px dashed var(--line)}
.wlist span{font-size:11.5px;color:var(--ink2);background:var(--chip);border-radius:5px;padding:1px 6px;cursor:pointer}
.wlist span:hover{color:var(--accent)}
#pop{position:fixed;z-index:90;min-width:180px;max-width:320px;background:var(--panel);border:1px solid var(--line);
 border-radius:12px;box-shadow:0 12px 34px rgba(0,0,0,.18);padding:11px 13px;display:none}
#pop.on{display:block}
#pop .pw{font:700 16px/1.3 var(--serif)}
#pop .pm{font-size:12.8px;color:var(--ink2);margin-top:4px;line-height:1.6}
#pop .ps{font-size:12px;color:var(--accent);margin-top:6px;line-height:1.55;background:var(--acc-soft);
 border-radius:6px;padding:4px 7px}
#pop .pa{display:flex;gap:6px;margin-top:9px}
#pop .pa button{font:inherit;font-size:12px;font-weight:650;border:1px solid var(--line);background:var(--panel);
 color:var(--ink);border-radius:7px;padding:4px 10px;cursor:pointer}
#pop .pa button:hover{border-color:var(--accent);color:var(--accent)}
#pop .pa button.on{background:var(--accent);border-color:var(--accent);color:#fff}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);background:var(--ink);color:var(--bg);
 font-size:13px;padding:8px 16px;border-radius:999px;opacity:0;transition:.22s;pointer-events:none;z-index:99;
 max-width:80vw;text-align:center}
#toast.on{opacity:.95;transform:translate(-50%,0)}
@media (max-width:620px){.wrap{padding:0 12px}h1{font-size:21px}.pass{padding:13px 13px 9px}
 .sn .en{font-size:16px;line-height:1.8}.sn .zh{font-size:12.5px}.ttl{font-size:15.5px;width:100%}
 .acts{margin-left:0;width:100%}.cb{font-size:12px;padding:4px 9px}}
/* ---- 背诵入口 ---- */
.qz{display:flex;align-items:center;gap:8px;margin-top:9px;padding-top:8px;
 border-top:1px dashed var(--line);flex-wrap:wrap}
.qbb{font:inherit;font-size:12px;font-weight:650;color:var(--accent);background:var(--acc-soft);
 border:1px solid color-mix(in srgb,var(--accent) 26%,transparent);border-radius:7px;padding:3px 10px;cursor:pointer}
.qbb:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.qsc{font-size:11.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.qsc b{color:var(--accent);font-weight:700}
#recbtn{color:var(--accent);background:var(--acc-soft);
 border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
#recbtn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
</style>

 <h1>分章短文</h1>
 <p class="sub">把 538 和 179 的考点词写进小短文里：每篇一段英文，连着读下来是一个完整的意思，下面配一整段中文。加粗带下划线的是本组考点词，点一下看释义和<b>同义替换</b>，可一键收进生词本。每篇底下有「背诵本篇」：把这一篇的考点词拉进背诵窗口，认识的按遗忘曲线排期，不认识的自动进生词本；上方「背诵本组」可以一次把本组全部词过完。</p>

<script>
var TXT={"1":[{"t":"How Scientists Describe Plants","s":[["When two plants resemble each other, botanists look beyond their general shape to recognize the traits that separate one variety from another.","两种植物外形相似时，植物学家不会只看整体形状，而会辨认区分不同品种的特征。"],["They measure leaf width, stem length and other visible features, then adjust their records as the plant develops.","他们会测量叶宽、茎长等可见特征，再随着植株生长调整记录。"],["Such careful observation is fundamental because a useful description must rest on details that others can check, rather than on a quick impression.","这种细致观察是基础，因为有用的描述必须依据他人可以核实的细节，而不能只凭粗略印象。"],["If researchers ignore small differences, they may confuse a domestic crop with an artificial hybrid created for a different purpose.","研究人员若忽略细微差异，就可能把一种本土作物与为其他用途培育的人工杂交种混为一谈。"],["The terms they coin for new varieties often prompt further discussion, since the ideas that underlie a name can shape how later studies approach the plant.","他们为新品种创造的名称常会引发进一步讨论，因为名称背后的观念可能影响后续研究看待这种植物的方式。"]]},{"t":"From Observation to Cultivation","s":[["Growers rely on this shared language when they exchange seeds, because a precise name tells them what to expect from a crop.","种植者交换种子时依靠这套共同语言，因为准确的名称能让他们了解作物会有怎样的表现。"],["Thanks to accurate records, they can compare local experience with research carried out under different conditions.","有了准确的记录，他们就能把本地经验与不同条件下开展的研究进行比较。"],["One practical approach is to test whether additional fertiliser changes growth, while keeping light, water and soil as steady as possible.","一种实用的方法是检验增施肥料是否会改变生长情况，同时尽量保持光照、水分和土壤条件稳定。"],["Results from several fields are more convincing than a single trial, especially when different varieties respond in distinct ways.","多块田地的结果比一次试验更有说服力，尤其是在不同品种反应各异的情况下。"],["Clear measurement therefore connects the first description of a plant with the decisions made by the people who cultivate it.","因此，清晰的测量把对植物的最初描述与种植者的实际决策联系起来。"]]}],"2":[{"t":"Designing a Careful Study","s":[["A reliable study begins with diversity, because a narrow sample may fail to detect differences that matter in the wider population.","可靠的研究从多样性开始，因为狭窄的样本可能无法发现更广泛人群中真正重要的差异。"],["Researchers try to isolate the factor they are testing and avoid changing several conditions at once.","研究人员会尽量分离出待检验的因素，避免同时改变多个条件。"],["When a tight budget forces them to adapt to fewer resources, an alternative method can still produce useful evidence.","预算紧张、不得不适应资源减少的情况时，替代方法仍可能提供有用证据。"],["If one component of the equipment performs poorly, another may compensate, but the limitation should be reported rather than hidden.","设备的某个部件性能不佳时，另一个部件或许可以弥补，但这种局限应当报告，不能隐瞒。"],["This caution applies to military research as much as to any other field, since complex instruments can create a false sense of precision.","军事研究和其他领域同样需要这种谨慎，因为复杂仪器可能制造出一种虚假的精确感。"],["Careful recording of each adjustment allows other researchers to understand what happened and repeat the procedure.","仔细记录每次调整，能让其他研究人员了解实际过程并重复实验步骤。"]]},{"t":"Turning Evidence into a Plan","s":[["Clear criteria help a team judge whether a proposed curriculum is feasible within the time and money available.","明确的标准有助于团队判断所拟课程能否在现有时间和经费内实施。"],["Cost and staffing constrain the design, so a deficiency in one area may require a supplement such as extra training or equipment.","成本和人手会限制方案设计，因此某一方面的不足可能需要额外培训或设备来补充。"],["Planners must distinguish between an enormous problem and one that merely looks impressive on paper.","规划者必须区分真正巨大的问题与只在纸面上显得严重的问题。"],["They analyze the likely causes, examine the scale of each, and emphasize the factors that can actually be changed.","他们分析可能的原因，考察各因素的影响规模，并强调那些实际能够改变的因素。"],["A plan becomes credible when its priorities follow evidence instead of the loudest opinion in the room.","当方案的优先次序依据证据而非最响亮的意见时，它才更可信。"]]},{"t":"Rules, Habits and Change","s":[["People often imitate an established convention without asking whether it still serves a useful purpose.","人们常常模仿既定惯例，却不问它现在是否仍有实际用处。"],["An ancient rule may once have been beneficial, yet changing conditions can make it impair rather than support daily life.","一条古老规则过去也许有益，但环境变化后，它可能损害而非改善日常生活。"],["Poor transport can hinder trade, while a demanding schedule may determine how much time remains for family or rest.","糟糕的交通会阻碍贸易，繁重紧张的日程则可能决定人们还能留多少时间给家人和休息。"],["A legitimate objection deserves a response, but every regulation also needs a clear limitation defining where it applies.","合理的异议应当得到回应，每项规定也都需要明确限制其适用范围。"],["When economic pressures accelerate change, communities must decide which practices to preserve and which ones to revise.","经济压力加快变化时，社区必须决定哪些做法应当保留，哪些需要修订。"]]},{"t":"Health, Treatment and Risk","s":[["Managing a chronic illness requires conscious choices that minimize harm over months or years, not just during a sudden crisis.","控制慢性病需要有意识的选择，在数月乃至数年中尽量减少伤害，而不能只应对突发危机。"],["Vaccination is imperative where infection spreads easily, because immunity protects people who cannot be treated in time.","在疾病容易传播的地方，接种疫苗十分必要，因为免疫力能保护那些无法及时得到治疗的人。"],["Within the body, glands secrete hormones and nerves transmit signals, coordinating processes that normally pass unnoticed.","在体内，腺体分泌激素，神经传递信号，共同协调那些通常不为人察觉的过程。"],["It is easy to exaggerate a mild fever, but accurate descriptions help clinicians judge whether treatment is necessary.","人们很容易夸大轻微发热，而准确的描述有助于医生判断是否需要治疗。"],["When a species becomes extinct, unique biological compounds disappear with it, including some that might have guided future treatments.","一个物种灭绝时，其特有的生物化合物也会随之消失，其中一些原本可能为未来治疗提供线索。"]]},{"t":"Value, Choice and Survival","s":[["An exclusive contract may guarantee access to a resource, yet it cannot protect every party from loss.","独家协议或许能保证获得某种资源，却无法保证各方都不受损失。"],["A family can inherit land, while a witness may preserve its history in a recording on magnetic tape.","一个家庭可以继承土地，而一位见证人可以用磁带录音保存它的历史。"],["When one option fails, many people prefer to act quickly rather than wait for an ideal solution.","一种选择行不通时，许多人宁愿迅速行动，也不愿等待理想方案。"],["The primary principle should guide the decision, even when a secondary benefit receives more immediate attention.","即使次要好处受到更多即时关注，决策仍应遵循首要原则。"],["A potential buyer needs specific information about quantity and quality before agreeing to settle a price.","潜在买家需要了解数量和品质的具体信息，然后才会商定价格。"],["Unnecessary rules can sophisticate a simple exchange, making an ordinary purchase slower without improving its fairness.","不必要的规则会把简单交易复杂化，使普通购买变得更慢，却未必更加公平。"],["In the surrounding countryside, only well-adapted species survive a swift change in climate, though some may unexpectedly recover when conditions improve.","在周边乡村，只有适应良好的物种才能挺过气候的迅速变化，不过环境改善后，有些物种也可能意外恢复。"]]},{"t":"Knowledge in Practice","s":[["A serious attempt to solve a problem draws on expertise, whether the faculty involved belongs to an individual or a research team.","认真尝试解决问题需要专业知识，无论所运用的能力属于个人还是研究团队。"],["Universities often donate equipment to local projects, while a small financial incentive can encourage residents to participate.","大学常向当地项目捐赠设备，少量经济激励也能鼓励居民参与。"],["The dynamics of a coastal town affect mortality, employment and housing, especially when storms threaten the peripheral districts.","沿海城镇的动态变化会影响死亡率、就业和住房，风暴威胁外围地区时尤其如此。"],["In the vicinity of a factory, daily practice and careful monitoring matter more than broad promises about safety.","在工厂附近，日常实践和细致监测比笼统的安全承诺更重要。"],["Scientists study bacteria by looking for a pattern in their growth rather than relying on an innate impression of what seems normal.","科学家研究细菌时会寻找其生长模式，而不是依靠对何谓正常的天生直觉。"],["The original therapy may remain useful, but a confidential report on cognitive effects should be examined before a new treatment is widely adopted.","原有疗法或许仍然有效，但在广泛采用新疗法前，应当审查有关其认知影响的机密报告。"],["Coastal communities are subject to erosion, and low-lying homes are liable to flooding when drainage systems are overwhelmed.","沿海社区容易受到侵蚀，排水系统不堪重负时，地势低洼的房屋也容易遭水淹。"]]},{"t":"Co-ordination and Continuity","s":[["Large projects depend on co-operation, so a senior manager must co-ordinate people whose experience and superior technical knowledge differ.","大型项目依靠合作，因此高级经理必须协调经验不同、专业技术优势各异的人员。"],["Teams comply with agreed procedures and consult specialists when an unfamiliar cue or warning signal appears.","团队遵守既定程序，遇到不熟悉的线索或警告信号时会咨询专家。"],["Without clear communication, a minor fault can halt work or persuade someone to abandon an otherwise sound plan.","沟通不清时，一个小故障就可能使工作停顿，或让人放弃原本合理的计划。"],["A fragile container must retain its contents throughout delivery, because even a small crack can make the whole shipment unusable.","易碎容器在整个运送过程中都必须完好保存内装物，因为即使细小裂缝也可能使整批货物无法使用。"],["Coastal cliffs erode gradually, and old paths can vanish as wind and water induce small changes that accumulate over time.","海岸悬崖逐渐受到侵蚀，旧路也可能消失，因为风和水引起的小变化会日积月累。"],["Stable prices help integrate regional markets, although equal access to transport is also necessary for smaller producers.","稳定的价格有助于整合区域市场，不过小型生产者也需要平等的运输条件。"],["Authorities may grant a licence for one year and review the evidence again before allowing the activity to continue.","主管部门可以颁发为期一年的许可，并在允许活动继续之前重新审查证据。"]]}],"3":[{"t":"Preparing for Shared Challenges","s":[["Time spent on an addictive game can accumulate quickly, leaving less room for the training that difficult work requires.","花在令人上瘾的游戏上的时间会迅速累积，使困难工作所需的训练时间越来越少。"],["Adversity is easier to face when people remain agreeable and discourage aggression, because practical aid depends on cooperation.","人们保持随和并避免攻击行为时，更容易面对逆境，因为实际援助有赖于合作。"],["At high altitude, an application to climb may require medical details, particularly when someone is allergic to standard treatment.","在高海拔地区，登山申请可能需要提供医疗信息，有人对常规治疗药物过敏时尤其如此。"],["An association will approve the plan only if an array of safety measures supports it and experienced leaders assign each role.","只有配备一系列安全措施并由有经验的领队分配各项职责，协会才会批准这项计划。"],["The authority in charge expects a respectful attitude, and every arrangement must be consistent with local rules.","主管部门希望参与者保持尊重的态度，所有安排也都必须符合当地规定。"]]},{"t":"A Community Response to Crop Disease","s":[["When pests infest the grain stores and blight crosses a field boundary, farmers bear the first burden, though a careless response can bungle the wider containment effort.","害虫侵扰粮仓、枯萎病又越过田地边界时，农民首先承受负担，而草率的应对可能搞砸更大范围的防控工作。"],["A catastrophic outbreak may become a calamity for towns whose storage capacity is already limited.","对于储存能力本就有限的城镇，一场灾难性的病害暴发可能演变成一场大灾难。"],["Local kitchens cater for displaced families, while inspectors certify food that remains safe to eat.","当地厨房为流离失所的家庭供餐，检查人员则为仍可安全食用的食品出具证明。"],["This civic commitment deserves informed comment, because communal stores and shared transport affect everyone.","这种公民责任应得到基于事实的讨论，因为公共储备和共享交通关系到每个人。"],["People who commute between villages can compare conditions in different areas and report where help is most needed.","往返于各村之间的人可以比较不同地区的情况，并报告哪里最需要帮助。"]]},{"t":"Investigating a Serious Crash","s":[["Investigators should not conceal uncertainty when they concentrate on the causes of a serious crash.","调查人员集中分析严重撞车事故的原因时，不应隐瞒仍然存疑之处。"],["Experts may confer at length and still fail to concur, particularly when a conflict of interest confuses the discussion.","专家可能磋商良久仍无法达成一致，利益冲突使讨论更加混乱时尤其如此。"],["A conservative estimate of the damage is preferable to speculation, although the cost may still be considerable.","对损失作保守估计胜过凭空猜测，尽管代价仍可能相当可观。"],["A contingent of reporters can turn a controversial finding into a headline before the evidence has been checked.","一小队记者可能在证据核实之前，就把一项有争议的发现写成头条。"],["A correlation between two events does not prove criminal behaviour, just as courtship does not guarantee marriage.","两件事存在相关并不能证明其中有犯罪行为，正如恋爱追求并不保证最终结婚。"],["Public credibility depends on explaining these distinctions instead of presenting every suspicion as fact.","公众信任取决于解释这些区别，而不是把每一种怀疑都说成事实。"]]},{"t":"Reading a City in Crisis","s":[["During a financial crisis, criticism may focus on a curb in public spending rather than the conditions that caused it.","金融危机期间，批评可能集中在削减公共开支上，而不是导致危机的条件上。"],["Damp housing, missed dental care and a prolonged depression can affect residents in ways that budget figures do not capture.","潮湿的住房、被耽误的牙科治疗和长期萧条会以预算数字无法呈现的方式影响居民。"],["The dazzle of a new development should not distract officials from a deadline for repairing older buildings.","新开发项目的光鲜不应让官员忽视修复旧建筑的期限。"],["A delay in publishing demographic data makes democratic debate harder, especially when departments designate different priorities.","人口数据公布延误会妨碍民主讨论，各部门确定的优先事项又不同时尤其如此。"],["If police detain someone by mistake, they should disclose the error promptly rather than wait for pressure from the press.","警方若错误拘留某人，应立即披露这一错误，而不是等到媒体施压。"],["Disparate neighbourhoods can suffer unequally from the same flood, even when it does not devastate the entire city.","即使洪水没有摧毁整座城市，条件迥异的街区所受损失也可能并不相同。"]]},{"t":"Explaining Drought to the Public","s":[["A museum display about drought can explain how water shortages disrupt farming and distract communities from other long-term needs.","关于干旱的博物馆展览可以说明缺水如何扰乱农业，又如何让社区无暇顾及其他长期需求。"],["Staff distribute clear documentation so that visitors understand the domain of each expert rather than treating one dominant account as complete.","工作人员分发清晰的资料，使参观者了解每位专家的研究领域，而不是把一种占主导地位的说法当作全部事实。"],["A dramatic photograph may attract attention, but durable solutions depend on eco-friendly water use and patient planning.","引人注目的照片或许能吸引关注，但持久的解决方案有赖于环保用水和耐心规划。"],["An elaborate model can show why elderly residents are vulnerable and why simple efficiency measures eliminate unnecessary waste.","精细的模型可以说明老年居民为何容易受影响，以及简单的节能措施为何能消除不必要的浪费。"],["When a precise cause remains elusive, an encyclopaedia or specialist archive can provide background without pretending to offer a final answer.","确切原因仍难以查明时，百科全书或专业档案可以提供背景，而不必假装已有最终答案。"]]},{"t":"Farming Responsibly Near the Equator","s":[["An entrepreneur farming near the equator must plan for rain that arrives erratically instead of relying on a fixed seasonal calendar.","在赤道附近经营农业的企业家必须应对无规律到来的降雨，而不能只依赖固定的季节历。"],["On an established estate, ethical management means refusing to exploit workers during a famine or extend hours without fair pay.","在既有庄园里，合乎伦理的管理意味着饥荒时不剥削工人，也不在没有合理报酬的情况下延长工时。"],["Evidence from a small experiment may eventually help farming methods evolve, although an exhausted team can misread the first results.","小型实验的证据最终可能推动耕作方法演变，不过筋疲力尽的团队可能误读最初结果。"],["An exceptional harvest deserves explicit records showing what was planted, how water was used and which soil extract was tested.","获得异常丰收时，应明确记录种植内容、用水方式以及受检土壤提取物。"],["Careful records allow later researchers to distinguish a genuine improvement from a fortunate change in the weather.","细致的记录能让后来的研究人员区分真正的改进与侥幸的天气变化。"]]},{"t":"Studying a Coastal Habitat","s":[["Because research funds are finite, scientists studying the fitness of a coastal species must decide which questions deserve priority.","研究经费有限，研究沿海物种适应能力的科学家必须决定哪些问题值得优先考虑。"],["A severe freeze can be a foe to young plants, and a single fragment of ice-damaged tissue may reveal how they responded.","严重冰冻可能成为幼苗的大敌，一小片受冰害的组织就能揭示它们如何作出反应。"],["Researchers fulfill the study’s aims by recording each gene in a consistent format and using a graphic to compare the surviving groups.","研究人员以统一格式记录每个基因，并用图表比较存活下来的各组，以此实现研究目标。"],["The habitat beside the harbor offers little shelter, so birds there face hardship whenever the weather turns harsh.","港口旁的栖息地缺少遮蔽，天气变得严酷时，那里的鸟类就会面临艰难处境。"],["A clear hypothesis about this pressure allows the team to estimate the impact of storms instead of merely describing the damage.","围绕这种压力提出清晰假设，团队就能估计风暴的影响，而不只是描述损害。"],["Even a gifted student needs the same disciplined records as everyone else.","即使是有天赋的学生，也需要像其他人一样做严谨规范的记录。"]]},{"t":"Working and Talking in a Shared Space","s":[["An impressive result is not acceptable unless the work was conducted in accordance with the agreed procedure.","除非工作按照约定程序进行，否则再出色的结果也不能被接受。"],["An inaccurate label can mislead the next team, while an inactive sensor may leave a gap in the record.","不准确的标签会误导下一组人员，而不工作的传感器可能使记录出现缺口。"],["Choosing only dramatic findings is inappropriate; researchers should not indulge a preference that makes ordinary evidence disappear.","只挑选引人注目的发现并不恰当，研究人员不应纵容这种让普通证据消失的偏好。"],["The final installment of funding depends on careful analysis, not on a show of intelligence unsupported by results.","最后一期经费取决于细致分析，而不是没有结果支撑的才智展示。"],["Intense interaction can improve a seminar, but interference with a speaker’s argument may interrupt the point before it is fully explained.","热烈的互动能改善研讨效果，但干扰发言者的论证可能在观点讲清之前就把它打断。"],["An introverted participant may contribute more in a quiet interior, where discussion leaves room for reflection.","在安静的室内，内向的参与者可能贡献更多，因为讨论给思考留出了空间。"]]},{"t":"Observing Wildlife in the Field","s":[["A field project should involve local guides, whose keen eye can identify a mammal from details that visitors overlook.","野外项目应让当地向导参与，他们敏锐的眼光能从来访者忽略的细节中辨认出哺乳动物。"],["Each label needs a location and date, since a lack of context makes the landscape difficult to interpret later.","每个标签都需要地点和日期，因为缺少背景会使这片景观日后难以解读。"],["The likelihood of finding an injured limb is low, but every observation belongs in the same log.","发现受伤肢体的可能性不大，但每次观察都应记入同一份日志。"],["A linguistic note may explain a local name, while a sketch shows whether a track is lopsided or mainly straight.","一条语言学注释可以解释当地名称，一幅草图则能显示足迹是歪斜还是基本笔直。"],["When a camera begins to malfunction, the team may still manage to do its survey by hand.","相机出现故障时，团队仍可设法用手工方式完成调查。"],["Fatigue can manifest as slower reactions, and quiet observers should still get a look-in when rare sightings are discussed.","疲劳会表现为反应变慢，讨论罕见目击记录时，也应让不爱说话的观察者有参与的机会。"]]},{"t":"Monitoring a Marine Reserve","s":[["A workshop can manufacture a simple monitor for a marine reserve, but its mechanism must withstand moisture and salt.","工坊可以为海洋保护区制造简易监测器，但其机械结构必须经得起水汽和盐分的侵蚀。"],["Meteorological records help explain when animals migrate and whether a falling mercury column signals an approaching storm.","气象记录有助于解释动物何时迁徙，以及水银柱下降是否预示风暴临近。"],["Researchers also note where animals mate, distinguishing a repeated motif in behaviour from a change caused by the weather.","研究人员还记录动物交配地点，区分反复出现的行为模式与天气引起的变化。"],["A mould used to copy footprints must not harm native plants or disturb nocturnal species.","用于复制足迹的模具不能伤害本地植物，也不能打扰夜行物种。"],["The norm is to leave no trace, since a reserve gains notoriety quickly when visitors damage what they came to see.","通常的做法是不留痕迹，因为游客一旦破坏前来观赏的对象，保护区很快就会声名狼藉。"],["A mental map of the coast complements the instruments by helping observers remember small changes between visits.","头脑中的海岸地图可以补充仪器记录，帮助观察者记住两次到访之间的细微变化。"]]},{"t":"Keeping a Field Visit Safe","s":[["The objective of a field visit should be clear, because an obligation written in obscure language is easy to misunderstand.","野外考察的目标应当清楚，因为用晦涩语言写成的义务条款很容易被误解。"],["Before setting out, teams obtain an official permit and report any odd odour or offensive waste near the site.","出发前，团队要取得官方许可，并报告场地附近任何异常气味或令人不适的废弃物。"],["The optimum route is not always the shortest, and an ordinary organ can suffer when basic health guidance is ignored.","最佳路线不一定最短，而基本健康指导被忽视时，一个普通器官也可能受到损害。"],["In severe weather, continuing is out of the question, and drivers must not overtake simply to overcome a delay.","天气恶劣时，继续前进根本不可行，司机也不能为了弥补延误就贸然超车。"],["Panic can paralyse judgement, but calm preparation keeps safety paramount throughout the journey.","恐慌会使判断陷入瘫痪，而冷静准备能让安全在整个行程中始终居于首位。"]]},{"t":"Conducting a Community Survey","s":[["People who participate in a long survey need patient explanations, especially during the peak phase when physical examinations take time.","参加长期调查的人需要耐心解释，在身体检查耗时的高峰期尤其如此。"],["A permit may be required for interviews, and researchers must persuade pessimistic residents that their information will be used responsibly.","访谈可能需要许可，研究人员还必须说服态度悲观的居民，让他们相信信息会得到负责任的使用。"],["There are plenty of ethical ways to present a plot of the results; there is no excuse to plagiarise another team’s work.","用结果绘图有很多合乎伦理的方式，没有任何理由抄袭另一团队的工作。"],["A portable scanner can record responses in remote homes, where poverty may otherwise prevent people from travelling.","便携式扫描仪可以在偏远家庭记录回答，否则贫困可能使居民无法出行。"],["Researchers can pose sensitive questions without asking anyone to perform for an audience.","研究人员可以提出敏感问题，而无须让任何人在观众面前表演。"],["Praise should go to careful fieldwork rather than to the most dramatic conclusion.","值得赞扬的是细致的田野工作，而不是最耸人听闻的结论。"]]},{"t":"Planning Cleaner Water and Public Spaces","s":[["It is difficult to predict how a town will react to a radical plan for cleaner water and more recreation.","对于一项改善水质并增加休闲活动的激进方案，很难预测城镇会作出怎样的反应。"],["A pressing shortage may require private investment, but contracts should prohibit practices that prolong scarcity or reduce quality.","迫切的短缺可能需要私人投资，但合同应禁止延长短缺或降低质量的做法。"],["A plant must purify water across a wide range of conditions before it can promote health and help local businesses prosper.","水厂必须在多种条件下净化水质，才能促进健康并让当地企业兴旺。"],["Engineers who qualify through rigorous training can explain a rare fault and measure its rate of occurrence.","通过严格培训取得资格的工程师能够解释罕见故障，并测量其发生率。"],["A reduction in waste is usually cheaper than expanding supply, provided the system is maintained properly.","只要系统得到妥善维护，减少浪费通常比扩大供水更省钱。"]]},{"t":"Restoring a Scenic Ruin","s":[["A proposal to revive a scenic ruin should refer to historical evidence and undergo a public rehearsal before work begins.","修复风景优美遗址的提案应参考历史证据，并在开工前进行公开演练。"],["The council may reject a design that is not relevant to the site, even if it promises to make visitor numbers soar.","即使某个设计承诺让游客数量激增，只要与遗址无关，议会也可能予以否决。"],["Religious associations and reluctant residents deserve a hearing, because responsible restoration cannot rely solely on commercial support.","宗教团体和心存疑虑的居民都应得到表达意见的机会，因为负责任的修复不能只依靠商业支持。"],["Architects reproduce original details only after careful revision, since an inaccurate copy could ruin the building’s character.","建筑师只有经过仔细修订才会复制原有细节，因为不准确的复制品可能破坏建筑特色。"],["New trees provide shade, while independent review addresses skepticism about cost and long-term care.","新栽的树木提供阴凉，独立审查则回应人们对费用和长期维护的怀疑。"]]},{"t":"Resolving a Dispute Over Land","s":[["A solicitor can steer a land dispute through each term of the agreement without allowing one party to claim supremacy.","律师可以依据协议的每项条款引导土地争议的处理，同时不让任何一方占据支配地位。"],["A long stride across the site may stimulate discussion, but physical confidence should not replace the substance of the evidence.","大步走过现场或许能激发讨论，但身体上的自信不能取代证据的实质内容。"],["When owners subdivide a field, subtle changes in drainage can create tension between neighbours.","土地所有者细分田地时，排水的细微变化可能造成邻里关系紧张。"],["A suspicious buyer may succumb to pressure unless the contract clearly states what a sufficiency of water means for sustainable use.","除非合同明确说明充足水量对可持续利用意味着什么，否则多疑的买家也可能屈服于压力。"],["New rules supersede outdated ones, but they should not suppress legitimate questions about a recurring symptom of pollution.","新规则取代过时规定，但不应压制人们对某种反复出现的污染症状提出的合理疑问。"]]},{"t":"Reporting on a Tropical Crossing","s":[["Throughout the tropical season, goods in transit pay a toll before crossing a bridge that bears little trace of its original paint.","在整个热带季节，运输途中的货物过桥前要缴纳通行费，而桥上几乎看不到原有油漆的痕迹。"],["A tremendous storm can trigger a violent rise in the river, making damage visible far beyond the crossing.","一场巨大的风暴可能引发河水猛烈上涨，使远在渡口之外的地方也能看到破坏。"],["An unbiased report should provide a visual record of the flood and a balanced view of its effect on well-being.","公正的报告应提供洪水的图像记录，并平衡呈现它对身心健康的影响。"],["A uniform procedure helps inspectors compare sites, while valuable equipment must be versatile enough for remote conditions.","统一程序有助于检查人员比较不同地点，而贵重设备必须足够多用，才能适应偏远环境。"],["Music and shared traditions can transcend local boundaries, offering comfort while practical repairs continue.","音乐和共同传统可以跨越地方边界，在实际修复继续进行时带来慰藉。"]]}],"4":[{"t":"Travelling to an Island Reserve","s":[["Visitors have to reserve a berth in advance, since the international ferry has limited space and may adjust its departure time.","游客必须提前预订铺位，因为国际渡轮空间有限，还可能调整出发时间。"],["The fee includes a transfer to the harbour, while export goods travel separately in the hold.","费用包含前往港口的接送，出口货物则单独装在货舱里运输。"],["The island was established as a reserve to protect the diversity of its vegetation and the habitat of native animals.","这座岛被设立为保护区，以保护植被的多样性和本地动物的栖息地。"],["Wind is the most striking feature, and young people sometimes emigrate because there is little year-round work.","风是这里最显著的特点，年轻人有时因常年工作机会少而移居外地。"],["Food is available near the landing stage, but the quiet interior of the island feels far removed from the busy port.","码头附近有食物供应，但岛内安静的环境让人感觉远离了繁忙的港口。"]]},{"t":"A Gallery by the Coast","s":[["The gallery’s tradition of free entry attracts press coverage and online publicity, especially when a new artwork is displayed beside the garden statue.","这座美术馆免费开放的传统吸引了媒体报道和网络宣传，新作品在花园雕像旁展出时尤其如此。"],["Visitors who are allergic to flowers can avoid the courtyard and join a fitness session indoors instead.","对花过敏的游客可以避开庭院，改去室内参加健身活动。"],["Evening entertainment often includes a movie, and the top-floor café serves food with a view across the coastline.","晚间娱乐通常包括电影，顶楼咖啡馆则供应餐食，还能眺望海岸线。"],["A picture stolen in 1998 was recovered, but the jewellery taken with it never returned to the collection.","一九九八年失窃的一幅画已经找回，但一同被盗的珠宝始终没有回到馆藏中。"],["A small geology display connects the artwork with the surrounding countryside, where soft rock meets an increasingly urban coastline.","一个小型地质展把艺术作品与周边乡村联系起来，那里的松软岩层正对着日益城市化的海岸。"]]},{"t":"Life Around the Bay","s":[["The protected environment is usually quiet, although the town becomes noisy in August when visitor numbers approach the car park’s capacity.","受保护的环境通常很安静，不过八月游客数量接近停车场容量时，镇上会变得喧闹。"],["An outdoor pool sits near the bay, but accommodation is scarce and many visitors have to stay in a more remote place.","海湾附近有一个露天泳池，但住宿很少，许多游客只能住在更偏远的地方。"],["The advantage of the village is its peaceful setting; the disadvantage is the infrequent bus to the urban centre.","村庄的优点是环境宁静，缺点是开往市中心的公交车很少。"],["For ordinary people, daily life depends more on local work and education than on the short tourist season.","对普通居民来说，日常生活更多依靠本地工作和教育，而不是短暂的旅游季。"],["Students from the area often leave for further study, while others learn practical skills through small community projects.","当地学生常外出深造，另一些人则通过小型社区项目学习实用技能。"],["The purpose of these projects is to give young residents a structure for training without forcing them to move away.","这些项目旨在为年轻居民提供有体系的培训，而不必迫使他们离开家乡。"]]},{"t":"Learning Through Group Work","s":[["A good course provides reference materials and draws on extensive expertise, while giving each student a clear purpose for reading.","好的课程会提供参考资料、运用广泛的专业知识，并让每位学生明确阅读目的。"],["The group meets weekly, and members associate each approach with the kind of problem it is most likely to improve.","小组每周碰面，成员会把每种方法与它最可能改善的问题联系起来。"],["Constructive feedback can motivate people to try hard, especially when they find a difficult text or misunderstand its central question.","建设性的反馈能激励人们努力，尤其是在遇到难懂的材料或误解核心问题时。"],["Tutors should not overlook confusion or omit an awkward result, because both can reveal an opportunity for better teaching.","导师不应忽视困惑，也不应略去尴尬的结果，因为两者都可能揭示改进教学的机会。"],["Careful discussion may prevent a minor error from spreading through the whole project.","仔细讨论可以防止一个小错误扩散到整个项目。"]]},{"t":"Checking an Experimental Result","s":[["Weather can affect the readings, so the analysis must distinguish a genuine result from an unusual afternoon.","天气会影响读数，因此分析必须区分真实结果与某个反常下午造成的数据。"],["The department will support the work, but the room is not ideal and rigorous rules restrict it to four people.","系里会支持这项工作，但房间并不理想，严格规定还把人数限制在四人以内。"],["Two entries looked similar, and one particular copy was kept for comparison while the rest were returned.","两份材料看起来相似，其中一份特定副本被留下作比较，其余都已归还。"],["The statistics were checked twice, with the maximum and minimum recorded separately from the initial estimate.","统计数字核查了两遍，最大值和最小值与最初估计分开记录。"],["Because space was limited, the team had to shorten the trial rather than handle every sample on the same day.","由于空间有限，团队不得不缩短试验，而不能在同一天处理所有样本。"]]},{"t":"Revising Plans for a Public Hall","s":[["A decrease in the budget exposed the lack of a fire exit, and the large amount of money needed for repairs surprised the majority.","预算减少暴露了缺少消防出口的问题，修复所需的大笔资金也让大多数人感到意外。"],["At present, visitor numbers are double those of ten years ago, and more than half of all guests arrive in July.","目前游客数量是十年前的两倍，而且超过一半的访客在七月到来。"],["Staff update the website every month, but the newest signs are already out of date and the ancient crossing will close soon.","工作人员每月更新网站，但最新的标牌已经过时，古老的渡口也很快要关闭。"],["A temporary entrance opened in March, with a September deadline for agreeing a permanent solution.","临时入口于三月启用，确定永久解决方案的截止日期是九月。"],["The fair now comes more often, and the annual show brings additional pressure on seating and staff.","如今集市举办得更频繁，年度展览也给座位和工作人员带来了额外压力。"]]},{"t":"Order and Safety in a Store Room","s":[["Items in the store room are classified by size, and the boxes below the window sit behind the bins beside a small desk.","储藏室的物品按大小分类，窗下的箱子放在垃圾桶后面，旁边有一张小桌。"],["Two trolleys are available for boring routine tasks, which staff repeat every day to keep the entrance clear.","有两辆推车可用于乏味的日常工作，员工每天重复这些工作，以保持入口畅通。"],["The trend in recent figures shows a risky build-up of rubbish near poisonous cleaning products.","近期数据的趋势显示，有毒清洁用品附近正危险地堆积垃圾。"],["A warning notice tells everyone to handle old pipes with care and report any injury, however small.","警示通知要求每个人小心搬运旧管，并报告任何伤害，无论伤势多轻。"],["Someone tried to steal fuel from the military store, so guards now protect the site throughout the night.","有人企图从军事仓库偷燃料，因此警卫现在整夜守卫这处场地。"]]},{"t":"Organising Access and Community Services","s":[["The old base still uses military tactics in its emergency planning, but residents cannot rely on public transport after ten.","这座旧基地在应急预案中仍采用军事策略，而居民在十点后无法依靠公共交通。"],["Air travel is cheaper than it was, while space travel remains too expensive for ordinary passengers.","航空旅行比过去便宜，太空旅行对普通乘客来说仍然过于昂贵。"],["The form asks for specific travel dates, and any special request should be stated in clear language.","表格要求填写具体旅行日期，任何特别要求也都应写得清楚。"],["An October freeze once closed the road, leaving the youth group isolated for several days.","十月的一次冰冻曾使道路封闭，让青年小组与外界隔绝了好几天。"],["The organization has forty members, and one coordinator helps organize events for all ages and every occupation.","这个组织有四十名成员，一位协调人帮助组织面向各年龄段和各种职业的活动。"],["Members produce a magazine twice a year, while two volunteers administer the money and an old mate of the manager runs the bar.","成员每年制作两期杂志，两名志愿者管理经费，经理的一位老伙伴负责吧台。"]]},{"t":"Renovating a Round Hotel","s":[["The tower is round, with a shape like a drum, so its rooms are awkward to furnish despite cheap rates and a student discount.","塔楼是圆的，形状像一面鼓，因此房间很难布置家具，尽管价格便宜，还有学生折扣。"],["The manager gave the order to renovate the top floor in May and initially tried to run the project alone.","经理五月下令翻修顶楼，起初还试图独自管理这个项目。"],["Her hospitality is well-known, and two staff members specialize in tours of the old quarter.","她热情好客出了名，还有两名员工专门负责老城区导览。"],["The kitchen is the busiest part of a typical morning, but the closure of the pool depressed everyone for weeks.","在平常的早晨，厨房是最忙的地方，而泳池关闭曾让大家连续几周情绪低落。"],["Cars are uncommon nearby, so plans to expand accurately mapped walking routes and enhance the river bank.","附近汽车很少，因此扩建方案精确绘制了步行路线，并改善河岸环境。"],["A path climbs past the hotel toward the old power station, giving guests a pleasant route through the district.","一条小路从酒店旁向上延伸，通往旧电站，为客人提供了一条宜人的城区游览路线。"]]},{"t":"Reusing an Old Power Station","s":[["The power station burned coal for sixty years, and fuel arrived by rail before the building was refurbished in 2004.","这座电站烧了六十年煤，燃料由铁路运来，建筑后来在二〇〇四年翻修。"],["A sale of the flats took a year, reflecting a general preference for houses and a lack of trust in industrial conversions.","这些公寓卖了一年才售完，反映出人们普遍偏爱独立住宅，也不信任工业建筑改造。"],["One resident donated an old computer with a handy list of instructions, then offered to demonstrate its straightforward controls.","一位居民捐了一台旧电脑，附上一份方便使用的操作说明，还主动演示简单明了的控制方法。"],["The most important rule is to turn it off at night, especially when the machine has been running all day.","最重要的规则是晚上把它关掉，机器整天运行时尤其如此。"],["In the workshop, instructors ask students to visualize each piece before starting work, because repetition builds accuracy and confidence.","在工坊里，老师让学生开始制作前先想象每件成品，因为反复练习能提高准确度和信心。"],["Poor light and dust remain concerns, since a durable finish takes time and airborne particles are a pollutant.","光线差和粉尘仍是问题，因为耐久的表面处理需要时间，而空气中的颗粒属于污染物。"],["A disused tunnel lies beneath the car park, where volunteers continue to record information about the site’s industrial history.","停车场下方有一条废弃隧道，志愿者继续在那里记录有关这处场地工业历史的资料。"]]}]}, CHS={"1":[["resemble","v. 像，与……相似","like · look · be similar to"],["recognize","v. 认出，识别；承认","perceive · acknowledge · realize · appreciate · admit · identify · comprehend · understand know"],["adjust","v. 调整，使适合","change · modify · shift · alter"],["approach","n. 方法","method · way"],["fundamental","adj. 基本的，基础的","rudimentary · preliminary · basic"],["rely on","依靠，依赖","depend on"],["domestic","adj. 家庭的；国内的","home · local · national"],["measure","v. 测量","calculate · assess · evaluate"],["trait","n. 特性，特征","characteristic · feature · property"],["coin","v. 创造","first used · invent"],["artificial","adj. 人造的，仿造的","synthetic · man-made"],["prompt","v. 促进，激起","initiate · immediately"],["exchange","v. 交换","share · apply A to B"],["underlie","v. 成为……基础","based on · ground · root"],["ignore","v. 忽视，不顾","neglect · overlook · underestimate"],["fertiliser","n. 化肥，肥料","chemical · toxic · unnatural"],["rather than","而非，不是","but · yet · however · whereas · nonetheless · nevertheless · although · notwithstanding though · instead"],["thanks to","由于，幸亏","stem from · derive · owing to · due to · according to · because of · on account of · as a result of · leading to · because · since · for · in that · as · therefore · hence"]],"2":[["diversity","n. 多样性，差异","variety · difference"],["detect","v. 查明，发现","find · look for · seek · search"],["isolate","v. 使隔离，使孤立","inaccessible"],["avoid","v. 避免","escape · evitable"],["budget","n. 预算","fund · financial"],["ad function forms(w){

 if(sp>-1){
  var head=w.slice(0,sp), rest=w.slice(sp), out=[w], bs=forms(head), i;
  for(i=0;i<bs.length;i++) out.push(bs[i]+rest);
  if(head==='be') out.push('is'+rest,'are'+rest,'was'+rest,'were'+rest,'been'+rest,'being'+rest);
  return out;
 }
 var f=[w,w+'s',w+'es',w+"'s",w+'ed',w+'ing',w+'ly'];
 if(/e$/.test(w)) f.push(w+'d', w.slice(0,-1)+'ing');
 if(/y$/.test(w)) f.push(w.slice(0,-1)+'ies', w.slice(0,-1)+'ied');
 if(/or$/.test(w)) f.push(w.slice(0,-2)+'our');
 if(/ize$/.test(w)) f.push(w.slice(0,-3)+'ise');
 if(/yze$/.test(w)) f.push(w.slice(0,-3)+'yse');
 return f;
}

 }
 fm.sort(function(a,b){ return b.length-a.length });
 RE[ch]={re:new RegExp('(?<![A-Za-z])('+fm.map(esc).join('|')+')(?![A-Za-z])','gi'), map:map};

}

var RAD={'\u2ecb':'车','\u2ed3':'长','\u2edb':'风','\u2edd':'食','\u2ee2':'马','\u2ec4':'西',
 '\u2ec5':'见','\u2ec6':'角','\u2ea0':'民','\u2ee3':'骨','\u2ed8':'青','\u2edc':'飞','\u2ee9':'黄',
 '\u2ed4':'门','\u2ee8':'麦','\u2ee5':'鱼','\u2ef0':'龙','\u2ee6':'鸟','\u2eec':'齐','\u2ec1':'虎',
 '\u2ee4':'鬼','\u2eee':'齿','\u2eda':'页','\u2ec9':'贝'};
function normCJK(s){ return s.replace(/[\u2E80-\u2FDF]/g, function(c){ return RAD[c]||c }) }
function glossFrags(mean){
 if(!mean) return [];
 var t=normCJK(String(mean)).replace(/[（(][^）)]*[）)]/g,' ').replace(/(v|n|adj|adv|prep|conj|int|num|pron|vt|vi|phrase|aux|art|abbr)\./g,' ');
 var out=[], segs=t.split(/[；;，,、\/|]/);
 for(var i=0;i<segs.length;i++){
  var x=segs[i].replace(/[\s.…]/g,'').replace(/某人|某物|某事/g,'');
  if(x.length>=2 && /[\u4e00-\u9fff]/.test(x)) out.push(x);
 }
 return out;
}

function gl(ch){

 var m={}, L=CHS[ch]||[];
 for(var i=0;i<L.length;i++){ m[L[i][0]]=glossFrags(L[i][1]); }

function zhMark(zh, hits, G){
 if(!zh||!hits||!hits.length) return zh;
 var spans=[], i, j, k;
 for(i=0;i<hits.length;i++){
  var fr=G[hits[i]]||[], best=null;
  for(j=0;j<fr.length;j++){
   var f=fr[j], cands=[f];
   if(f.length>2){ cands.push(f.slice(0,2)); cands.push(f.slice(-2)); }
   for(k=0;k<cands.length;k++){
    var c=cands[k];
    if(c.length<2) continue;
    var p=zh.indexOf(c);
    if(p>=0 && (!best || c.length>best.sc)) best={s:p,e:p+c.length,sc:c.length};
   }
  }
  if(best) spans.push(best);
  else if(fr.length && !/[的地性化度者]$/.test(fr[0])){
   var ch0=fr[0].charAt(0);
   if(ch0 && '而就都也又还在是有把被让使对给从向跟和与或的地得着了过们'.indexOf(ch0)<0
      && zh.split(ch0).length===2){ spans.push({s:zh.indexOf(ch0),e:zh.indexOf(ch0)+1,sc:1}); }
  }
 }
 if(!spans.length) return zh;
 spans.sort(function(x,y){ return y.sc-x.sc || x.s-y.s });
 var keep=[];
 for(i=0;i<spans.length;i++){
  var sp=spans[i], ok=1;
  for(j=0;j<keep.length;j++){ if(sp.s<keep[j].e && keep[j].s<sp.e){ ok=0; break; } }
  if(ok) keep.push(sp);
 }
 keep.sort(function(x,y){ return x.s-y.s });
 var out='', last=0;
 for(i=0;i<keep.length;i++){
  out+=zh.slice(last,keep[i].s)+'<b class="zw">'+zh.slice(keep[i].s,keep[i].e)+'</b>';
  last=keep[i].e;
 }
 return out+zh.slice(last);
}

function findSent(p, w){
 var fs=forms(w).map(function(x){ return x.toLowerCase() }), k, j;
 for(k=0;k<p.s.length;k++){
  var t=p.s[k][0], m=t.match(/[A-Za-z][A-Za-z'\u2019-]*/g)||[];
  for(j=0;j<m.length;j++){
   if(fs.indexOf(m[j].toLowerCase())>-1) return {t:t, zh:p.s[k][1], form:m[j]};
  }
 }
 return null;
}
function pieceWords(i){

 if(!pass) return [];
 var ws=(pass.getAttribute('data-ws')||'').split('|'), ps=TXT[ch][i]||{s:[]}, out=[];
 for(var k=0;k<ws.length;k++){
  var w=ws[k];
  if(!w||!TT.m[w]) continue;
  var s=findSent(ps,w);
  out.push({w:w, m:TT.m[w]||'', e:s?s.t:'', z:s?s.zh:''});
 }
 return out;
}
var RCH={};
function chapterWords(){
 if(RCH[ch]) return RCH[ch];
 var heads=CHS[ch]||[], ps=TXT[ch]||[], out=[];
 for(var i=0;i<heads.length;i++){
  var w=heads[i][0], hit=null;
  for(var j=0;j<ps.length&&!hit;j++) hit=findSent(ps[j],w);
  out.push({w:w, m:TT.m[w]||heads[i][1]||'', e:hit?hit.t:'', z:hit?hit.zh:''});
 }
 RCH[ch]=out; return out;
}

function rstart(mode, i){

 if(!arr.length){ toast('这里还没有可背的词'); return }

  arr=arr.filter(function(r){ var o=m[r.w]; return o&&(o.due||0)<=now&&(o.lv||0)<7 });
  if(!arr.length){ toast('没有到期的词，取消「只背到期」可以全部过一遍'); return }

 arr.sort(function(a,b){ var da=(m[a.w]&&m[a.w].due)||0, db=(m[b.w]&&m[b.w].due)||0; return da-db });
 RB.mode=mode; RB.pi=i||0; RB.list=arr; RB.idx=0; RB.yes=0; RB.no=0; RB.waiting=false; RB.open=true;
 rbuild();
 var nDue=arr.filter(function(r){ var o=m[r.w]; return o&&(o.due||0)<=now&&(o.lv||0)<7 }).length;

 document.getElementById('rcinfo').textContent=(mode==='c'?'本组 ':'本篇 ')+arr.length+' 词 · 到期 '+nDue+' · 未背过 '+nNew;

  ? '记住 <b>'+ok+'</b> 次 · 没记住 <b>'+wr+'</b> 次'
  : '第一次见这个词，凭感觉选就行';

function rgrade(ok){

 else { o.lv=0; o.due=Date.now()+10*6e4; o.wr=(o.wr||0)+1; o.ok=o.ok||0; addBook(r.w) }
 o.rv=(o.rv||0)+1; o.lrt=Date.now(); o.ch=ch;

  var base=(RB.mode==='c'?'本组 ':'本篇 ')+RB.list.length+' 词';

function rfmt(ms){

 if(diff<=0) return '现在';
 if(diff<3600e3) return Math.max(1,Math.round(diff/6e4))+' 分钟后';
