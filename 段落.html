<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>分章短文 · 雅思考点词</title>
<style>
:root{--bg:#f7f6f2;--panel:#fff;--ink:#1f2328;--ink2:#5b6470;--line:#e6e2da;--chip:#efece6;
 --accent:#0f766e;--acc-soft:#eaf4f2;--mark:#d7ece8;--green:#1f7a52;--warn:#b4452e;--serif:"Iowan Old Style","Palatino Linotype",Georgia,"Songti SC",serif}
html.dark{color-scheme:dark;--bg:#14181a;--panel:#1b2124;--ink:#e8eaed;--ink2:#9aa3ad;--line:#2b3236;
 --chip:#232b2e;--acc-soft:#16302d;--mark:#1d4a44;--green:#6cc38b;--warn:#f0776a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 -apple-system,BlinkMacSystemFont,
 "PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;padding-bottom:80px;
 -webkit-text-size-adjust:100%}
.wrap{max-width:820px;margin:0 auto;padding:0 18px}
header{padding:26px 0 8px}
h1{margin:0;font-size:24px;font-weight:750;letter-spacing:-.3px}
.sub{color:var(--ink2);font-size:13px;margin-top:6px;line-height:1.65}
.back{display:inline-block;font-size:13px;color:var(--ink2);text-decoration:none;border:1px solid var(--line);
 border-radius:999px;padding:3px 12px;margin-bottom:14px;background:var(--panel)}
.back:hover{color:var(--accent);border-color:var(--accent)}
#chs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 4px}

 color:var(--ink2);border-radius:9px;padding:5px 10px;line-height:1.2}
.cb:hover{border-color:var(--accent);color:var(--accent)}
.cb.on{background:var(--accent);border-color:var(--accent);color:#fff}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 0 10px;
 border-top:1px solid var(--line);padding-top:13px}
.ttl{font-size:17px;font-weight:700;letter-spacing:-.2px}
.ttl em{font-style:normal;color:var(--ink2);font-weight:500;font-size:13px;margin-left:7px}
.acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.acts button{font:inherit;font-size:12.5px;font-weight:650;border-radius:9px;cursor:pointer;
 border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 11px}
.acts button:hover{border-color:var(--accent);color:var(--accent)}
.acts button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.cov{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:14px}
.cv1{display:flex;align-items:baseline;gap:8px;font-size:12.8px;color:var(--ink2);flex-wrap:wrap}
.cv1 b{font-size:15px;color:var(--accent);font-variant-numeric:tabular-nums}
.cvp{height:5px;border-radius:3px;background:var(--chip);margin-top:8px;overflow:hidden}
.cvp i{display:block;height:100%;background:var(--accent);border-radius:3px}
.cov details{margin-top:4px}
.cov summary{font-size:12.5px;color:var(--ink2);cursor:pointer;list-style:none;outline:none}
.cov summary::-webkit-details-marker{display:none}
.cov summary:hover{color:var(--accent)}
.left{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.left span{font-size:12px;background:var(--chip);color:var(--ink2);border-radius:6px;padding:2px 7px;cursor:help}
.pass{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:15px 17px 11px;margin-bottom:12px}
.ph{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.pn{font-size:11px;font-weight:800;letter-spacing:.5px;color:var(--accent);background:var(--acc-soft);
 border-radius:5px;padding:2px 6px;font-variant-numeric:tabular-nums}
.pt{font-size:14.5px;font-weight:700}
.ph .say{margin-left:auto}
.ps{margin:0}
.ps .pen{margin:0;font:16.4px/1.78 var(--serif);letter-spacing:.1px;color:var(--ink)}
.ps .pzh{margin:9px 0 0;font-size:13px;line-height:1.8;color:var(--ink2);
 padding-top:9px;border-top:1px dashed var(--line)}
.sn{padding:0;border-radius:3px;transition:background .15s}
.sn .en{color:inherit}
/* 段落版 */
body.para .ps .pen{text-align:justify;text-justify:inter-word;hyphens:auto}
body.para .sn{display:inline}
body.para .sn .zh{display:none}
body.para .ps .pzh{display:block;text-align:justify}
/* 逐句版 */
body.sent .sn{display:block;margin:0 0 12px;padding:1px 4px}
body.sent .sn:last-of-type{margin-bottom:0}
body.sent .sn .en{display:block;font:16.4px/1.62 var(--serif)}
body.sent .sn .zh{display:block;font-size:12.6px;line-height:1.55;color:var(--ink2);margin-top:2px}
body.sent .ps .pzh{display:none}
.ps .zh b,.ps .pzh b{font-weight:800;color:var(--ink)}
body.nozh .ps .pzh,body.nozh .sn .zh{display:none}
.sn.cur{background:var(--acc-soft);box-shadow:none;border-radius:3px}
.sn.cur .en{color:var(--accent)}
mark.pv{background:none;color:inherit;cursor:pointer;padding:0 1px;border-radius:2px;font-weight:680;
 box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--accent) 32%,transparent)}
mark.pv:hover{background:var(--mark);box-shadow:none}
mark.pv.on{background:var(--accent);color:#fff;box-shadow:none}
body.blurred mark.pv{color:transparent;background:var(--chip);box-shadow:none;border-radius:3px}
body.blurred mark.pv.on{color:inherit;background:var(--mark);box-shadow:none}
body.para.blind .ps .pen{filter:blur(4.5px);cursor:pointer;user-select:none}
body.para.blind .ps.rev .pen{filter:none}
body.sent.blind .sn .en{filter:blur(4.5px);cursor:pointer;user-select:none}
body.sent.blind .sn.rev .en{filter:none}
.say{border:0;background:none;cursor:pointer;color:var(--ink2);padding:2px;line-height:0;border-radius:6px}
.say:hover{color:var(--accent);background:var(--acc-soft)}
.say svg{width:15px;height:15px}
.wlist{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px;padding-top:9px;border-top:1px dashed var(--line)}
.wlist span{font-size:11.5px;color:var(--ink2);background:var(--chip);border-radius:5px;padding:1px 6px;cursor:pointer}
.wlist span:hover{color:var(--accent)}
#pop{position:fixed;z-index:90;min-width:180px;max-width:320px;background:var(--panel);border:1px solid var(--line);
 border-radius:12px;box-shadow:0 12px 34px rgba(0,0,0,.18);padding:11px 13px;display:none}
#pop.on{display:block}
#pop .pw{font:700 16px/1.3 var(--serif)}
#pop .pm{font-size:12.8px;color:var(--ink2);margin-top:4px;line-height:1.6}
#pop .ps{font-size:12px;color:var(--accent);margin-top:6px;line-height:1.55;background:var(--acc-soft);
 border-radius:6px;padding:4px 7px}
#pop .pa{display:flex;gap:6px;margin-top:9px}
#pop .pa button{font:inherit;font-size:12px;font-weight:650;border:1px solid var(--line);background:var(--panel);
 color:var(--ink);border-radius:7px;padding:4px 10px;cursor:pointer}
#pop .pa button:hover{border-color:var(--accent);color:var(--accent)}
#pop .pa button.on{background:var(--accent);border-color:var(--accent);color:#fff}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);background:var(--ink);color:var(--bg);
 font-size:13px;padding:8px 16px;border-radius:999px;opacity:0;transition:.22s;pointer-events:none;z-index:99;
 max-width:80vw;text-align:center}
#toast.on{opacity:.95;transform:translate(-50%,0)}
@media (max-width:620px){.wrap{padding:0 12px}h1{font-size:21px}.pass{padding:13px 13px 9px}
 .sn .en{font-size:16px;line-height:1.8}.sn .zh{font-size:12.5px}.ttl{font-size:15.5px;width:100%}
 .acts{margin-left:0;width:100%}.cb{font-size:12px;padding:4px 9px}}

.qz{display:flex;align-items:center;gap:8px;margin-top:9px;padding-top:8px;border-top:1px dashed var(--line)}

 border:1px solid color-mix(in srgb,var(--accent) 26%,transparent);border-radius:7px;padding:3px 10px;cursor:pointer}
.qbb:hover{background:var(--accent);color:#fff;border-color:var(--accent)}

.qh .qn2{font-weight:750;color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:.04em}

 cursor:pointer;padding:1px 3px}

.qq{font:15.5px/1.62 var(--serif);color:var(--ink)}
.qq .qw{font-family:var(--serif);font-size:17px;font-weight:700}
.qq .blank{display:inline-block;min-width:66px;height:1.02em;margin:0 3px;vertical-align:-3px;
 border-bottom:2px solid color-mix(in srgb,var(--accent) 55%,transparent)}
.qzh{display:block;font-size:12.4px;line-height:1.55;color:var(--ink2);margin-top:3px;
 font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
.qo{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}
.qo button{font:inherit;font-size:13px;line-height:1.5;text-align:left;background:var(--panel);color:var(--ink);
 border:1px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer;transition:.12s}
.qo button:hover{border-color:var(--accent);color:var(--accent)}
.qo button .oi{font-size:10.5px;color:var(--ink2);margin-right:6px;font-variant-numeric:tabular-nums}
.qo button.ok{background:var(--panel);border-color:var(--green);color:var(--green);font-weight:650}
.qo button.ok .oi{color:var(--green)}
.qo button.no{border-color:var(--warn);color:var(--warn)}
.qo button.no .oi{color:var(--warn)}
.qo button.dim{opacity:.5}
.qf{font-size:12.4px;line-height:1.6;color:var(--ink2);margin-top:10px;min-height:20px}
.qf:after{content:"";display:block;clear:both}
.qf b{color:var(--ink)}
.qf i{font-style:normal;opacity:.75}
.qf .qy{color:var(--green);font-weight:700}
.qf .qn{color:var(--warn);font-weight:700}
.qf button{font:inherit;font-size:12px;font-weight:650;border-radius:7px;padding:4px 12px;cursor:pointer;
 border:1px solid var(--line);background:var(--panel);color:var(--ink);float:right;margin-left:8px}
.qf button.prim{background:var(--accent);border-color:var(--accent);color:#fff}
.qf button:hover{filter:brightness(1.05)}
.qdone{font-size:13.4px;line-height:1.6}
.qdone b{font-size:16px;color:var(--accent);font-variant-numeric:tabular-nums}
.qbad{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.qbad span{font-size:11.5px;background:var(--panel);color:var(--ink2);border:1px solid var(--line);
 border-radius:5px;padding:1px 7px;cursor:pointer}
.qbad span:hover{color:var(--accent);border-color:var(--accent)}
@media (max-width:620px){.qo{grid-template-columns:1fr}.qzbox{padding:10px 11px 11px}}

 <h1>分章短文</h1>
 <p class="sub">把 538 和 179 的考点词写进小短文里：每篇一段英文，连着读下来是一个完整的意思，下面配一整段中文。加粗带下划线的是本组考点词，点一下看释义和<b>同义替换</b>，可一键收进生词本。每篇底下有「小测」：看句子填词、选中文释义、选英文单词，几个小题当堂检验。</p>

<script>
var TXT={"1":[{"t":"What Can Be Measured","s":[["A trait is what you can measure, and a habit is what you ignore.","特性是你能测量的东西，习惯是你不管的东西。"],["Two leaves may resemble each other, and nobody recognizes the third.","两片叶子可能长得像，第三片就没人认得出。"],["You adjust the light and the plant answers, thanks to one hormone.","你调一下光，植物就回应，全靠一种激素。"],["A domestic variety is smaller, and an artificial one is dearer.","家养的品种小一些，人造的品种贵一些。"],["The fundamental rule underlies every experiment in this room.","基本规律是这间屋子里每个实验的底子。"]]},{"t":"How a Name Is Made","s":[["They coin a name and exchange it for a fee.","他们造一个名字，再拿它换一笔钱。"],["One approach relies on the soil, and another relies on fertiliser.","一种方法是靠土壤，另一种是靠化肥。"],["The prompt was simple, and the exchange of letters took a month.","要求很简单，来回的信却走了一个月。"],["You trust the soil rather than the fertiliser, and the yield says why.","你信土壤而不信化肥，产量会告诉你为什么。"]]}],"2":[{"t":"Setting Up a Study","s":[["A study needs diversity, and a small sample avoids it.","一项研究需要多样性，小样本正好避开了它。"],["You detect a change in the soil and isolate the one cause.","你察觉土壤里的一处变化，再把唯一的原因单独隔出来。"],["You adapt to a budget, or choose an alternative.","你去适应一份预算，或者换一个替代方案。"],["A component fails, and a good design compensates for it.","一个部件坏了，好的设计会把它补上。"],["Military money buys a component, not a result.","军用的钱买的是一个部件，不是一个结果。"]]},{"t":"What Makes a Plan","s":[["The criteria are clear, and the curriculum is not.","标准写得很清楚，课程本身并不清楚。"],["A feasible plan is one you can constrain to a budget.","可行的方案，是你能限制在一份预算里的那个。"],["A deficiency is a gap, and a supplement fills it.","缺陷是一个缺口，补充的东西把它填上。"],["You distinguish two causes, analyze each, and emphasize neither.","你把两个原因分开，各自分析，两个都不强调。"],["An enormous loss is one you cannot analyze in a week.","巨大的损失，是一个礼拜分析不完的那种。"]]},{"t":"Slowing Things Down","s":[["A convention makes it easy to imitate, and a habit makes it automatic.","惯例让人容易模仿，习惯让模仿变成自动的。"],["Noise impairs sleep, and a bad road hinders trade.","噪音削弱睡眠，一条烂路阻碍买卖。"],["A legitimate claim has a document, and a limitation has a date.","正当的要求有一份文件，限制有一个期限。"],["A demanding job determines your week, and an ancient rule your year.","一份苛求的工作决定你的一周，一条古老的规矩决定你的一年。"],["A warm spring accelerates growth, and that is beneficial for a farmer.","暖春让生长加快，这对种地的人是好事。"]]},{"t":"The Body","s":[["A chronic illness is slow, and a beneficial habit is slower.","慢性病来得慢，好习惯见效更慢。"],["A conscious effort minimizes the damage, and nothing else does.","有意识的努力把损害减到最小，别的都不行。"],["A vaccine is imperative in a city, and immunity follows in a month.","在城市里疫苗是必须的，免疫力一个月后跟上。"],["Glands secrete, nerves transmit, and neither asks permission.","腺体分泌，神经传导，两样都不问许可。"],["You exaggerate a fever and call an extinct animal shy.","你把一场发烧说得夸张，还说一种灭绝的动物是害羞。"]]},{"t":"Rights and Losses","s":[["An exclusive deal guarantees nothing, and a witness guarantees less.","独家协议什么都保证不了，证人保证得更少。"],["A son inherits the land, and a magnetic tape keeps the voice.","儿子继承那块地，一盘磁带留着那个声音。"],["A loss leaves one option, and it is usually the cheap one.","一次亏损只留下一个选择，通常是最便宜的那个。"],["Most people prefer to queue less, and a priority lane sells that.","多数人宁愿少排队，优先通道卖的就是这个。"],["A primary cause is the one you can fix, and a principle is not.","主要原因是你修得好的那个，原理不是。"]]},{"t":"How Much and How Many","s":[["A potential buyer asks a specific question and gets a vague answer.","潜在的买家问一个具体问题，得到一个含糊的回答。"],["They settle the price by quantity and never by quality.","他们按数量定价，从不按质量。"],["A specific rule can sophisticate a plain trade.","一条具体的规则能把一门简单的生意搞复杂。"],["A species survives in a narrow range, and a swift change ends it.","一个物种在很窄的范围里存活，一次迅速的变化就终结它。"],["Unexpectedly, the surrounding hills hold water all year.","出乎意料的是，四周的山常年存着水。"]]},{"t":"Who Pays","s":[["An attempt costs a month, and expertise costs ten years.","一次尝试花一个月，专门的技术要花十年。"],["An expertise is a faculty trained for years, and it shows.","一门专长是练了多年的能力，看得出来。"],["You donate money, and the incentive does the rest.","你捐钱，剩下的靠激励去办。"],["Dynamics explains a push, and mortality explains a curve.","动力学解释一次推动，死亡率解释一条曲线。"],["A peripheral road is quiet, and the vicinity is cheap.","外围的路安静，附近的地价便宜。"],["A fire threatens the houses in the vicinity.","一场火威胁着附近一带的房子。"]]},{"t":"Mind and Habit","s":[["Practice makes a habit, and bacteria make a colony.","练习养成习惯，细菌聚成菌落。"],["A coastal town is subject to storms, and its low streets are liable to floods.","海边的小镇容易遭风暴，低处的街道还容易发水。"],["An innate fear needs no lesson, and a pattern needs a second look.","天生的恐惧不用教，一个模式要再看一遍。"],["The original therapy was cheaper, and the new one works faster.","最初的那种治疗更便宜，新的那种见效更快。"],["A confidential report is hard to test, and a cognitive one is harder.","机密报告很难检验，认知方面的更难。"]]},{"t":"Working Together","s":[["You comply with a rule you did not write and consult a man who did.","你遵守一条不是你写的规矩，再去找写它的人商量。"],["A superior officer co-ordinates a plan, and a budget limits it.","上级军官协调一份计划，预算限制这份计划。"],["Co-operation wins a contract, and an incentive retains the staff.","合作赢下一份合同，激励留住人手。"],["Two accounts differ in one detail, and that detail is the cue.","两份说法只差一个细节，那个细节就是线索。"],["A signal can halt a train, and a shout can abandon a plan.","一个信号能让火车停下，一声喊能让计划作废。"]]},{"t":"Holding Together","s":[["A fragile shell retains nothing once it cracks.","脆的壳一裂就什么也留不住。"],["A coastline erodes, and a name vanishes with it.","海岸被冲蚀，一个名字跟着消失。"],["A delivery induces a smile, and a delay induces a call.","东西送到会引出笑，一延误就引出电话。"],["A stable price integrates two markets, and an equal one joins them.","稳定的价格把两个市场连成一体，相等的价格把它们并成一个。"],["They grant a licence for a year, and a budget pays for the year.","他们发一张一年的执照，预算付这一年的钱。"]]}],"3":[{"t":"What Builds Up","s":[["An addictive game accumulates hours, and nobody approves of it.","上瘾的游戏会把小时攒起来，可没人赞成这事。"],["Adversity tests a man, and aggression tests a border.","逆境考验一个人，侵略考验一条边界。"],["An agreeable guest needs no aid, and an allergic one needs a doctor.","好相处的客人不用人帮，过敏的那位要叫医生。"],["Altitude slows a climber, and an application to climb takes a year.","海拔让登山的人慢下来，一份登山申请要一年。"],["Aid arrives late, approval arrives later, and the office assigns blame.","援助来得晚，批准来得更晚，责任由办公室分派。"]]},{"t":"Who Holds the Line","s":[["An array of figures fills a page, and an assignment needs substance.","一排数字占满一页，而一项任务要的是实质内容。"],["An association guards a trade, and an authority guards a border.","协会守着一门行当，当局守着一条边界。"],["Your attitude must be consistent with the rule, and your words must bear it.","你的态度必须跟规则一致，你的话也得担得住它。"],["A blight kills a crop, and a boundary keeps it out.","枯萎病毁一季庄稼，一道界线把它挡在外面。"],["They bungle a simple job, and the bill bears the cost.","一件简单的活被他们办砸了，账单来承担这个代价。"]]},{"t":"What a Town Carries","s":[["A burden is heavy, and a calamity is sudden.","负担是沉的，灾难是突然的。"],["A capacity is a limit, and a catastrophic year tests it.","容量是一个限度，灾难性的一年会来试它。"],["They cater for a crowd and certify the food.","他们给一大群人供餐，还要给食物出证明。"],["A civic duty is quiet, and a comment on it is loud.","公民的义务是安静的，对它的议论是响的。"],["A commitment costs a year, and a communal garden costs a weekend.","一项承诺要一年，一片公共菜园只要一个周末。"]]},{"t":"Getting to Work","s":[["You commute an hour, compare two routes, and conceal the cost.","你通勤一个小时，比较两条路线，还把花费瞒下来。"],["You concentrate on one page and concur with the second.","你专心看第一页，看到第二页就同意了。"],["A committee can confer for a week, and a conflict can end it in an hour.","一个委员会能商量一个礼拜，一场冲突一个小时就把它结束。"],["A conservative estimate confuses nobody, and a radical one confuses everybody.","保守的估计谁也不会弄错，激进的估计谁都弄不明白。"],["A considerable crowd fills the square beyond its capacity.","相当多的人把广场挤到了容量之外。"]]},{"t":"When Something Breaks","s":[["A contingent of guards arrives, and a controversial order follows.","一小队警卫赶到，接着来了一道有争议的命令。"],["A correlation is not a cause, and a courtship is not a promise.","相关不等于原因，追求不等于承诺。"],["A crash costs a life, and a criminal costs a street its sleep.","一次撞车要一条命，一个罪犯让一条街睡不好。"],["A crisis tests credibility, and criticism follows at once.","危机考验可信度，批评立刻跟上。"],["A curb on spending is a reduction by another name.","限制开支，就是换个名字的削减。"]]},{"t":"Weather and Numbers","s":[["A damp wall grows mould, and the cellar keeps the damp.","潮的墙会长霉，地窖把这份潮气留着。"],["A dazzle of light hides the road, and a deadline hides the evening.","一片晃眼的光把路遮住，一个截止日期把傍晚遮住。"],["A delay costs a day, and a democratic vote costs a month.","延误损失一天，一次民主投票损失一个月。"],["A demographic curve decides a school, and a dental bill decides a family.","人口曲线决定一所学校的命运，一张牙医账单决定一个家庭的。"],["A depression is long, and they designate a day to discuss it.","萧条很长，他们指定一天来讨论它。"],["They detain the wrong man, and the criticism is immediate.","他们扣错了人，批评马上就来。"]]},{"t":"Spread Out","s":[["A flood devastates a valley, and they disclose the figures later.","洪水毁掉一个山谷，数字是后来才公布的。"],["Disparate prices sit on one shelf, and a display makes them look equal.","差得很远的价钱摆在同一层货架上，一个陈列让它们看着差不多。"],["A noise disrupts a lesson and distracts a driver.","一阵噪声打断一堂课，也让司机分心。"],["They distribute the forms, and the documentation runs to forty pages.","他们把表格发下去，配套文件有四十页。"],["A dominant brand owns one domain, and the others follow it down.","占优势的品牌占住一个领域，其余的都跟着它往下走。"]]},{"t":"A Good Plan","s":[["A dramatic fall follows a drought, and a durable crop survives it.","干旱之后跟着一次猛跌，耐旱的作物熬过去了。"],["An elaborate roof is durable, and an eco-friendly one lasts longer.","讲究的屋顶耐用，环保的那种更耐久。"],["They eliminate the elderly from the list, and the reason stays elusive.","他们把年老的从名单上去掉，理由一直说不清。"],["An encyclopaedia indexes everything, and an entrepreneur sells the index.","百科全书把一切都编了索引，一个创业者把索引卖掉。"]]},{"t":"Measured and Proven","s":[["The equator is hot, and the wind there arrives erratically.","赤道很热，那里的风来得没个准。"],["An established estate passes to a son, and an ethical buyer asks why.","一份既有的地产传给儿子，讲道德的买家会问为什么。"],["Evidence accumulates slowly, and the theory evolves eventually.","证据攒得很慢，理论最后总会演进。"],["An exhausted team runs an experiment twice and trusts the second.","累垮的团队把实验做两遍，只信第二遍。"]]},{"t":"Scarce and Plentiful","s":[["An exceptional result needs an explicit method and one clear table.","出色的结果需要明确的方法和一张清楚的表。"],["They exploit a weakness and extend a contract.","他们利用一个弱点，再把合同延长。"],["An extract is a page, and a fragment is a line.","摘录是一页，残片是一行。"],["A famine shows what a finite harvest means.","一场饥荒让人明白有限的收成是什么意思。"],["Fitness is a habit, and a foe is a reason.","健康是一种习惯，敌人是一个理由。"],["A format is a shape you agree on, and a fragment breaks it.","格式是大家说好的一个形状，一块碎片就把它破了。"]]},{"t":"Body and Place","s":[["A freeze kills a crop, and a frost only fulfills a forecast.","一场严寒毁掉一季庄稼，一场霜不过是应验了一句预报。"],["A gene decides a colour, and a gifted child decides nothing.","基因决定一种颜色，有天分的孩子什么也决定不了。"],["A graphic shows a habitat, and the harbor beside it.","一张图表画出一片栖息地，还有旁边的港口。"],["A hardship is a year, and a harsh rule is a decade.","艰难是一年，严苛的规矩是十年。"],["A bold hypothesis needs a harsh test, and a patient one.","大胆的假设要一场严酷的检验，还得有耐心。"]]},{"t":"Cause and Effect","s":[["An impact is measured after, and an impressive figure is checked before.","影响是事后量的，漂亮的数字是事前核过的。"],["A report must be in accordance with the facts, and an inaccurate one is worthless.","报告必须跟事实一致，不准确的一文不值。"],["An inactive child is bored, and an inappropriate joke is remembered.","不动起来的孩子会闷，不合适的玩笑会被人记住。"],["You indulge a taste, and the ants infest the cupboard.","你顺着一样口味吃，蚂蚁就住进了柜子。"],["An installment is a month, and intelligence is a decade.","一期付款是一个月，智力是十年。"]]},{"t":"People Together","s":[["An intense light and a quiet interior make a room work.","一盏很亮的灯和一间安静的内室，才让一个房间好用。"],["An interaction is short, and interference is remembered.","一次互动很短，一次干涉会被记住。"],["You interrupt a speaker, and an introverted guest says nothing.","你打断一个发言人，内向的客人什么也不说。"],["You involve the neighbours and label every box.","你把邻居拉进来，再给每个箱子贴上标签。"],["A keen eye lacks nothing, and a label lacks a reason.","敏锐的眼睛什么也不缺，一个标签缺的是理由。"]]},{"t":"Reading the Land","s":[["A landscape is read slowly, and a likelihood is guessed quickly.","风景要慢慢读，可能性是快估出来的。"],["A limb heals, and a linguistic rule does not.","一条肢体能愈合，一条语言规则不会。"],["You log every hour, note every subtle shift, and hope for a look-in.","你把每个小时都记下来，连细微的变化也记，指望能有个机会。"],["You subdivide a field into plots, and a plot into beds.","你把一块地分成小块，再把一小块分成几畦。"],["A lopsided table is mainly a leg that is short.","一张歪桌子，主要就是有一条腿短。"],["A machine mainly fails at the joint, and a malfunction is rarely sudden.","机器主要坏在接头上，故障很少是突然的。"]]},{"t":"Animals and Machines","s":[["A mammal feeds its young, and a marine one migrates.","哺乳动物喂自己的幼崽，海里的那种还要迁徙。"],["You manage to do the work, and the effort manifests in your face.","你总算把活干完了，这份吃力写在脸上。"],["A manufacture needs a mould, and a mate needs a season.","制造要一个模具，找配偶要一个季节。"],["A mechanism is a habit of metal, and a mental one is a habit of mind.","机械装置是金属的习惯，心理机制是心思的习惯。"],["Mercury falls before a storm, and meteorological data says why.","暴风雨前水银柱会降，气象数据会说明原因。"]]},{"t":"What Repeats","s":[["Birds migrate, moisture rises, and a monitor records both.","鸟迁徙，水汽上升，一台监测器把两样都记下。"],["A motif repeats, and a mould copies it.","一个母题反复出现，一个模具把它复制。"],["A native plant needs less water, and a nocturnal animal needs less light.","本地植物要的水少，夜行动物要的光少。"],["A norm is a target nobody set, and an objective is one you can measure.","常规是没人定过的目标，目标是你能测量的那个。"]]},{"t":"Rules and Offices","s":[["An obligation binds, and an obscure rule binds harder.","义务有约束力，一条晦涩的规则约束得更紧。"],["You obtain a permit and pay an odd fee.","你弄到一张许可证，付了一笔古怪的费用。"],["An odour is a warning, and an offensive joke is not.","一股气味是个提醒，一个冒犯人的玩笑不是。"],["An official answer is safe, and the optimum one is rarely official.","官方的答复稳妥，最优的那个很少是官方的。"],["An ordinary organ does a job nobody notices until it stops.","一个普通的器官干着一件没人注意、直到它停工才被发现的事。"]]},{"t":"Pushing Through","s":[["You overtake on a bend, and leaving before dawn is out of the question.","你在弯道上超车，天亮前出发是根本不用谈的事。"],["You overcome a fear and paralyse a plan with doubt.","你克服一种恐惧，又用怀疑让一份计划瘫住。"],["Safety is paramount, and a permit proves it.","安全是最要紧的，一张许可证证明这一点。"],["You participate in a survey and stay patient through it.","你参加一项调查，全程保持耐心。"],["At the peak, safety is paramount and speed is not.","到了顶峰，要紧的是安全，不是速度。"]]},{"t":"Wanting and Lacking","s":[["You persuade a pessimist once, and he is pessimistic again by Friday.","你说服一个悲观的人一次，到礼拜五他又悲观了。"],["A phase lasts a year, and a physical habit lasts a life.","一个阶段持续一年，一个身体上的习惯持续一生。"],["They plagiarise a chapter, and there is plenty of it to copy.","他们抄了一章，可抄的东西多得是。"],["A plot needs a reason, and a pose needs an audience.","情节要一个理由，姿势要一群观众。"],["A portable radio costs little, and poverty costs a year.","一台便携收音机不贵，贫穷要一年。"]]},{"t":"Gains and Costs","s":[["They praise a result and predict the next one.","他们夸一个结果，再预测下一个。"],["A pressing letter gets an answer, and a private one gets a visit.","紧急的信换来一个回复，私人的信换来一次登门。"],["A rule can prohibit a sale, and a tax can prolong a delay.","一条规矩能禁止一笔买卖，一项税能拖长一段延误。"],["They promote a product, and the town prospers.","他们推销一个产品，镇子跟着兴旺。"],["A scandal brings notoriety, and a rule prohibits the remedy.","一桩丑闻带来恶名，规矩却禁止补救。"],["A filter purifies water, and a test qualifies a man.","滤芯把水净化，一场考试让人合格。"]]},{"t":"Small Changes","s":[["A radical idea has a narrow range and a rare defender.","激进的想法适用范围窄，替它说话的人也少。"],["A rate is a number per year, and you react to the change.","比率是每年一个数，你对着变化作出反应。"],["Recreation costs an hour, and a reduction costs a job.","消遣花一个小时，裁员丢一份工作。"],["You refer to a rule, and a rehearsal proves it.","你援引一条规矩，一次排练证明它站得住。"]]},{"t":"Old and New","s":[["They reject a plan that is relevant and cheap.","他们否掉了一个既对路又便宜的方案。"],["A religious rule is old, and a reluctant witness is slow.","宗教的规矩老，不情愿的证人慢。"],["A plant reproduces, and a responsible owner prunes it.","植物自己繁殖，负责的主人给它修枝。"],["A revision fixes a page, and a festival revives a town.","一次修订改一页，一场节庆让一座城活过来。"],["A ruin is scenic until it is yours.","废墟是风景，直到它成了你家的。"]]},{"t":"Rising and Falling","s":[["A tree gives shade, and a claim invites skepticism.","树给人阴凉，一种说法招来怀疑。"],["Prices soar in a bad year, and solely the landlord gains.","行情差的一年价格猛涨，只有房东得利。"],["A solicitor steers a case, and a fee steers the solicitor.","律师把案子往前带，一笔费用把律师带着走。"],["A teacher stimulates a class, and a long stride covers a mile.","老师把一堂课激活，一大步走出一英里。"],["A strong man can succumb to a habit, and a rumour can paralyse a weak one.","壮实的人会屈服于习惯，谣言则能让虚弱的人瘫住。"]]},{"t":"Enough and More","s":[["A sufficiency lasts a year, and a sustainable supply lasts a lifetime.","够用的量能撑一年，可持续的供应能撑一辈子。"],["A new rule supersedes an old one and suppresses the argument.","新规矩取代旧的，把争论压下去。"],["Supremacy is a claim, and a suspicious officer tests it.","霸权是一种主张，一个多疑的军官会去试它。"],["A symptom is a sign, and tension is a cause.","症状是一个信号，紧张是一个原因。"],["A term ends in June, and the work continues throughout.","一个学期六月结束，工作自始至终没停。"]]},{"t":"Ways Across","s":[["A toll is a price at a bridge, and a trace is a mark left after.","通行费是过桥的价钱，痕迹是事后留下的印子。"],["Goods in transit cross a border, and music transcends it.","在途的货物穿过一条边界，音乐超越它。"],["A tremendous noise often has a small trigger.","巨大的声响常常只有一个小小的起因。"],["A tropical year has two seasons, and an unbiased report says so.","热带的一年有两季，一份不带偏见的报告就这么写。"],["A uniform makes a crowd visible and a person less so.","制服让一群人显眼，让一个人不那么显眼。"]]},{"t":"What Is Worth Keeping","s":[["A valuable thing is kept, and a versatile one is used.","值钱的东西被收着，多用途的被用起来。"],["A view is what you see, and a visual is what you show.","景是你看见的，图是你给人看的。"],["A violent storm is visible from a mile away.","猛烈的风暴一英里外就看得见。"],["Well-being is a habit, and it stays visible on a face.","身体好是一种习惯，它写在脸上。"]]}],"4":[{"t":"The Trip","s":[["We had to reserve the room two months in advance.","房间得提前两个月预订。"],["The fee was small, and the transfer from the airport was included.","费用不多，机场接送也算在里面。"],["You have to show your passport for an international flight.","坐国际航班得出示护照。"],["The airline had to adjust the time twice in one week.","航空公司一个星期里改了两次时间。"],["A lorry took the boxes for export at four in the morning.","凌晨四点，一辆卡车把要出口的箱子拉走了。"],["Nobody minded, because the seats were wide and the coffee was free.","没人计较，座位宽，咖啡还免费。"],["At the desk a woman explained that the gate had changed.","柜台后的女人说，登机口换了。"]]},{"t":"The Island","s":[["The island is famous for the diversity of its birds.","这个岛以鸟的种类之多出名。"],["A weather station was established there in 1954 and never closed.","一九五四年在岛上建了个气象站，一直没关。"],["The habitat of one small fox is a strip of sand fifty metres wide.","一种小狐狸的栖息地，是五十米宽的一条沙地。"],["The vegetation changes within a hundred metres of the shore.","离岸一百米内，植被就变了个样。"],["No large animal has ever lived here.","大型动物从来没在这里待过。"],["The main feature of the place is the wind.","这地方最大的特点就是风。"],["Half the young people emigrate before they are twenty-five.","一半的年轻人在二十五岁之前就迁走了。"]]},{"t":"The Gallery","s":[["The gallery serves food on the top floor, and the queue is long at one.","美术馆顶楼有吃的，一点钟要排长队。"],["One guard is allergic to the flowers in the first room.","有个保安对第一间展厅里的花过敏。"],["A fitness class meets in the courtyard twice a week.","院子里每周有两次健身课。"],["The building has a tradition of free entry on Sundays.","这栋楼有个传统，星期天免费进。"],["There is not much entertainment in the evening, apart from a movie on Fridays.","晚上没什么娱乐，除了星期五放一场电影。"],["The press came once, and the publicity lasted a month.","媒体来过一次，宣传效果持续了一个月。"],["Tickets are cheaper online than at the door.","网上买票比门口便宜。"],["One picture was stolen in 1998 and came back in 2004.","有幅画一九九八年被偷，二〇〇四年又回来了。"],["The jewellery is kept in a room with two doors.","珠宝放在一个有两道门的房间里。"],["The artwork on the stairs is newer than the building itself.","楼梯上的那些作品，比这栋楼还新。"],["A statue in the garden has no head, and nobody knows why.","园子里有座雕像没有头，谁也不知道为什么。"]]},{"t":"The Coast","s":[["The geology of this coast is simple: soft rock and a hard sea.","这段海岸的地质很简单：软石头，硬海水。"],["The countryside here begins where the last house ends.","这里的乡村，从最后一栋房子那里开始。"],["The urban part is three streets and a station.","算城里的部分，就是三条街加一个车站。"],["The coastline has moved thirty metres in ninety years.","九十年里，海岸线退了三十米。"],["The environment is protected, which keeps the hotels out.","这一带环境受保护，所以酒店进不来。"],["It is noisy only in August, when the fair comes.","只有八月集市来的时候才吵。"],["The car park has the capacity for forty cars and takes sixty.","停车场标称能停四十辆，实际停了六十辆。"],["An outdoor pool was built in 1971 and closed in 1999.","露天泳池一九七一年建，一九九九年关了。"],["Accommodation is scarce, and most visitors stay in the next town.","住的地方很少，多数游客住到邻镇。"],["It is a good place for a quiet week.","想安静过一周，这地方不错。"],["The nearest shop is two miles away, and the nearest hospital is twenty.","最近的店在两英里外，最近的医院在二十英里外。"],["A remote farm above the bay has no road, only a path.","海湾上方有个偏远的农场，没路，只有一条小径。"]]},{"t":"The Course","s":[["The education department moved into the old library last year.","教育系去年搬进了老图书馆。"],["Each student gets two hours with a tutor every week.","每个学生每星期有两个小时跟导师。"],["The purpose of the first term is to teach them how to read a paper.","第一学期的目标，是教他们怎么读一篇论文。"],["There is a structure to the course, but nobody follows it exactly.","这门课有个结构，只是没人严格照着走。"],["The reference materials fill one shelf behind the desk.","参考资料把桌后那一格书架塞满了。"],["Her knowledge of the subject is extensive and slightly old-fashioned.","她在这门学问上知识很广，只是有点旧派。"],["The expertise in the room was mostly in the hands of one person.","屋里那点专长，基本都在一个人手上。"],["A small café near the entrance sells tea to students all day.","入口附近有家小咖啡馆，一整天都在卖茶给学生。"]]},{"t":"The Two Shops","s":[["The advantage of the corner shop is that it opens at six.","拐角那家店的好处是六点就开门。"],["The disadvantage is the price, which is a fifth higher than the supermarket.","缺点是价钱，比超市贵两成。"],["Ordinary people here buy bread daily and meat twice a week.","这儿的普通人天天买面包，肉一星期买两次。"],["A group of neighbours tried to buy the shop together in 2015.","二〇一五年，一群邻居想合伙把这家店买下来。"],["The owner refused, and then sold it to a chain two years later.","老板当时不肯，两年后卖给了连锁店。"],["The chain kept the name and changed everything else.","连锁店把名字留着，别的全换了。"]]},{"t":"The Project Meeting","s":[["People associate this company with cheap furniture, which annoys the manager.","大家把这家公司跟便宜家具联系在一起，经理很恼。"],["Their approach is to build one thing well and sell it for years.","他们的做法是把一样东西做好，然后卖很多年。"],["A bonus motivates the sales team and does nothing for the workshop.","奖金能激励销售，对车间一点用没有。"],["The new design improves the handle and nothing else.","新设计改了把手，别的都没动。"],["They overlooked one detail: the box does not fit in a car.","他们漏了一个细节：这箱子塞不进车里。"],["The report will omit the two years when the firm lost money.","报告打算省掉公司亏钱的那两年。"],["Nobody at the meeting mentioned the box until the very end.","会上一直没人提那只箱子，直到最后。"]]},{"t":"The Tutorial","s":[["He could not find the room, and the lecture had already started.","他没找到教室，课已经开了。"],["The opportunity came in the second term, and he took it.","机会在第二学期来了，他抓住了。"],["The first thing you learn is how to take notes in a lecture.","首先要学的，是听课时怎么记笔记。"],["The reading was difficult, and half the group stopped after ten pages.","材料很难，一半人看到第十页就停了。"],["Rain prevented anyone from going out at lunchtime.","下雨，午饭时谁都没出去。"],["It is easy to misunderstand the question and write about the wrong war.","看错题很容易，一写就写到一场不相干的战争上。"],["She tried hard to be fair in her comments.","她尽力让自己的评语公道。"],["The feedback was three lines long and extremely useful.","反馈只有三行，却非常有用。"]]},{"t":"The Experiment Report","s":[["The weather affected the second set of readings.","天气影响了第二组读数。"],["The analysis took longer than the experiment itself.","分析花的时间比实验还长。"],["The result was clear enough to publish and dull enough to forget.","结果清楚到可以发表，也平淡到转头就忘。"],["Nobody knew how to handle the machine after the engineer left.","工程师走了以后，没人知道怎么操作那台机器。"],["The department agreed to support the work for one more year.","系里同意再支持这项工作一年。"],["The old building is not an ideal place for this kind of work.","这栋老楼不适合做这类工作。"],["A new lab was promised, and the promise is still on the wall.","新实验室答应过，那张纸还贴在墙上。"]]},{"t":"The Rules of the Competition","s":[["The rules are rigorous about how the samples are stored.","规则对样本怎么存放要求很严格。"],["They restrict the number of people in the room to four.","他们限制屋里最多四个人。"],["Two entries were so similar that the judges asked for the notes.","有两份作品太像，评委要了笔记来看。"],["One particular photograph won, and nobody could say exactly why.","有一张照片得了奖，谁也说不清为什么。"],["A copy of the original must be sent with the entry.","交作品时得附一份原件复印。"],["The statistics were checked by a second person and then by a third.","统计数字先由第二个人核，再由第三个人核。"],["The prize was a book token and a letter of praise.","奖品是一张书券和一封表扬信。"]]},{"t":"The Hall","s":[["The maximum number of people in the hall is two hundred.","礼堂最多容两百人。"],["The minimum is four, or the evening is cancelled.","最少四个人，不然就取消。"],["The initial plan had a stage at the north end.","最初的方案是舞台放在北头。"],["Seating is limited, so tickets are sold by phone only.","座位有限，票只能电话订。"],["They had to shorten the programme by twenty minutes.","节目单只好砍掉二十分钟。"],["A decrease in the budget ended the free tea.","预算减了，免费茶也就没了。"],["The lack of a fire exit was noticed in 2016.","没有消防通道这件事，二〇一六年才被人发现。"],["The amount of money needed was never made public.","到底要多少钱，从来没有公开过。"],["The majority of the members voted for the smaller plan.","多数成员投了那个小一点的方案。"]]},{"t":"The Figures","s":[["The figures for last year are large enough to be interesting.","去年的数字够大，值得一看。"],["The number of visitors doubled between 2010 and 2019.","二〇一〇到二〇一九年，游客数翻了一倍。"],["More than half of them come in July and August.","其中一多半是七八月来的。"],["At present there are three staff and one telephone.","目前有三个人，一部电话。"],["The website is updated once a month, if anyone remembers.","网站一个月更新一次，前提是有人记得。"],["The car park fills by ten in the morning.","停车场上午十点就满了。"],["Nobody expects these numbers to stay the same.","谁都不指望这些数字一直不变。"]]},{"t":"The Old Bridge","s":[["The newest part of the bridge is forty years old.","这座桥最新的部分也有四十年了。"],["The old crossing will close soon, and nobody knows for how long.","老渡口很快就要关，关多久没人知道。"],["The signs are out of date and point to a road that no longer exists.","路牌过时了，指的那条路早就不在了。"],["An ancient track runs under the arches.","桥洞底下有一条古道。"],["A temporary path was laid across the field in March.","三月在田里铺了一条临时的小路。"],["The deadline for the repair is the end of September.","修好的截止时间是九月底。"],["A permanent solution would cost more than the bridge is worth.","要彻底解决，花的钱比这座桥本身还值钱。"]]},{"t":"The Fair","s":[["The fair comes more often than it used to, sometimes twice a year.","集市来得比以前勤，有时候一年两次。"],["The annual show in June is the one people dress up for.","六月那场年度展，大家才郑重打扮。"],["The market is held every month on the second Saturday.","集市每个月第二个星期六办。"],["Bread is baked every day, and cakes only on Fridays.","面包天天烤，蛋糕只在星期五。"],["A small band plays on the corner when the weather is kind.","天气好的时候，拐角有支小乐队。"],["By nine in the evening the square is empty again.","到晚上九点，广场又空了。"]]},{"t":"The Store Room","s":[["Everything in the store room must be classified by size.","库房里的东西都得按大小分类。"],["The entrance is at the back, behind the bins.","入口在后面，垃圾桶后头。"],["The boxes below the window are the oldest in the building.","窗户底下那些箱子，是楼里最老的。"],["A small desk sits beside the door, with nothing on it.","门边有张小桌子，上面什么都没有。"],["Only two trolleys are available, and both are broken.","能用的推车只有两辆，还都坏了。"],["The room has no light of its own.","这间屋自己没有灯。"],["A torch hangs by the door for that reason.","所以门边挂着一只手电。"]]},{"t":"The Warning","s":[["The talk was boring, and half the room left before the end.","那场讲座很无趣，一半人没听完就走了。"],["The trend in the figures is clear and slightly worrying.","数字的走向很清楚，也让人有点担心。"],["It is risky to cross the river in November.","十一月过河很危险。"],["Some of the plants along the path are poisonous.","路边有些植物有毒。"],["A warning sign went up after the second accident.","第二次出事以后，立了块警报牌。"],["Handle the old pipes with care, because they crack easily.","旧管子要小心搬，很容易裂。"],["The sign is small, and almost nobody reads it.","那块牌子很小，几乎没人看。"]]},{"t":"The Airport Desk","s":[["The form asks for specific dates, and nobody at the desk has them.","表上要填具体日期，柜台后没人知道。"],["A special request for a seat by the window was ignored.","有人特别要求靠窗的座位，没人理。"],["The announcement was not clear, and two people missed the flight.","广播说得不清楚，两个人误了飞机。"],["Air travel is cheaper now than it was in 1990.","现在坐飞机比一九九〇年便宜。"],["Public transport to the airport stops at ten in the evening.","去机场的公共交通晚上十点就停了。"],["You cannot rely on the bus in winter.","冬天指望不上那趟公交。"],["A man at the desk explained the whole thing twice, slowly.","柜台后一个男人把整件事慢慢讲了两遍。"]]},{"t":"The Old Base","s":[["Someone tried to steal the fuel at night, and failed.","有人夜里想偷燃料，没成。"],["The injury was small, but it ended his season.","伤不重，可他那季就这样结束了。"],["The site was military for forty years and is a museum now.","这地方做了四十年军事用地，现在是博物馆。"],["The tactics used in training have not changed since 1975.","训练里的那套策略，从一九七五年起没变过。"],["Space travel is still the most expensive way to leave the ground.","太空旅行仍是离开地面最贵的办法。"],["A freeze in October closed the road for a week.","十月一场冰冻，路封了一个星期。"],["The guards still wear the old uniform on Sundays.","星期天，守卫还穿着旧制服。"]]},{"t":"The Club","s":[["The organization has forty members and no office.","这个组织有四十个成员，没有办公室。"],["One woman organizes everything, from the keys to the tea.","所有事都由一个女人安排，从钥匙到茶叶。"],["They produce a small magazine twice a year.","他们一年出两期小杂志。"],["The money is administered by two people who have never met.","钱由两个人管，这两人从没见过面。"],["Members come from every occupation, and one of them is a pilot.","成员干什么的都有，其中一个是飞行员。"],["The club is open to all ages, though most members are over sixty.","俱乐部不分年龄，不过多数成员超过六十岁。"],["The youth group meets on Fridays and has its own key.","年轻人那组星期五活动，有自己的钥匙。"],["His old mate from the navy runs the bar.","他海军时的老伙伴管着吧台。"],["The staff are all volunteers, and there are six of them.","工作人员全是志愿者，一共六个。"],["A sale in June raised enough money for a new roof.","六月一次义卖，筹够了换屋顶的钱。"],["Everything is cheap, and the discount for students is fifty per cent.","东西都便宜，学生还能打五折。"]]},{"t":"The Hotel","s":[["The tower is round, which makes the rooms awkward.","这塔楼是圆的，房间都不好摆。"],["In order to fill them, the owner cut the prices.","为了把房住满，老板把价降了。"],["They plan to renovate the top two floors next year.","他们打算明年翻修上面两层。"],["The manager runs the place alone in winter.","冬天，经理一个人撑着这家店。"],["Her hospitality is famous, and so is her soup.","她待客的热情出了名，她的汤也是。"],["The old market hall has a shape like nothing else in the town.","老市场那个厅，形状在镇上找不出第二个。"],["The closing of the pool depressed everyone in the village.","泳池一关，全村人都沮丧。"],["The hotel is well-known for its breakfast rather than its beds.","这家店出名的是早饭，不是床。"],["Two of the staff specialize in walking tours of the old town.","有两个员工专做老城的步行导览。"],["The kitchen is the busiest part of the building.","整栋楼里最忙的是厨房。"]]},{"t":"Two Villages","s":[["A typical house here has two rooms and a stove.","这儿的典型住房就是两间屋加一个炉子。"],["It is uncommon to see a car in the old quarter.","在老城区看见一辆汽车是少见的事。"],["The map was drawn accurately for the first time in 1902.","这张图一九〇二年第一次画得准确。"],["Two families have lived in the same house since then.","从那以后，有两户人家一直住同一栋房子。"],["The well in the square still works in dry summers.","广场上那口井，干旱的夏天还能用。"],["Visitors come for the quiet and leave before dark.","游客为了清静而来，天黑前就走了。"]]},{"t":"The Power Station","s":[["The power station burned coal for sixty years and closed in 1981.","这座电站烧了六十年煤，一九八一年关了。"],["The fuel arrived by rail, twelve wagons a day.","燃料走铁路来，一天十二节车皮。"],["They wanted to expand in 1955 and could not buy the land.","一九五五年他们想扩建，地买不下来。"],["Smoke could be seen from the hill, and the path to climb it is still there.","从山上能看见烟，爬上去的那条小路还在。"],["A plan to enhance the river bank was never paid for.","改善河岸的计划，一直没人出钱。"],["The building was refurbished in 2004 and is now flats.","这栋楼二〇〇四年重新装修，现在住人。"],["A disused tunnel runs under the car park.","停车场底下有一条废弃的隧道。"]]},{"t":"The Machine","s":[["The computer in the office is older than the person who uses it.","办公室那台电脑，比用它的人还老。"],["A handy list of numbers hangs beside the phone.","电话旁边挂着一张方便查的号码表。"],["He will demonstrate the machine to anyone who asks.","谁问，他都愿意演示那台机器怎么用。"],["The most important thing is to turn it off at night.","最重要的，是夜里把它关掉。"],["The instructions are straightforward: press once and wait.","操作很简单：按一下，然后等。"],["Her preference is for paper, and she keeps a notebook.","她更偏爱纸，随身带一个本子。"],["You can trust the figures, because two people check them.","这些数字可以信，因为有两个人核过。"]]},{"t":"The Workshop","s":[["Someone donated an old lathe, and it still turns.","有人捐了一台旧车床，还能转。"],["His work is the best in the room and sells for very little.","他的作品是屋里最好的，卖的价钱却很低。"],["The information on the wall is out of date and nobody has changed it.","墙上那些信息都过时了，也没人换。"],["He asks students to visualize the finished piece before they cut.","他让学生动手之前先在心里看见成品。"],["Repetition is how the hand learns what the eye has seen.","手要学会眼睛看见的东西，靠的就是重复。"],["The light is poor, so nobody works after four.","光线不好，四点以后就没人干活。"],["A durable finish takes three coats and a day of waiting.","要做得耐久，得刷三遍，再等一天。"],["The dust is a pollutant, and the masks have gone missing.","那些粉尘是污染物，口罩却找不着了。"],["They continue because the alternative is an empty room.","他们还在做，因为不做的结果就是一间空屋子。"]]}]}, CHS={"1":[["resemble","v. 像，与……相似","like · look · be similar to"],["recognize","v. 认出，识别；承认","perceive · acknowledge · realize · appreciate · admit · identify · comprehend · understand know"],["adjust","v. 调整，使适合","change · modify · shift · alter"],["approach","n. 方法","method · way"],["fundamental","adj. 基本的，基础的","rudimentary · preliminary · basic"],["rely on","依靠，依赖","depend on"],["domestic","adj. 家庭的；国内的","home · local · national"],["measure","v. 测量","calculate · assess · evaluate"],["trait","n. 特性，特征","characteristic · feature · property"],["coin","v. 创造","first used · invent"],["artificial","adj. 人造的，仿造的","synthetic · man-made"],["prompt","v. 促进，激起","initiate · immediately"],["exchange","v. 交换","share · apply A to B"],["underlie","v. 成为……基础","based on · ground · root"],["ignore","v. 忽视，不顾","neglect · overlook · underestimate"],["fertiliser","n. 化肥，肥料","chemical · toxic · unnatural"],["rather than","而非，不是","but · yet · however · whereas · nonetheless · nevertheless · although · notwithstanding though · instead"],["thanks to","由于，幸亏","stem from · derive · owing to · due to · according to · becau function forms(w){
 var sp=w.indexOf(' ');
 if(sp>-1){
  var head=w.slice(0,sp), rest=w.slice(sp), out=[w], bs=forms(head), i;
  for(i=0;i<bs.length;i++) out.push(bs[i]+rest);
  if(head==='be') out.push('is'+rest,'are'+rest,'was'+rest,'were'+rest,'been'+rest,'being'+rest);
  return out;
 }
 var f=[w,w+'s',w+'es',w+"'s",w+'ed',w+'ing',w+'ly'];
 if(/e$/.test(w)) f.push(w+'d', w.slice(0,-1)+'ing');
 if(/y$/.test(w)) f.push(w.slice(0,-1)+'ies', w.slice(0,-1)+'ied');
 if(/or$/.test(w)) f.push(w.slice(0,-2)+'our');
 if(/ize$/.test(w)) f.push(w.slice(0,-3)+'ise');
 if(/yze$/.test(w)) f.push(w.slice(0,-3)+'yse');
 return f;
}

 RE[ch]={re:new RegExp('(?<![A-Za-z])('+fm.map(esc).join('|')+')(?![A-Za-z])','gi'), map:map};

}

  for(j=0;j<fr.length;j++){
   var f=fr[j], cands=[f];
   if(f.length>2){ cands.push(f.slice(0,2)); cands.push(f.slice(-2)); }
   for(k=0;k<cands.length;k++){
    var c=cands[k];
    if(c.length<2) continue;
    var p=zh.indexOf(c);
    if(p>=0 && (!best || c.length>best.sc)) best={s:p,e:p+c.length,sc:c.length};
   }
  }
  if(best) spans.push(best);
  else if(fr.length && !/[的地性化度者]$/.test(fr[0])){
   var ch0=fr[0].charAt(0);
   if(ch0 && '而就都也又还在是有把被让使对给从向跟和与或的地得着了过们'.indexOf(ch0)<0
      && zh.split(ch0).length===2){ spans.push({s:zh.indexOf(ch0),e:zh.indexOf(ch0)+1,sc:1}); }

  if(ok) keep.push(sp);

  out+=zh.slice(last,keep[i].s)+'<b class="zw">'+zh.slice(keep[i].s,keep[i].e)+'</b>';

function qrec(){ return J(QK,{}) }
function usable(w){ var m=TT.m[w]||''; return !!m && !/的衍生词$/.test(m) }
function posOf(m){ var x=(m||'').match(/^([a-z]+)\./); return x?x[1]:'' }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=a[i]; a[i]=a[j]; a[j]=t } return a }
function hesc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){

function qPool(word, mean){
 var list=CHS[ch]||[], same=[], all=[], i, e;
 for(i=0;i<list.length;i++){
  e=list[i];
  if(e[0]===word||!usable(e[0])) continue;
  all.push(e[0]);
  if(posOf(e[1])===posOf(mean)) same.push(e[0]);
 }
 return same.length>=3? same : all;
}

function findSent(p, w){
 var fs=forms(w).map(function(x){ return x.toLowerCase() }), k, j;
 for(k=0;k<p.s.length;k++){
  var t=p.s[k][0], m=t.match(/[A-Za-z][A-Za-z'’-]*/g)||[];
  for(j=0;j<m.length;j++){
   if(fs.indexOf(m[j].toLowerCase())>-1) return {t:t, zh:p.s[k][1], form:m[j]};
  }
 }

}

function inText(w, text){
 var fs=forms(w), i;
 for(i=0;i<fs.length;i++){
  if(new RegExp('(?<![A-Za-z])'+esc(fs[i])+'(?![A-Za-z])','i').test(text)) return true;

}
function optsFor(word, mean, type, ban){
 var pool=shuffle(qPool(word, mean)), out=[], seen={}, i, txt, pass;
 var right=(type==='e2z')? mean : word;
 out.push(right); seen[right]=1;
 for(pass=0;pass<2&&out.length<4;pass++){
  for(i=0;i<pool.length&&out.length<4;i++){
   if(pass===0 && ban && type!=='e2z' && inText(pool[i], ban)) continue;
   txt=(type==='e2z')? (TT.m[pool[i]]||'') : pool[i];
   if(!txt||seen[txt]) continue;
   seen[txt]=1; out.push(txt);
  }

 if(!ws.length){ toast('这一篇没有可以测的词'); return }

  var w=ws[k], mean=TT.m[w]||'';
  var s=(w.indexOf(' ')>=0)? null : findSent(ps, w);
  var type=pat[k]||'e2z';
  if(type==='c'&&!s) type='e2z';
