<style>
:root{--bg:#f7f6f2;--panel:#fff;--ink:#1f2328;--ink2:#5b6470;--line:#e6e2da;--chip:#efece6;
 --accent:#0f766e;--acc-soft:#eaf4f2;--mark:#d7ece8;--green:#1f7a52;--warn:#b4452e;--serif:"Iowan Old Style","Palatino Linotype",Georgia,"Songti SC",serif}
html.dark{color-scheme:dark;--bg:#14181a;--panel:#1b2124;--ink:#e8eaed;--ink2:#9aa3ad;--line:#2b3236;
 --chip:#232b2e;--acc-soft:#16302d;--mark:#1d4a44;--green:#6cc38b;--warn:#f0776a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 -apple-system,BlinkMacSystemFont,
 "PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;padding-bottom:80px;
 -webkit-text-size-adjust:100%}
.wrap{max-width:820px;margin:0 auto;padding:0 18px}
header{padding:26px 0 8px}
h1{margin:0;font-size:24px;font-weight:750;letter-spacing:-.3px}
.sub{color:var(--ink2);font-size:13px;margin-top:6px;line-height:1.65}
.back{display:inline-block;font-size:13px;color:var(--ink2);text-decoration:none;border:1px solid var(--line);
 border-radius:999px;padding:3px 12px;margin-bottom:14px;background:var(--panel)}
.back:hover{color:var(--accent);border-color:var(--accent)}
#chs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 4px}
.cb{font:inherit;font-size:12.5px;cursor:pointer;border:1px solid var(--line);background:var(--panel);
 color:var(--ink2);border-radius:9px;padding:5px 10px;line-height:1.2}
.cb:hover{border-color:var(--accent);color:var(--accent)}
.cb.on{background:var(--accent);border-color:var(--accent);color:#fff}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 0 10px;
 border-top:1px solid var(--line);padding-top:13px}
.ttl{font-size:17px;font-weight:700;letter-spacing:-.2px}
.ttl em{font-style:normal;color:var(--ink2);font-weight:500;font-size:13px;margin-left:7px}
.acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.acts button{font:inherit;font-size:12.5px;font-weight:650;border-radius:9px;cursor:pointer;
 border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 11px}
.acts button:hover{border-color:var(--accent);color:var(--accent)}
.acts button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.cov{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:14px}
.cv1{display:flex;align-items:baseline;gap:8px;font-size:12.8px;color:var(--ink2);flex-wrap:wrap}
.cv1 b{font-size:15px;color:var(--accent);font-variant-numeric:tabular-nums}
.cvp{height:5px;border-radius:3px;background:var(--chip);margin-top:8px;overflow:hidden}
.cvp i{display:block;height:100%;background:var(--accent);border-radius:3px}
.cov details{margin-top:4px}
.cov summary{font-size:12.5px;color:var(--ink2);cursor:pointer;list-style:none;outline:none}
.cov summary::-webkit-details-marker{display:none}
.cov summary:hover{color:var(--accent)}
.left{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.left span{font-size:12px;background:var(--chip);color:var(--ink2);border-radius:6px;padding:2px 7px;cursor:help}
.pass{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:15px 17px 11px;margin-bottom:12px}
.ph{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.pn{font-size:11px;font-weight:800;letter-spacing:.5px;color:var(--accent);background:var(--acc-soft);
 border-radius:5px;padding:2px 6px;font-variant-numeric:tabular-nums}
.pt{font-size:14.5px;font-weight:700}
.ph .say{margin-left:auto}
.sn{margin:0 0 12px;padding:1px 4px;border-radius:6px;transition:background .15s}
.sn:last-child{margin-bottom:0}
.sn .en{display:block;font:16.4px/1.62 var(--serif);letter-spacing:.1px;color:var(--ink)}
.sn .zh{display:block;font-size:12.6px;line-height:1.55;color:var(--ink2);margin-top:2px}
body.nozh .sn .zh{display:none}
.sn.cur{background:var(--acc-soft);box-shadow:0 0 0 2px var(--acc-soft)}
.sn.cur .en{color:var(--accent)}
mark.pv{background:none;color:inherit;cursor:pointer;padding:0 1px;border-radius:2px;font-weight:680;
 box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--accent) 32%,transparent)}
mark.pv:hover{background:var(--mark);box-shadow:none}
mark.pv.on{background:var(--accent);color:#fff;box-shadow:none}
body.blurred mark.pv{color:transparent;background:var(--chip);box-shadow:none;border-radius:3px}
body.blurred mark.pv.on{color:inherit;background:var(--mark);box-shadow:none}
body.blind .sn .en{filter:blur(5px);cursor:pointer;user-select:none}
body.blind .sn.rev .en{filter:none}
.say{border:0;background:none;cursor:pointer;color:var(--ink2);padding:2px;line-height:0;border-radius:6px}
.say:hover{color:var(--accent);background:var(--acc-soft)}
.say svg{width:15px;height:15px}
.wlist{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px;padding-top:9px;border-top:1px dashed var(--line)}
.wlist span{font-size:11.5px;color:var(--ink2);background:var(--chip);border-radius:5px;padding:1px 6px;cursor:pointer}
.wlist span:hover{color:var(--accent)}
#pop{position:fixed;z-index:90;min-width:180px;max-width:320px;background:var(--panel);border:1px solid var(--line);
 border-radius:12px;box-shadow:0 12px 34px rgba(0,0,0,.18);padding:11px 13px;display:none}
#pop.on{display:block}
#pop .pw{font:700 16px/1.3 var(--serif)}
#pop .pm{font-size:12.8px;color:var(--ink2);margin-top:4px;line-height:1.6}
#pop .ps{font-size:12px;color:var(--accent);margin-top:6px;line-height:1.55;background:var(--acc-soft);
 border-radius:6px;padding:4px 7px}
#pop .pa{display:flex;gap:6px;margin-top:9px}
#pop .pa button{font:inherit;font-size:12px;font-weight:650;border:1px solid var(--line);background:var(--panel);
 color:var(--ink);border-radius:7px;padding:4px 10px;cursor:pointer}
#pop .pa button:hover{border-color:var(--accent);color:var(--accent)}
#pop .pa button.on{background:var(--accent);border-color:var(--accent);color:#fff}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);background:var(--ink);color:var(--bg);
 font-size:13px;padding:8px 16px;border-radius:999px;opacity:0;transition:.22s;pointer-events:none;z-index:99;
 max-width:80vw;text-align:center}
#toast.on{opacity:.95;transform:translate(-50%,0)}
@media (max-width:620px){.wrap{padding:0 12px}h1{font-size:21px}.pass{padding:13px 13px 9px}
 .sn .en{font-size:16px;line-height:1.8}.sn .zh{font-size:12.5px}.ttl{font-size:15.5px;width:100%}
 .acts{margin-left:0;width:100%}.cb{font-size:12px;padding:4px 9px}}
/* ---- 本篇小测 ---- */
.qz{display:flex;align-items:center;gap:8px;margin-top:9px;padding-top:8px;border-top:1px dashed var(--line)}
.qbb{font:inherit;font-size:12px;font-weight:650;color:var(--accent);background:var(--acc-soft);
 border:1px solid color-mix(in srgb,var(--accent) 26%,transparent);border-radius:7px;padding:3px 10px;cursor:pointer}
.qbb:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.qsc{font-size:11.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.qsc b{color:var(--accent);font-weight:700}
.qzbox{margin-top:10px;background:var(--acc-soft);border:1px solid color-mix(in srgb,var(--accent) 20%,transparent);
 border-radius:11px;padding:11px 13px 12px}
.qh{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink2);margin-bottom:7px}
.qh .qn2{font-weight:750;color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.qh .qclose{margin-left:auto;font:inherit;font-size:11.5px;background:none;border:0;color:var(--ink2);
 cursor:pointer;padding:1px 3px}
.qh .qclose:hover{color:var(--accent);text-decoration:underline}
.qq{font:15.5px/1.62 var(--serif);color:var(--ink)}
.qq .qw{font-family:var(--serif);font-size:17px;font-weight:700}
.qq .blank{display:inline-block;min-width:66px;height:1.02em;margin:0 3px;vertical-align:-3px;
 border-bottom:2px solid color-mix(in srgb,var(--accent) 55%,transparent)}
.qzh{display:block;font-size:12.4px;line-height:1.55;color:var(--ink2);margin-top:3px;
 font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
.qo{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}
.qo button{font:inherit;font-size:13px;line-height:1.5;text-align:left;background:var(--panel);color:var(--ink);
 border:1px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer;transition:.12s}
.qo button:hover{border-color:var(--accent);color:var(--accent)}
.qo button .oi{font-size:10.5px;color:var(--ink2);margin-right:6px;font-variant-numeric:tabular-nums}
.qo button.ok{background:var(--panel);border-color:var(--green);color:var(--green);font-weight:650}
.qo button.ok .oi{color:var(--green)}
.qo button.no{border-color:var(--warn);color:var(--warn)}
.qo button.no .oi{color:var(--warn)}
.qo button.dim{opacity:.5}
.qf{font-size:12.4px;line-height:1.6;color:var(--ink2);margin-top:10px;min-height:20px}
.qf:after{content:"";display:block;clear:both}
.qf b{color:var(--ink)}
.qf i{font-style:normal;opacity:.75}
.qf .qy{color:var(--green);font-weight:700}
.qf .qn{color:var(--warn);font-weight:700}
.qf button{font:inherit;font-size:12px;font-weight:650;border-radius:7px;padding:4px 12px;cursor:pointer;
 border:1px solid var(--line);background:var(--panel);color:var(--ink);float:right;margin-left:8px}
.qf button.prim{background:var(--accent);border-color:var(--accent);color:#fff}
.qf button:hover{filter:brightness(1.05)}
.qdone{font-size:13.4px;line-height:1.6}
.qdone b{font-size:16px;color:var(--accent);font-variant-numeric:tabular-nums}
.qbad{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.qbad span{font-size:11.5px;background:var(--panel);color:var(--ink2);border:1px solid var(--line);
 border-radius:5px;padding:1px 7px;cursor:pointer}
.qbad span:hover{color:var(--accent);border-color:var(--accent)}
@media (max-width:620px){.qo{grid-template-columns:1fr}.qzbox{padding:10px 11px 11px}}
</style>

 <h1>分章短文</h1>
 <p class="sub">把 538 和 179 的考点词写进三五句的小短文里，句子短、结构简单，逐句中英对照。加粗带下划线的是本组考点词，点一下看释义和<b>同义替换</b>，可一键收进生词本。每篇底下有「小测」：看句子填词、选中文释义、选英文单词，几个小题当堂检验。</p>

<script>
var TXT={"1":[{"t":"Two Brothers","s":[["Two brothers can resemble each other and still share no character trait.","两兄弟可能长得很像,却一点性格特征都不共有。"],["You recognize a face before you recognize a name.","你先认出一张脸,才认出名字。"],["You must adjust the plan to the weather.","你必须根据天气调整计划。"],["An approach that relies on one method is fragile.","只依赖一种方法的做法很脆弱。"],["Water is fundamental to life, and nothing domestic runs without it.","水对生命是根本的,家里没有一样东西能离开它。"],["A whole town may rely on one well.","整个城镇可能只依赖一口井。"]]},{"t":"Words and Measures","s":[["We measure what we can and coin a word for the rest.","我们能测的就测,测不了的就造一个词。"],["Artificial light and a fertiliser both replace something natural.","人造光和化肥,都在替代某种自然的东西。"],["A prompt answer is not always a true one.","迅速的回答不一定是对的。"],["To exchange ideas is to gain twice.","交换想法是赢两次。"],["A simple idea may underlie a whole industry.","一个简单的想法可能支撑起整个行业。"],["To ignore the warning is to accept the risk.","忽视警告,就是接受风险。"],["Rather than wait, they left; thanks to the map, they arrived.","他们没有等,而是走了;多亏那张地图,他们到了。"]]}],"2":[{"t":"In the Laboratory","s":[["Researchers detect a problem long before they can solve it.","研究者发现问题,远早于能解决它。"],["To isolate one component is the first step of any analysis.","把其中一个成分单独拿出来,是任何分析的第一步。"],["A small budget forces you to avoid the obvious and look for an alternative.","预算小,逼着你避开显而易见的路,去找替代方案。"],["Species adapt to change, and those that cannot compensate will go.","物种会适应变化,补偿不了的那些会消失。"],["Diversity is a kind of insurance.","多样性是一种保险。"],["A tight rule will constrain what the next study can ask.","一条死规矩会限制下一项研究能问什么。"],["A beneficial change is easy to defend and hard to measure.","有益的改变容易辩护,却难以衡量。"],["Military research has given us much of what we use every day.","军事研究给了我们日常所用的很多东西。"]]},{"t":"The Syllabus","s":[["The criteria are written first, and the curriculum follows.","标准先写,课程跟着走。"],["A feasible plan is one the timetable can bear.","可行的计划,是时间表扛得住的计划。"],["A deficiency in one vitamin can be corrected by a supplement.","缺一种维生素,可以用补充剂补上。"],["To distinguish cause from coincidence is the whole job.","把原因和巧合分开,就是全部的活儿。"],["Teachers analyze the results and emphasize what went wrong.","老师分析结果,强调哪里出了错。"],["The difference is enormous, and it shows in every classroom.","差别是巨大的,在每个教室里都看得出来。"]]},{"t":"What Slows Us Down","s":[["To imitate a habit is not to understand it.","模仿一个习惯,不等于理解它。"],["A poor diet will impair growth and hinder recovery.","饮食差会损害生长,妨碍康复。"],["A legitimate question deserves a legitimate answer.","正当的问题值得一个正当的回答。"],["Every method has a limitation, and every convention has a reason.","每种方法都有局限,每个惯例都有原因。"],["The work is demanding, but the result will determine the next ten years.","这活儿要求很高,但结果会决定今后十年。"],["To accelerate the process is to skip a step, and ancient crafts were never in a hurry.","加速过程就是跳过一步,而古老的手艺从不着急。"]]},{"t":"Body and Mind","s":[["A chronic illness is one you manage, not one you cure.","慢性的病是管理的,不是治好的。"],["To be conscious of a habit is half of breaking it.","意识到一个习惯,就已经戒掉一半。"],["To minimize the damage is all you can do.","把损害降到最低,是你唯一能做的。"],["Immunity is memory in the blood.","免疫力是血里的记忆。"],["It is imperative that we act now.","我们必须现在就行动。"],["Bees secrete wax, and plants transmit signals through the soil.","蜂分泌蜡,植物通过土壤传递信号。"],["To exaggerate a danger is to make people stop listening.","夸大危险,会让人不再听。"]]},{"t":"Gone and Kept","s":[["A species becomes extinct when its last home goes.","当一个物种最后的家消失,它就灭绝了。"],["An exclusive right is one nobody else has.","专有的权利,是别人都没有的权利。"],["No guarantee is worth more than the person who gives it.","没有哪个保证,比给出它的人更值钱。"],["You inherit the house and the debts with it.","你继承房子,也继承它的债。"],["To witness something is to be unable to look away.","目击一件事,就是无法把眼睛移开。"],["A magnetic field cannot be seen, only its effects.","磁场看不见,只看得到它的作用。"],["A loss of two hours can be a loss of the whole day.","损失两小时,可能就损失一整天。"]]},{"t":"Choices","s":[["An option is a door you may never open.","选项是一扇你可能永远不开的门。"],["Most people prefer to be told what to do.","多数人更愿意被告知该做什么。"],["The priority is the primary task, and the principle is the rule behind it.","优先事项是首要任务,而原则是它背后的规则。"],["A potential buyer is not a customer yet.","潜在买家还不是顾客。"],["Quality matters more than quantity.","质量比数量重要。"],["To settle a question is to stop asking it.","把一个问题定下来,就是不再问它。"],["Modern equipment is sophisticated, but a specific tool still does the job best.","现代设备很精密,但专门的工具仍然最好用。"]]},{"t":"Survival","s":[["Only the adaptable survive, and the change may come swiftly and unexpectedly.","只有能适应的活下来,而变化可能又快又出乎意料。"],["The surrounding hills decide half of the weather.","周围的群山决定了一半的天气。"],["One more attempt costs nothing but time.","再试一次,除了时间什么也不花。"],["Expertise is knowledge that has been used.","专长是被用过的知识。"],["The faculty donated the equipment to the clinic.","院系把设备捐给了诊所。"],["The dynamics of a group are hard to see from inside.","一个群体的动态,从内部很难看清。"],["An incentive changes behaviour faster than a rule.","激励改变行为,比规则快。"]]},{"t":"Numbers of People","s":[["Mortality fell when clean water arrived.","干净的水到来之后,死亡率下降了。"],["A peripheral district is not the centre, but it is in the vicinity.","外围城区不是中心,但在附近。"],["To threaten is not to act, but it is close.","威胁不是行动,但离它很近。"],["Practice is the only route to a stable result.","练习是通向稳定结果的唯一路径。"],["Bacteria are older than us and will outlast us.","细菌比我们古老,也会比我们活得久。"],["All living things are subject to change and liable to error.","所有生物都会变,也都会出错。"],["An innate ability still needs training, and a pattern needs repeating.","天生的能力仍然需要训练,模式需要重复。"]]},{"t":"Slow Cure","s":[["Therapy is slow because the body is.","治疗慢,因为身体慢。"],["An original idea stays confidential until it is published.","原创的想法在发表之前是保密的。"],["Cognitive training does not make you cleverer, only faster.","认知训练不会让你更聪明,只会更快。"],["To comply with a rule is not the same as to agree with it.","遵守规则,不等于同意它。"],["Consult the map before the road.","先看地图,再上路。"],["A superior material costs more and lasts longer.","更好的材料更贵,也更耐久。"]]},{"t":"Working Together","s":[["To co-ordinate is harder than to co-operate.","协调比合作更难。"],["Two accounts of one event will differ.","同一个事件的两份叙述会不一样。"],["A cue is small; a signal is meant.","提示很小;信号是有意的。"],["To abandon a plan is not to halt the work.","放弃一个计划,不等于停下工作。"],["A fragile agreement will not be retained for long.","脆弱的协议保不住多久。"],["Water will erode stone until the mark vanishes.","水会侵蚀石头,直到痕迹消失。"],["Nothing can induce him to change, and delivery is the only stable part.","没什么能让他改变,而交付是唯一稳定的部分。"],["To integrate is to make equal parts of one whole.","整合是让各部分成为同一个整体的平等部分。"],["The grant was small, but it kept the work going.","拨款很少,但让工作继续了下去。"],["Old pipes are liable to crack, and co-operation between the two labs is slow.","旧管子容易裂,而两个实验室之间的合作很慢。"]]}],"3":[{"t":"Little by Little","s":[["Debts accumulate quietly, and some games are addictive.","债务安静地累积,而有些游戏让人上瘾。"],["Adversity shows what a person is; aggression shows what they are not.","逆境显出一个人是什么;攻击性显出他不是什么。"],["An agreeable manner opens more doors than a loud voice.","讨人喜欢的举止,比大嗓门开更多的门。"],["Foreign aid is not charity; it is policy.","对外援助不是慈善,是政策。"],["An allergic reaction can happen at any altitude.","过敏反应在任何海拔都可能发生。"],["An application must be approved before it is considered.","申请必须先被批准,才会被考虑。"],["An array of choices is not the same as freedom, and the attitude of an association is not the position of its members.","一排选择不等于自由,而协会的态度也不等于成员的态度。"],["The authority will assign a number to each file, and the result must be consistent with the rules.","主管部门会给每份档案编一个号,结果必须与规则一致。"]]},{"t":"Weight and Line","s":[["A tree can bear fruit for a century and still be killed by blight in a year.","一棵树能结果一百年,却可能一年之内被枯萎病弄死。"],["A boundary is a line; a burden is a weight.","边界是一条线;负担是一个重量。"],["To bungle a rescue is to turn an accident into a calamity.","把救援办砸,就是把一场事故变成一场灾难。"],["The capacity of a hospital is measured in beds, and a catastrophic failure in hours.","医院的能力用床位数衡量,而灾难性的失败用小时衡量。"],["To certify a teacher is to say the training is done, and a canteen must cater for everyone.","认证一位教师,就是说培训完成了;而食堂必须照顾到所有人。"],["Civic pride and a communal garden are the same feeling in two places.","公民自豪感和公共花园,是同一种感觉在两个地方。"],["Most people commute an hour and then comment on the traffic.","多数人通勤一小时,然后评论交通。"],["A commitment is a promise with a cost, and only then can you compare two of them.","承诺是带代价的许诺,到那时你才能比较两个。"]]},{"t":"Talk It Over","s":[["To conceal a mistake is to concentrate on the wrong problem.","掩盖一个错误,就是把注意力放在错的问题上。"],["The two reports concur on the facts and conflict on the cause.","两份报告在事实上一致,在原因上冲突。"],["To confer is to talk it over; to confuse is to talk past each other.","商议是把它谈一谈;使困惑是彼此说不到一处。"],["A conservative estimate is safe; a considerable one is no longer an estimate.","保守的估计是安全的;相当大的那个已经不算估计。"],["Everything is contingent: a controversial claim, a correlation, a courtship.","事事都有条件:一个争议说法、一个相关性、一段求偶。"],["A crash costs credibility, and a criminal case can become a crisis.","一次撞毁要付出信誉,一个刑案可以变成一场危机。"]]},{"t":"Slow Pressure","s":[["Criticism is easy; to curb your own is not.","批评很容易;管住自己的批评不容易。"],["A damp room, a dental bill and a deadline all wear you down.","潮湿的房间、牙医账单和截止期,都会把你磨薄。"],["To delay a decision is not to avoid it.","推迟一个决定,不等于避开它。"],["A democratic vote and a demographic shift are both slow.","民主投票和人口变化都很慢。"],["Depression is not sadness; it is a shortage.","抑郁不是悲伤,是短缺。"],["Bright shop windows dazzle a tired shopper.","明亮的橱窗晃得疲惫的购物者眼花。"],["To designate a site is to detain the plan.","指定一个地点,会把计划拖住。"],["To devastate a valley is to disclose what was hidden, and two disparate figures on display can look like one trend.","毁掉一条山谷会露出原本藏着的东西;而两个悬殊的数字摆在一起,看着就像一个趋势。"]]},{"t":"Interruption","s":[["A phone will disrupt a lesson and distract the class.","手机会打断一节课,也让全班分心。"],["To distribute the documentation is to make the case.","把文件分发出去,就是把案子立起来。"],["One domain is dominant, and the change is dramatic.","某一个领域占主导,而变化是戏剧性的。"],["A drought kills what a flood would have taken.","旱灾杀死的,是洪水本来会拿走的东西。"],["A durable and eco-friendly material costs more at first.","耐用又环保的材料,起初更贵。"],["An elaborate plan is often an elusive one.","精心复杂的计划,往往也是个抓不住的计划。"],["An encyclopaedia is out of date; an entrepreneur is not.","百科全书会过时,创业者不会。"],["The elderly were eliminated from the survey by design.","老人是被设计性地排除在调查之外的。"]]},{"t":"At the Equator","s":[["At the equator the rain comes erratically.","在赤道,雨下得没有规律。"],["An established estate is hard to move; an ethical objection is harder.","既成的产业难以搬动;伦理上的反对更难。"],["Eventually the evidence arrives, and the theory evolves.","证据最终会来,理论随之演化。"],["An experiment can be exceptional in two ways: too good, or too odd.","实验的“异常”有两种:太好,或太怪。"],["Be explicit about what you will exploit and how far you will extend it.","要明确你会利用什么、延伸到多远。"],["To extract one answer is not to understand the field.","抽出一个答案,不等于理解这个领域。"],["After a famine, every resource looks finite.","一场饥荒之后,每样资源看上去都是有限的。"]]},{"t":"Habitat","s":[["Fitness is a habit; a foe is a reason.","体能是习惯;敌人是理由。"],["Format decides how a fragment is read.","格式决定一个片段怎么被读。"],["To freeze a cell is to keep a gene for later.","冷冻一个细胞,就是把一个基因留给以后。"],["To fulfill a promise in hardship is a harsh test.","在困苦中履行承诺,是一场严厉的考验。"],["A gifted child needs a habitat, not a harbour.","有天赋的孩子需要的是生境,不是避风港。"],["An exhausted runner needs a wall, not a lesson.","筋疲力尽的跑者需要的是一面墙,不是一堂课。"],["Graphic evidence makes a hypothesis look like a fact.","图像化的证据,让假设看着像事实。"],["The impact is impressive, and the reason is dull.","影响令人印象深刻,原因却很乏味。"]]},{"t":"According to the Rules","s":[["In accordance with the rules, the file was closed.","按照规则,档案被归了档。"],["An inaccurate figure and an inactive member are both quietly damaging.","不准确的数字和不活跃的成员,都在悄悄造成损害。"],["An inappropriate joke at an intense moment cannot be taken back.","紧张时刻一句不合适的玩笑,收不回来。"],["To indulge a child is to infest the house with demands.","纵容孩子,就是让屋子里长满要求。"],["Pay the last installment before the interest does the work.","在利息替你干活之前,把最后一期付掉。"],["Intelligence is not the same as interaction, and interference is not help.","智力不等于互动,而干涉不是帮助。"],["An introverted student will not interrupt, but will involve himself in the interior work.","内向的学生不会打断别人,但会投入内部的活儿。"],["A keen reader notices what the report leaves out.","热切的读者会注意到报告漏掉了什么。"]]},{"t":"Read the Label","s":[["Read the label, and notice the lack of one.","看标签,也要注意它没有标签。"],["The landscape is the likelihood written large.","风景是被放大写出的可能性。"],["A limb can heal; a linguistic habit takes longer.","肢体能愈合;语言习惯要更久。"],["Keep a log of every malfunction.","把每次故障都记进日志。"],["A look-in is a small chance, and a lopsided deal is a large one.","一线机会是小的可能,而不对等的交易是大的那种。"],["Marine mammals are mainly what the survey is about.","海洋哺乳动物主要是这份调查的内容。"],["To manage to do it is to manifest a skill; to manufacture it is to fake one.","设法做成是显出本事;而制造出来是假装有。"]]},{"t":"The Mechanism","s":[["Mental fatigue and mercury poisoning look alike on a bad day.","心理疲劳和汞中毒,在倒霉的一天里看着一样。"],["A mate is chosen; a mechanism is inherited.","配偶是选来的;机制是继承的。"],["Meteorological data decide when birds migrate.","气象数据决定鸟什么时候迁徙。"],["Moisture is what a mould needs, and a monitor is what a nest needs.","霉菌需要湿气,而巢需要有人盯着。"],["A motif repeats; a native species does not move.","主题会重复;本地物种不会搬家。"],["A nocturnal animal keeps its own norm.","夜行动物有自己的常规。"],["Notoriety is not the same as fame, and an objective is not an obligation.","臭名不等于名声,目标也不等于义务。"]]},{"t":"Out of the Question","s":[["An obscure rule is still a rule.","冷僻的规则仍然是规则。"],["To obtain a permit is to accept an official odour of paper and ink.","拿到许可证,就是接受一种公文的纸墨味。"],["An odd result is not an offensive one.","古怪的结果不是冒犯的结果。"],["The optimum is rarely the ordinary.","最优很少是普通。"],["An organ can fail, and a plan can be out of the question.","器官会衰竭,而计划可能根本不必谈。"],["To overcome a habit is to overtake yourself.","克服一个习惯,是超过自己。"],["Fear can paralyse, and patience is paramount when you participate.","恐惧能让人瘫住,而参与时耐心最重要。"]]},{"t":"At the Peak","s":[["At its peak the river is a different thing.","到汛期高峰,这条河是另一样东西。"],["A permit permits; it does not persuade.","许可证只是允许,它不劝人。"],["A pessimistic forecast is easier to defend, and a patient reader will predict the ending.","悲观的预测更容易辩护;而有耐心的读者会预判结局。"],["Every phase has its physical cost.","每个阶段都有它的身体代价。"],["To plagiarise is to borrow without the debt.","抄袭是借钱不还。"],["Plenty of plots pose the same question.","很多情节提出同一个问题。"],["A portable radio and a private room are two kinds of poverty.","便携收音机和私人房间,是两种贫穷。"],["Praise is cheap; pressing work is not.","表扬很便宜,紧迫的工作不便宜。"]]},{"t":"Prohibit or Promote","s":[["To prohibit is quick; to promote is slow.","禁止很快;推广很慢。"],["To prolong a life is not always to prosper it.","延长生命,不一定让它兴旺。"],["To purify water is to qualify it for drinking.","净化水,就是让它够得上饮用。"],["A radical change covers a wide range.","激进的改变覆盖很宽的范围。"],["A rare event has a low rate.","罕见事件的比率很低。"],["To react is not to respond; recreation is not rest.","反应不是回应;娱乐不是休息。"],["A reduction in staff is decided before the rehearsal, and a good idea may still be rejected.","裁员在排练之前就定了,而好想法仍可能被否。"],["Refer to the plan, not to the person.","参照计划,不要参照人。"]]},{"t":"In the Shade","s":[["A relevant fact is worth ten interesting ones.","一个相关的事实,值十个有趣的。"],["A religious argument and a reluctant answer both stop a conversation.","宗教论证和不情愿的回答,都会让谈话停下。"],["Cells reproduce, and books are revised.","细胞复制,而书被修订。"],["A responsible editor will revive a dead idea after one revision.","负责的编辑会在一轮修订之后,让死掉的想法复活。"],["A scenic road can ruin a quiet valley.","一条风景公路能毁掉一条安静的山谷。"],["In the shade, skepticism grows.","在阴凉里,怀疑会长大。"],["Prices soar, and the blame falls solely on the solicitor.","价格飞涨,责任全落在律师身上。"],["To steer is to choose; to stimulate is to push.","掌舵是选择;刺激是推。"]]},{"t":"A Stride","s":[["A stride is a decision; to succumb is the absence of one.","迈步是一个决定;屈服是决定缺席。"],["To subdivide a field is to lose the subtle difference in it.","把一块地细分,就丢掉了其中细微的差别。"],["Substance matters more than sufficiency.","实质比充足更重要。"],["New tools supersede old ones, and old powers suppress new ones.","新工具取代旧的,旧权力压制新的。"],["Supremacy is a claim; a suspicious look is an answer.","霸权是一种主张;怀疑的一瞥是回答。"],["A sustainable plan has no symptom of hurry.","可持续的计划没有匆忙的症状。"],["Tension rises through the term and takes its toll throughout.","紧张在整个学期里上升,一路收取代价。"]]},{"t":"Trace the Line","s":[["To trace a line is to find where it began.","追踪一条线,就是找出它从哪儿开始。"],["Music can transcend language, and a bridge helps transit.","音乐能超越语言,而桥帮助通行。"],["A tremendous storm will trigger a tropical warning.","一场巨大的风暴会触发热带警报。"],["An unbiased report is a uniform one: the same in every edition.","无偏的报告是一致的报告:每一版都一样。"],["A valuable tool is a versatile one.","有价值的工具是多用途的。"],["The view is visible, but a photograph is visual.","景色是可见的,而照片是视觉的。"],["A violent scene damages well-being long after.","暴力的场面,在很久之后仍损害身心。"]]}],"4":[{"t":"Before You Go","s":[["Reserve a seat in advance; you will have to adjust the date later.","提前订座;日期你以后还得调。"],["Diversity is not a fee and cannot be established by a transfer.","多样性不是一笔费用,也不能靠转账建立。"],["A habitat is an international matter, and an export of vegetation is a trade in animals.","栖息地是国际事务,而出口植被就是做动物的买卖。"],["A feature of the food here is that the animal is never named.","这里食物的一大特点,是动物从来不被点名。"],["Many people emigrate for the weather and stay for the food.","很多人为天气移民,为食物留下。"]]},{"t":"What People Do","s":[["An allergic reaction to a new food can ruin a holiday.","对新食物过敏,能毁掉一个假期。"],["Fitness and tradition are the two things a small town keeps longest.","体能和传统,是一个小镇保留得最久的两样东西。"],["Entertainment is online now, and that is what the press writes about; publicity is what the picture is for.","娱乐如今在网上,而那是报纸所写的东西;宣传则是那张照片的用途。"],["Jewellery, artwork and a statue are all things a museum wants.","珠宝、艺术品和雕像,都是博物馆想要的。"],["A movie about geology set in the countryside is a movie about nothing.","一部以乡村为背景、讲地质的电影,是一部什么也没讲的电影。"],["The urban coastline is where the city meets its limits.","城市海岸线,是城市遇到自己边界的地方。"]]},{"t":"Where It Is","s":[["The environment is noisy, and the capacity of the place is limited.","环境很吵,而这个地方的容量有限。"],["Outdoor accommodation near a remote coast is cheap for a reason.","偏远海岸附近的露天住宿便宜是有原因的。"],["Every advantage comes with a disadvantage.","每一点优势都带着一点劣势。"],["Education is the ordinary people's route out.","教育是普通人走出去的路。"],["A student needs a purpose before a structure.","学生先要目的,才需要结构。"],["To learn is to build the structure yourself.","学习是自己把结构搭起来。"]]},{"t":"Source Material","s":[["Reference materials should be extensive, and expertise is what you bring to them.","参考资料应该足够广,而专长是你带给它们的东西。"],["A group will associate one approach with one person.","一个小组会把一种做法和一个人联系起来。"],["To motivate is to improve the odds; to overlook is to omit the risk.","激励是提高胜算;而忽视就是漏掉风险。"],["You will find an opportunity in a difficult year.","在困难的一年里,你也会找到机会。"],["To prevent a mistake is cheaper than to misunderstand it.","防止一个错误,比误解它便宜。"],["Those who try hard are rarely the ones who are overlooked.","努力的人,很少是被忽略的那些。"]]},{"t":"Feedback","s":[["Feedback will affect the analysis, and the result will affect the plan.","反馈会影响分析,结果会影响计划。"],["To handle a complaint is a skill; to support a colleague is a habit.","处理投诉是技能;支持同事是习惯。"],["An ideal design is a rigorous one, and a rigorous one restricts nothing essential.","理想的设计是严格的,而严格的设计不限制要紧的东西。"],["Two similar answers are rarely the same answer.","两个相似的答案,很少是同一个答案。"],["In this particular case, copy the method, not the statistics.","在这个具体案例里,复制方法,不要复制数据。"],["Maximum and minimum are the same measurement at two ends.","最大值和最小值,是同一次测量的两端。"],["The initial report is always the most confident.","最初的那份报告,总是最自信的。"]]},{"t":"How Much","s":[["A limited supply will shorten the season.","供应有限,会把这一季缩短。"],["Numbers will decrease, and a lack of rain will finish the job.","数字会下降,而缺雨会把这件事做完。"],["A large amount of data does not make a large truth.","大量数据并不能造出大的真相。"],["The majority will double their estimate and then halve it.","多数人会先把估计翻倍,然后再砍一半。"],["More than half the class is at present behind.","目前超过一半的学生落后。"],["To update is to make it newest again; to be out of date is only to be old.","更新是让它重新变成最新的;而过时只是旧了。"],["Soon is a promise; ancient is a fact; temporary is neither.","“很快”是承诺;“古老”是事实;“临时”两者都不是。"]]},{"t":"On Time","s":[["A deadline is temporary only if it is missed.","截止期只有在被错过时才是临时的。"],["A permanent post and an annual review do not go together.","一个永久职位和一次年度审核,不会同时存在。"],["More often than every month, less often than every day.","比每月更频繁,比每天更少。"],["To classify is to put it behind a label, below a heading, beside its relatives.","分类就是把它放到一个标签后面、一个标题下面、它的同类旁边。"],["An entrance is available from both sides.","入口两边都通。"],["A boring trend is still a trend, and a risky one is still poisonous.","无聊的趋势仍是趋势,而有风险的那个仍然有毒。"]]},{"t":"Warning","s":[["Take care: a warning is not a guarantee, and it cannot protect you from everything.","当心:警告不是保证,它也不能替你挡住一切。"],["To steal a march is to move before the injury.","抢占先机,就是在受伤之前先动。"],["Military tactics rely on travel, and space travel relies on transport.","军事战术依赖行进,而太空旅行依赖运载。"],["A specific request is clearer than a general one.","具体的请求比笼统的请求更清楚。"],["A clear sky does not mean the ground will not freeze.","晴空不意味着地面不会结冰。"],["An organization is only as good as its worst branch.","一个组织的好坏,取决于它最差的那个分支。"]]},{"t":"At Work","s":[["To organize is to produce order out of habit.","组织,是从习惯里生产秩序。"],["To administer is to keep it running, and an occupation keeps you running.","管理是让它运转,而职业让你一直跑。"],["All ages are welcome, but the youth set the tone.","各个年龄都欢迎,但定调的是年轻人。"],["A mate on the staff is worth two memos.","同事里有一个朋友,值两份备忘录。"],["A sale is cheap only if the discount is real.","只有折扣是真的,促销才算便宜。"],["Round the corner, in order, a hotel is being renovated and a man sits alone in hospitality.","拐过街角,一切井然,一家酒店正在翻新,一个男人独自坐在迎宾处。"]]},{"t":"Shape of a Thing","s":[["A roof shaped like a shell shows a preference for the sea, and depresses nobody.","做成贝壳形状的屋顶,显出对海的偏爱,也不让人压抑。"],["A well-known firm will specialize in one part of the market.","有名的公司会专做市场的一部分。"],["A typical case is uncommon in its details.","典型的案例,在细节上并不常见。"],["To measure accurately is to expand function forms(w){
 var sp=w.indexOf(' ');
 if(sp>-1){
  var head=w.slice(0,sp), rest=w.slice(sp), out=[w], bs=forms(head), i;

  '<div class="cvp"><i style="width:'+pct+'%"></i></div>'+
  (miss.length?'<details><summary>还有 '+miss.length+' 个词没进短文，点开看</summary><div class="left">'+
   miss.map(function(e){ return '<span title="'+(e[1]||'').replace(/"/g,'&quot;')+'">'+e[0]+'</span>' }).join('')+
   '</div></details>':'');
 if(typeof qstat==='function') qstat();
}

function chips(){
 var h='';
 for(var n=1;n<=4;n++) h+='<button class="cb'+(n===ch?' on':'')+'" data-ch="'+n+'">'+TT[n]+'</button>';
 document.getElementById('chs').innerHTML=h;
}
function go(n){
 stop();
 ch=n; set(KEY,String(n)); chips(); render();
 document.getElementById('cttl').innerHTML=TT[n]+' <em>'+TT.sub[n]+'</em>';
 window.scrollTo({top:0,behavior:'smooth'});
}

var pop=document.getElementById('pop');
function closePop(){ pop.classList.remove('on');
 var a=document.querySelectorAll('mark.pv.on'); for(var i=0;i<a.length;i++) a[i].classList.remove('on') }
function showPop(el, word){
 closePop();
 var w=word||el.getAttribute('data-w'), mean=(TT.m[w]||''), syn=(TT.s[w]||''), bk=J('kd-book',{});
 var r=el.getBoundingClientRect();
 pop.innerHTML='<div class="pw">'+w+'</div><div class="pm">'+mean+'</div>'+
  (syn?'<div class="ps">同义替换：'+syn+'</div>':'')+
  '<div class="pa"><button data-p="say">朗读</button><button data-p="add" class="'+(bk[w]?'on':'')+'">'+
  (bk[w]?'★ 已收':'☆ 收词')+'</button></div>';
 pop.classList.add('on'); if(el.tagName==='MARK') el.classList.add('on');
 var pw=pop.offsetWidth, ph=pop.offsetHeight;
 var x=r.left+r.width/2-pw/2, y=r.bottom+8;
 if(y+ph>innerHeight-10) y=r.top-ph-8;
 pop.style.left=Math.max(8,Math.min(x,innerWidth-pw-8))+'px';
 pop.style.top=Math.max(8,y)+'px';
 pop.setAttribute('data-cur',w);
}

function addBook(w){
 var bk=J('kd-book',{});
 if(bk[w]){ toast('「'+w+'」已经在生词本了'); return }
 bk[w]={w:w,m:TT.m[w]||'',c:(ch<=3?'538':'179'),lv:0,due:Date.now(),wr:0,t:Date.now()};
 set('kd-book',JSON.stringify(bk));
 toast('已收「'+w+'」 · 生词本共 '+Object.keys(bk).length+' 词');
}
var tm=null;
function toast(s){ var t=document.getElementById('toast'); t.textContent=s; t.classList.add('on');
 clearTimeout(tm); tm=setTimeout(function(){ t.classList.remove('on') },2000) }

var RT={on:false, q:[], n:0, b:null};
function canSpeak(){ return typeof speechSynthesis!=='undefined' }
function stop(){ if(RT.on&&canSpeak()) speechSynthesis.cancel();
 RT.on=false; var c=document.querySelectorAll('.sn.cur'); for(var i=0;i<c.length;i++) c[i].classList.remove('cur');
 if(RT.b) RT.b.classList.remove('on'); RT.b=null;
 var b=document.querySelector('.acts button[data-a="read"]'); if(b&&!RT.on) b.textContent='朗读' }
function step(){
 if(!RT.on) return;
 var c=document.querySelectorAll('.sn.cur'); for(var i=0;i<c.length;i++) c[i].classList.remove('cur');
 if(RT.n>=RT.q.length){ stop(); return }
 var node=RT.q[RT.n]; node.classList.add('cur');
 var y=node.getBoundingClientRect().top;
 if(y<70||y>innerHeight-100) node.scrollIntoView({block:'center',behavior:'smooth'});
 var u=new SpeechSynthesisUtterance(node.querySelector('.en').textContent);
 u.lang='en-GB'; u.rate=parseFloat(get(RATE,'0.95'))||0.95;
 u.onend=function(){ RT.n++; step() };
 u.onerror=function(){ RT.n++; step() };
 speechSynthesis.speak(u);
}

document.addEventListener('click', function(e){
 var t=e.target;
 var qo=t.closest('.qo button'); if(qo){ qAnswer(qo); return }
 if(t.closest('.qnext')){ qNext(); return }
 if(t.closest('.qagain')){ qStart(QZ.p); return }
 if(t.closest('.qclose')){ qClose(); return }
 var qb=t.closest('.qbb'); if(qb){ qStart(+qb.getAttribute('data-i')); return }
 var cb=t.closest('.cb'); if(cb){ go(parseInt(cb.getAttribute('data-ch'),10)); return }
 var b=t.closest('.acts button'); if(b){ act(b.getAttribute('data-a'), b); return }
 var sb=t.closest('.say');
 if(sb){ if(!canSpeak()){ toast('这个浏览器不支持朗读'); return }
  speechSynthesis.cancel();
  var n=+sb.getAttribute('data-say'), nodes=document.querySelectorAll('.pass[data-i="'+n+'"] .sn'), q=[];
  for(var i=0;i<nodes.length;i++) q.push(nodes[i]);
  RT.q=q; RT.n=0; RT.on=true; RT.b=sb; sb.classList.add('on'); step(); return }
 var pb=t.closest('#pop button');
 if(pb){ var w=pop.getAttribute('data-cur');
  if(pb.getAttribute('data-p')==='say') sayOne(w); else { addBook(w); pb.textContent='★ 已收'; pb.classList.add('on') } return }
 var wc=t.closest('.wlist span'); if(wc){ showPop(wc, wc.getAttribute('data-ww')); return }
 var sn=t.closest('.sn');
 if(sn&&document.body.classList.contains('blind')){ sn.classList.toggle('rev'); return }
 var m=t.closest('mark.pv');
 if(m){ if(document.body.classList.contains('blurred')&&!m.classList.contains('on')){ m.classList.add('on'); return }
  showPop(m); return }
 if(pop.classList.contains('on')&&!t.closest('#pop')) closePop();
});
function sayOne(w){ if(!canSpeak()) return; speechSynthesis.cancel();
 var u=new SpeechSynthesisUtterance(w); u.lang='en-GB'; u.rate=0.85; speechSynthesis.speak(u) }
function act(a,b){
 if(a==='blur'){ document.body.classList.toggle('blurred'); b.classList.toggle('on');
  toast(document.body.classList.contains('blurred')?'遮挡模式：先猜词，点一下看答案':'已显示所有词') }
 else if(a==='zh'){ document.body.classList.toggle('nozh'); b.classList.toggle('on',!document.body.classList.contains('nozh')) }
 else if(a==='blind'){ document.body.classList.toggle('blind'); b.classList.toggle('on');
  toast(document.body.classList.contains('blind')?'盲读模式：只看中文，点英文句子显形':'已恢复') }
 else if(a==='read'){
  if(RT.on){ stop(); return }
  if(!canSpeak()){ toast('这个浏览器不支持朗读'); return }
  speechSynthesis.cancel();
  var nodes=document.querySelectorAll('.pass .sn'), q=[];
  for(var i=0;i<nodes.length;i++) q.push(nodes[i]);
  RT.q=q; RT.n=0; RT.on=true; RT.b=b; b.classList.add('on'); b.textContent='停止'; step() }
 else if(a==='th'){ var t2=get(TH,''); set(TH,t2===''?'dark':(t2==='dark'?'light':'')); applyTH();
  b.textContent=get(TH,'')==='dark'?'深':(get(TH,'')==='light'?'浅':'自'); b.classList.toggle('on',!!get(TH,'')) }
}
document.addEventListener('keydown', function(e){
 if(e.target.tagName==='INPUT') return;
 if(QZ.p>=0&&!QZ.done){
  if(e.key>='1'&&e.key<='4'){
   var ob=document.querySelector('.pass[data-i="'+QZ.p+'"] .qo button[data-o="'+(+e.key-1)+'"]');
   if(ob){ e.preventDefault(); qAnswer(ob); return }
  }
  if(e.key==='Enter'){
   var nb=document.querySelector('.pass[data-i="'+QZ.p+'"] .qnext');
   if(nb){ e.preventDefault(); qNext(); return }
  }
 }
 if(e.key==='ArrowRight'&&ch<4) go(ch+1);
 else if(e.key==='ArrowLeft'&&ch>1) go(ch-1);
 else if(e.key==='Escape'){ closePop(); stop() }
});
window.addEventListener('resize', function(){ closePop() });
window.addEventListener('scroll', function(){ if(pop.classList.contains('on')) closePop() }, {passive:true});
document.addEventListener('visibilitychange', function(){ if(document.hidden) stop() });

var ICON='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3.2 6.2v3.6h1.9L8 12.2V3.8L5.1 6.2H3.2z"/><path d="M10.4 6.3a2.5 2.5 0 0 1 0 3.4"/><path d="M12.1 4.7a4.8 4.8 0 0 1 0 6.6"/></svg>';
/* ================= 本篇小测 ================= */
var QK='kd-quiz';
var QZ={p:-1, qs:[], n:0, ok:0, bad:[], done:false};

function qrec(){ return J(QK,{}) }
function usable(w){ var m=TT.m[w]||''; return !!m && !/的衍生词$/.test(m) }
function posOf(m){ var x=(m||'').match(/^([a-z]+)\./); return x?x[1]:'' }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=a[i]; a[i]=a[j]; a[j]=t } return a }
function hesc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){
 return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c] }) }

function qPool(word, mean){
 var list=CHS[ch]||[], same=[], all=[], i, e;
 for(i=0;i<list.length;i++){
  e=list[i];
  if(e[0]===word||!usable(e[0])) continue;
  all.push(e[0]);
  if(posOf(e[1])===posOf(mean)) same.push(e[0]);
 }
 return same.length>=3? same : all;
}

function findSent(p, w){
 var fs=forms(w).map(function(x){ return x.toLowerCase() }), k, j;
 for(k=0;k<p.s.length;k++){
  var t=p.s[k][0], m=t.match(/[A-Za-z][A-Za-z'’-]*/g)||[];
  for(j=0;j<m.length;j++){
   if(fs.indexOf(m[j].toLowerCase())>-1) return {t:t, zh:p.s[k][1], form:m[j]};
  }
 }
 return null;
}

function inText(w, text){
 var fs=forms(w), i;
 for(i=0;i<fs.length;i++){
  if(new RegExp('(?<![A-Za-z])'+esc(fs[i])+'(?![A-Za-z])','i').test(text)) return true;
 }
 return false;
}
function optsFor(word, mean, type, ban){
 var pool=shuffle(qPool(word, mean)), out=[], seen={}, i, txt, pass;
 var right=(type==='e2z')? mean : word;
 out.push(right); seen[right]=1;
 for(pass=0;pass<2&&out.length<4;pass++){
  for(i=0;i<pool.length&&out.length<4;i++){
   if(pass===0 && ban && type!=='e2z' && inText(pool[i], ban)) continue;
   txt=(type==='e2z')? (TT.m[pool[i]]||'') : pool[i];
   if(!txt||seen[txt]) continue;
   seen[txt]=1; out.push(txt);
  }
 }
 return shuffle(out);
}

function qStart(i){
 var pass=document.querySelector('.pass[data-i="'+i+'"]');
 if(!pass) return;
 qClose();
 var ps=TXT[ch][i]; if(!ps) return;
 var ws=(pass.getAttribute('data-ws')||'').split('|').filter(function(w){ return w&&usable(w) });
 if(!ws.length){ toast('这一篇没有可以测的词'); return }
 shuffle(ws);
 var cnt = ws.length<=3? ws.length : (ws.length>=10?5:4);
 ws=ws.slice(0, cnt);
 var pat=['c','e2z','z2e','c','z2e'], qs=[];
 for(var k=0;k<ws.length;k++){
  var w=ws[k], mean=TT.m[w]||'';
  var s=(w.indexOf(' ')>=0)? null : findSent(ps, w);
  var type=pat[k]||'e2z';
  if(type==='c'&&!s) type='e2z';
  var q={w:w, m:mean, type:type, sent:s, picked:-1};
  if(type==='c'){
   q.zh=s.zh; q.form=s.form;
   q.blank=hesc(s.t).replace(new RegExp('(?<![A-Za-z])'+esc(s.form)+'(?![A-Za-z])'),
     '\u0001').replace('\u0001','<span class="blank"></span>');
   if(q.blank.indexOf('class="blank"')<0) type='e2z';
   q.fill=hesc(s.t).replace(new RegExp('(?<![A-Za-z])('+esc(s.form)+')(?![A-Za-z])'), '<b>$1</b>');
  }
  q.type=type;
  q.ans=(type==='e2z')? mean : w;
  q.opts=optsFor(w, mean, type, type==='c'? s.t : null);
  if(q.opts.indexOf(q.ans)<0) q.opts[0]=q.ans;
  qs.push(q);
 }
 QZ={p:i, qs:qs, n:0, ok:0, bad:[], done:false};
 var box=document.createElement('div'); box.className='qzbox';
 pass.appendChild(box);
 qRender();
}

function qRender(){
 if(QZ.p<0) return;
 var box=document.querySelector('.pass[data-i="'+QZ.p+'"] .qzbox');
 if(!box) return;
 var total=QZ.qs.length, head;
 if(QZ.done){
  var tip = QZ.bad.length? ('不太熟的 <b>'+QZ.bad.length+'</b> 个词已经收进生词本，复习时会再见到')
                        : '全对，这一篇的词基本认住了';
  box.innerHTML='<div class="qh"><span class="qn2">完成</span><span>本篇小测</span>'+
   '<button class="qclose">收起</button></div>'+
   '<div class="qdone">答对 <b>'+QZ.ok+'</b> / '+total+' · '+tip+'</div>'+
   (QZ.bad.length? '<div class="qbad">'+QZ.bad.map(function(w){
     return '<span data-ww="'+w+'">'+w+'</span>' }).join('')+'</div>' : '')+
   '<div class="qf"><button class="prim qagain">再测一遍</button><button class="qclose">收起</button></div>';
  return;
 }
 var q=QZ.qs[QZ.n];
 var tags={c:'看句子填词', e2z:'选中文释义', z2e:'选英文单词'};
 head='<div class="qh"><span class="qn2">'+(QZ.n+1)+'/'+total+'</span><span>'+tags[q.type]+'</span>'+
  '<button class="qclose">收起</button></div>';
 var body;
 if(q.type==='c'){
  body='<div class="qq">'+q.blank+
   (document.body.classList.contains('nozh')?'':'<span class="qzh">'+hesc(q.zh)+'</span>')+'</div>';
 } else if(q.type==='e2z'){
  body='<div class="qq"><b class="qw">'+hesc(q.w)+'</b></div>';
 } else {
  body='<div class="qq"><b class="qw">'+hesc(q.m)+'</b></div>';
 }
 var opts='<div class="qo">'+q.opts.map(function(x,k){
  return '<button data-o="'+k+'"><span class="oi">'+'ABCD'.charAt(k)+'</span>'+hesc(x)+'</button>' }).join('')+'</div>';
 box.innerHTML=head+body+opts+'<div class="qf"></div>';
}

function qAnswer(btn){
 if(QZ.p<0||QZ.done) return;
 var q=QZ.qs[QZ.n]; if(!q||q.picked>=0) return;
 var k=+btn.getAttribute('data-o');
 var ok=(q.opts[k]===q.ans);
 q.picked=k;
 if(ok) QZ.ok++; else { QZ.bad.push(q.w); addBook(q.w) }
 var box=document.querySelector('.pass[data-i="'+QZ.p+'"] .qzbox'); if(!box) return;
 var bs=box.querySelectorAll('.qo button');
 for(var i=0;i<bs.length;i++){
  if(q.opts[i]===q.ans) bs[i].classList.add('ok');
  else if(i===k) bs[i].classList.add('no');
  else bs[i].classList.add('dim');
 }
 var sy=(TT.s&&TT.s[q.w])||'';
 var fb=(ok?'<span class="qy">✓ 对了</span>':'<span class="qn">✗ 错了</span>');
 if(q.type==='c'){
  fb+=' · <b>'+hesc(q.w)+'</b> · '+hesc(q.m);
  if(q.sent.form.toLowerCase()!==q.w.toLowerCase())
   fb+='<i>（原句用的是 '+hesc(q.sent.form)+'）</i>';
  if(!ok) fb+='<span class="qzh">'+(q.fill||hesc(q.sent.t))+'<br>'+hesc(q.sent.zh)+'</span>';
 } else {
  fb+=' · <b>'+hesc(q.w)+'</b> · '+hesc(q.m);
 }

 if(sy) fb+='<span class="qzh">同义替换：'+hesc(sy)+'</span>';
 fb+='<button class="prim qnext">'+(QZ.n+1<QZ.qs.length?'下一题':'看结果')+'</button>';
 box.querySelector('.qf').innerHTML=fb;
}

function qNext(){
 if(QZ.p<0||QZ.done) return;
 QZ.n++;
 if(QZ.n>=QZ.qs.length){
  QZ.done=true;
  qsave(QZ.p, QZ.ok, QZ.qs.length);
  qRender(); qstat();
  if(QZ.bad.length) toast('答错 '+QZ.bad.length+' 个，已收进生词本');
  return;
 }
 qRender();
}

function qsave(i,r,n){
 var o=qrec(); if(!o[ch]) o[ch]={};
 o[ch][i]={r:r, n:n, t:Date.now()};
 set(QK, JSON.stringify(o));
}

function qstat(){
 var o=(qrec()[ch])||{}, k=0, r=0, n=0, i;
 for(i in o){
  if(!o[i]) continue;
  k++; r+=o[i].r||0; n+=o[i].n||0;
  var e=document.querySelector('.qsc[data-q="'+i+'"]');
  if(e) e.innerHTML='<b>'+o[i].r+'/'+o[i].n+'</b> 正确';
  var b=document.querySelector('.qbb[data-i="'+i+'"]');
  if(b) b.textContent='再测';
 }
 var sum=document.getElementById('qsum');
 if(sum) sum.innerHTML = k? ('已测 <b>'+k+'</b>/'+(TXT[ch]||[]).length+' 篇 · 平均 '+
   Math.round(r*100/Math.max(1,n))+'%') : '';
}

function qClose(){
 var b=document.querySelector('.qzbox');
 if(b&&b.parentNode) b.parentNode.removeChild(b);
 QZ={p:-1, qs:[], n:0, ok:0, bad:[], done:false};
}
document.getElementById('zhbtn').classList.add('on');
chips();
document.getElementById('cttl').innerHTML=TT[ch]+' <em>'+TT.sub[ch]+'</em>';
render();
</script>
