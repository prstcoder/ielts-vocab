<style>
:root{--bg:#f7f6f2;--panel:#fff;--ink:#1f2328;--ink2:#5b6470;--line:#e6e2da;--chip:#efece6;
 --accent:#0f766e;--acc-soft:#eaf4f2;--mark:#d7ece8;--green:#1f7a52;--warn:#b4452e;--serif:"Iowan Old Style","Palatino Linotype",Georgia,"Songti SC",serif}
html.dark{color-scheme:dark;--bg:#14181a;--panel:#1b2124;--ink:#e8eaed;--ink2:#9aa3ad;--line:#2b3236;
 --chip:#232b2e;--acc-soft:#16302d;--mark:#1d4a44;--green:#6cc38b;--warn:#f0776a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 -apple-system,BlinkMacSystemFont,

header{padding:26px 0 8px}

 border-radius:999px;padding:3px 12px;margin-bottom:14px;background:var(--panel)}

.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 0 10px;
 border-top:1px solid var(--line);padding-top:13px}

.ttl em{font-style:normal;color:var(--ink2);font-weight:500;font-size:13px;margin-left:7px}

.acts button{font:inherit;font-size:12.5px;font-weight:650;border-radius:9px;cursor:pointer;
 border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 11px}
.acts button:hover{border-color:var(--accent);color:var(--accent)}
.acts button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.cov{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:14px}
.cv1{display:flex;align-items:baseline;gap:8px;font-size:12.8px;color:var(--ink2);flex-wrap:wrap}
.cv1 b{font-size:15px;color:var(--accent);font-variant-numeric:tabular-nums}
.cvp{height:5px;border-radius:3px;background:var(--chip);margin-top:8px;overflow:hidden}
.cvp i{display:block;height:100%;background:var(--accent);border-radius:3px}
.cov details{margin-top:4px}
.cov summary{font-size:12.5px;color:var(--ink2);cursor:pointer;list-style:none;outline:none}
.cov summary::-webkit-details-marker{display:none}
.cov summary:hover{color:var(--accent)}
.left{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.left span{font-size:12px;background:var(--chip);color:var(--ink2);border-radius:6px;padding:2px 7px;cursor:help}
.pass{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:15px 17px 11px;margin-bottom:12px}

.pt{font-size:14.5px;font-weight:700}

 padding-top:9px;border-top:1px dashed var(--line)}

.sn .en{color:inherit}
/* 段落版 */
body.para .ps .pen{text-align:justify;text-justify:inter-word;hyphens:auto}
body.para .sn{display:inline}
body.para .sn .zh{display:none}
body.para .ps .pzh{display:block;text-align:justify}
/* 逐句版 */
body.sent .sn{display:block;margin:0 0 12px;padding:1px 4px}
body.sent .sn:last-of-type{margin-bottom:0}
body.sent .sn .en{display:block;font:16.4px/1.62 var(--serif)}
body.sent .sn .zh{display:block;font-size:12.6px;line-height:1.55;color:var(--ink2);margin-top:2px}
body.sent .ps .pzh{display:none}
.ps .zh b,.ps .pzh b{font-weight:800;color:var(--ink)}
body.nozh .ps .pzh,body.nozh .sn .zh{display:none}
.sn.cur{background:var(--acc-soft);box-shadow:none;border-radius:3px}
.sn.cur .en{color:var(--accent)}
mark.pv{background:none;color:inherit;cursor:pointer;padding:0 1px;border-radius:2px;font-weight:680;
 box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--accent) 32%,transparent)}
mark.pv:hover{background:var(--mark);box-shadow:none}
mark.pv.on{background:var(--accent);color:#fff;box-shadow:none}
body.blurred mark.pv{color:transparent;background:var(--chip);box-shadow:none;border-radius:3px}
body.blurred mark.pv.on{color:inherit;background:var(--mark);box-shadow:none}
body.para.blind .ps .pen{filter:blur(4.5px);cursor:pointer;user-select:none}
body.para.blind .ps.rev .pen{filter:none}
body.sent.blind .sn .en{filter:blur(4.5px);cursor:pointer;user-select:none}
body.sent.blind .sn.rev .en{filter:none}
.say{border:0;background:none;cursor:pointer;color:var(--ink2);padding:2px;line-height:0;border-radius:6px}
.say:hover{color:var(--accent);background:var(--acc-soft)}
.say svg{width:15px;height:15px}
.wlist{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px;padding-top:9px;border-top:1px dashed var(--line)}

.wlist span:hover{color:var(--accent)}
#pop{position:fixed;z-index:90;min-width:180px;max-width:320px;background:var(--panel);border:1px solid var(--line);

#pop.on{display:block}

#pop .ps{font-size:12px;color:var(--accent);margin-top:6px;line-height:1.55;background:var(--acc-soft);
 border-radius:6px;padding:4px 7px}
#pop .pa{display:flex;gap:6px;margin-top:9px}
#pop .pa button{font:inherit;font-size:12px;font-weight:650;border:1px solid var(--line);background:var(--panel);
 color:var(--ink);border-radius:7px;padding:4px 10px;cursor:pointer}
#pop .pa button:hover{border-color:var(--accent);color:var(--accent)}
#pop .pa button.on{background:var(--accent);border-color:var(--accent);color:#fff}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);background:var(--ink);color:var(--bg);
 font-size:13px;padding:8px 16px;border-radius:999px;opacity:0;transition:.22s;pointer-events:none;z-index:99;
 max-width:80vw;text-align:center}

 border-bottom:2px solid color-mix(in srgb,var(--accent) 55%,transparent)}
.qzh{display:block;font-size:12.4px;line-height:1.55;color:var(--ink2);margin-top:3px;
 font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
.qo{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}

 border:1px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer;transition:.12s}
.qo button:hover{border-color:var(--accent);color:var(--accent)}
.qo button .oi{font-size:10.5px;color:var(--ink2);margin-right:6px;font-variant-numeric:tabular-nums}
.qo button.ok{background:var(--panel);border-color:var(--green);color:var(--green);font-weight:650}
.qo button.ok .oi{color:var(--green)}

.qf .qy{color:var(--green);font-weight:700}
.qf .qn{color:var(--warn);font-weight:700}
.qf button{font:inherit;font-size:12px;font-weight:650;border-radius:7px;padding:4px 12px;cursor:pointer;
 border:1px solid var(--line);background:var(--panel);color:var(--ink);float:right;margin-left:8px}
.qf button.prim{background:var(--accent);border-color:var(--accent);color:#fff}
.qf button:hover{filter:brightness(1.05)}
.qdone{font-size:13.4px;line-height:1.6}
.qdone b{font-size:16px;color:var(--accent);font-variant-numeric:tabular-nums}
.qbad{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.qbad span{font-size:11.5px;background:var(--panel);color:var(--ink2);border:1px solid var(--line);
 border-radius:5px;padding:1px 7px;cursor:pointer}
.qbad span:hover{color:var(--accent);border-color:var(--accent)}
@media (max-width:620px){.qo{grid-template-columns:1fr}.qzbox{padding:10px 11px 11px}}

 <h1>分章短文</h1>
 <p class="sub">把 538 和 179 的考点词写进小短文里：每篇一段英文，连着读下来是一个完整的意思，下面配一整段中文。加粗带下划线的是本组考点词，点一下看释义和<b>同义替换</b>，可一键收进生词本。每篇底下有「小测」：看句子填词、选中文释义、选英文单词，几个小题当堂检验。</p>

<script>
var TXT={"1":[{"t":"What Can Be Measured","s":[["A trait is what you can measure, and a habit is what you ignore.","特性是你能测量的东西，习惯是你不管的东西。"],["Two leaves may resemble each other, and nobody recognizes the third.","两片叶子可能长得像，第三片就没人认得出。"],["You adjust the light and the plant answers, thanks to one hormone.","你调一下光，植物就回应，全靠一种激素。"],["A domestic variety is smaller, and an artificial one is dearer.","家养的品种小一些，人造的品种贵一些。"],["The fundamental rule underlies every experiment in this room.","基本规律是这间屋子里每个实验的底子。"]]},{"t":"How a Name Is Made","s":[["They coin a name and exchange it for a fee.","他们造一个名字，再拿它换一笔钱。"],["One approach relies on the soil, and another relies on fertiliser.","一种方法是靠土壤，另一种是靠化肥。"],["The prompt was simple, and the exchange of letters took a month.","要求很简单，来回的信却走了一个月。"],["You trust the soil rather than the fertiliser, and the yield says why.","你信土壤而不信化肥，产量会告诉你为什么。"]]}],"2":[{"t":"Setting Up a Study","s":[["A study needs diversity, and a small sample avoids it.","一项研究需要多样性，小样本正好避开了它。"],["You detect a change in the soil and isolate the one cause.","你察觉土壤里的一处变化，再把唯一的原因单独隔出来。"],["You adapt to a budget, or choose an alternative.","你去适应一份预算，或者换一个替代方案。"],["A component fails, and a good design compensates for it.","一个部件坏了，好的设计会把它补上。"],["Military money buys a component, not a result.","军用的钱买的是一个部件，不是一个结果。"]]},{"t":"What Makes a Plan","s":[["The criteria are clear, and the curriculum is not.","标准写得很清楚，课程本身并不清楚。"],["A feasible plan is one you can constrain to a budget.","可行的方案，是你能限制在一份预算里的那个。"],["A deficiency is a gap, and a supplement fills it.","缺陷是一个缺口，补充的东西把它填上。"],["You distinguish two causes, analyze each, and emphasize neither.","你把两个原因分开，各自分析，两个都不强调。"],["An enormous loss is one you cannot analyze in a week.","巨大的损失，是一个礼拜分析不完的那种。"]]},{"t":"Slowing Things Down","s":[["A convention makes it easy to imitate, and a habit makes it automatic.","惯例让人容易模仿，习惯让模仿变成自动的。"],["Noise impairs sleep, and a bad road hinders trade.","噪音削弱睡眠，一条烂路阻碍买卖。"],["A legitimate claim has a document, and a limitation has a date.","正当的要求有一份文件，限制有一个期限。"],["A demanding job determines your week, and an ancient rule your year.","一份苛求的工作决定你的一周，一条古老的规矩决定你的一年。"],["A warm spring accelerates growth, and that is beneficial for a farmer.","暖春让生长加快，这对种地的人是好事。"]]},{"t":"The Body","s":[["A chronic illness is slow, and a beneficial habit is slower.","慢性病来得慢，好习惯见效更慢。"],["A conscious effort minimizes the damage, and nothing else does.","有意识的努力把损害减到最小，别的都不行。"],["A vaccine is imperative in a city, and immunity follows in a month.","在城市里疫苗是必须的，免疫力一个月后跟上。"],["Glands secrete, nerves transmit, and neither asks permission.","腺体分泌，神经传导，两样都不问许可。"],["You exaggerate a fever and call an extinct animal shy.","你把一场发烧说得夸张，还说一种灭绝的动物是害羞。"]]},{"t":"Rights and Losses","s":[["An exclusive deal guarantees nothing, and a witness guarantees less.","独家协议什么都保证不了，证人保证得更少。"],["A son inherits the land, and a magnetic tape keeps the voice.","儿子继承那块地，一盘磁带留着那个声音。"],["A loss leaves one option, and it is usually the cheap one.","一次亏损只留下一个选择，通常是最便宜的那个。"],["Most people prefer to queue less, and a priority lane sells that.","多数人宁愿少排队，优先通道卖的就是这个。"],["A primary cause is the one you can fix, and a principle is not.","主要原因是你修得好的那个，原理不是。"]]},{"t":"How Much and How Many","s":[["A potential buyer asks a specific question and gets a vague answer.","潜在的买家问一个具体问题，得到一个含糊的回答。"],["They settle the price by quantity and never by quality.","他们按数量定价，从不按质量。"],["A specific rule can sophisticate a plain trade.","一条具体的规则能把一门简单的生意搞复杂。"],["A species survives in a narrow range, and a swift change ends it.","一个物种在很窄的范围里存活，一次迅速的变化就终结它。"],["Unexpectedly, the surrounding hills hold water all year.","出乎意料的是，四周的山常年存着水。"]]},{"t":"Who Pays","s":[["An attempt costs a month, and expertise costs ten years.","一次尝试花一个月，专门的技术要花十年。"],["An expertise is a faculty trained for years, and it shows.","一门专长是练了多年的能力，看得出来。"],["You donate money, and the incentive does the rest.","你捐钱，剩下的靠激励去办。"],["Dynamics explains a push, and mortality explains a curve.","动力学解释一次推动，死亡率解释一条曲线。"],["A peripheral road is quiet, and the vicinity is cheap.","外围的路安静，附近的地价便宜。"],["A fire threatens the houses in the vicinity.","一场火威胁着附近一带的房子。"]]},{"t":"Mind and Habit","s":[["Practice makes a habit, and bacteria make a colony.","练习养成习惯，细菌聚成菌落。"],["A coastal town is subject to storms, and its low streets are liable to floods.","海边的小镇容易遭风暴，低处的街道还容易发水。"],["An innate fear needs no lesson, and a pattern needs a second look.","天生的恐惧不用教，一个模式要再看一遍。"],["The original therapy was cheaper, and the new one works faster.","最初的那种治疗更便宜，新的那种见效更快。"],["A confidential report is hard to test, and a cognitive one is harder.","机密报告很难检验，认知方面的更难。"]]},{"t":"Working Together","s":[["You comply with a rule you did not write and consult a man who did.","你遵守一条不是你写的规矩，再去找写它的人商量。"],["A superior officer co-ordinates a plan, and a budget limits it.","上级军官协调一份计划，预算限制这份计划。"],["Co-operation wins a contract, and an incentive keeps the staff.","合作赢下一份合同，激励留住人手。"],["Two accounts differ in one detail, and that detail is the cue.","两份说法只差一个细节，那个细节就是线索。"],["A signal can halt a train, and a shout can abandon a plan.","一个信号能让火车停下，一声喊能让计划作废。"]]},{"t":"Holding Together","s":[["A fragile shell retains nothing once it cracks.","脆的壳一裂就什么也留不住。"],["A coastline erodes, and a name vanishes with it.","海岸被冲蚀，一个名字跟着消失。"],["A delivery induces a smile, and a delay induces a call.","东西送到会引出笑，一延误就引出电话。"],["A stable price integrates two markets, and an equal one joins them.","稳定的价格把两个市场连成一体，相等的价格把它们并成一个。"],["They grant a licence for a year, and a budget pays for the year.","他们发一张一年的执照，预算付这一年的钱。"]]}],"3":[{"t":"The Football Crowd","s":[["Aggression on the pitch is easy to see and hard to punish.","场上的侵犯动作看得见，却很难罚。"],["The team played badly in adversity and well when they were ahead.","这支球队一落后就打不好，领先了倒打得顺。"],["The new coach is agreeable in public and strict in the dressing room.","新教练在外面很和气，进了更衣室就很严。"],["First aid reached the bench within a minute.","急救一分钟内就到了替补席。"],["One player is allergic to the grass, which nobody quite believes.","有个球员对草过敏，这话没人太信。"],["At altitude the ball travels further, and everybody notices.","海拔高的地方球飞得更远，谁都看得出来。"],["Their attitude changed completely after the second goal.","第二个球进了以后，他们的态度完全变了。"],["The authority on the rules was a retired referee from the next town.","懂规则的那位权威，是邻镇一个退下来的裁判。"]]},{"t":"The Museum Store","s":[["Over forty years the museum accumulated far more than it could show.","四十年下来，博物馆积攒的东西远远超过它能展出的。"],["Some of the old games are addictive, and the staff know it.","有些老游戏让人上瘾，馆里的人心里清楚。"],["His application for a study room was approved in March.","他申请一间研究室，三月批下来了。"],["An array of boxes fills the basement, each one labelled by hand.","地下室摆着一大批箱子，每一只都是手写的标签。"],["Two students were assigned to the collection of coins.","两个学生被派去整理那批钱币。"],["The local association of teachers paid for the shelves.","这些架子是本地教师协会出钱买的。"],["The records must be consistent with the notebook kept at the front desk.","档案必须和前台那本笔记一致。"]]},{"t":"The Flood","s":[["A late frost blighted the whole apple crop that year.","那年一场晚霜把苹果全毁了。"],["The boundary between the two fields has moved twice in living memory.","在还有人记得的年月里，两块田的边界挪过两次。"],["The cost of the new roof was a burden on eight families.","换新屋顶的钱，对八户人家来说是笔负担。"],["The storm was a calamity for a village this small.","这么小的村子，这场风暴就是灾难。"],["The old hall has the capacity for sixty people and no more.","老礼堂最多容得下六十个人，再多不行。"],["The damage was catastrophic for the shop, which had no insurance.","对这家没上保险的店来说，损失是毁灭性的。"],["A hall that caters for weddings is no use as a shelter.","一个专门办婚礼的礼堂，当避难所一点用都没有。"],["A doctor had to certify that the building was safe to enter.","得有位医生证明这栋楼进去是安全的。"],["The civic pride of the town survived the flood.","这座镇子的那份公共体面，倒是没被水冲走。"]]},{"t":"The Long Commute","s":[["The chair asked for a comment from each member and got four.","主席请每位成员发表意见，只收到四条。"],["The commitment was two evenings a month, which quietly became four.","本来答应一个月两个晚上，后来悄悄变成四个。"],["The communal garden behind the flats is the only green space left.","公寓后面那块公共园地，是仅剩的一片绿地。"],["Most people here commute for an hour in each direction.","这儿大多数人上下班单程要一个小时。"],["It is hard to compare this town with the one they left.","这个镇和他们离开的那个，实在不好比。"],["The council did not conceal the cost, which was brave of them.","市政没把花销藏起来，这一点挺有种。"],["She could not concentrate with the builders working outside.","外面施工，她怎么也专心不了。"]]},{"t":"Two Views","s":[["Only two members concur with the plan, and both of them live nearby.","只有两位成员同意这个方案，而这两位都住在附近。"],["The mayor will confer a small award on the oldest volunteer.","市长要给最年长的志愿者颁一个小奖。"],["There is a conflict between the plan and the budget.","这个方案和预算之间有冲突。"],["The maps confuse even the people who drew them.","这些地图连画的人自己都看糊涂。"],["The older members are conservative about the garden wall.","年纪大的成员对园子那道墙很保守。"],["A considerable amount of money has gone into that fence.","那道篱笆花掉的钱相当可观。"]]},{"t":"The Bird in the Field","s":[["The courtship of that bird lasts three days and involves a great deal of noise.","这种鸟的求爱期有三天，吵得不得了。"],["The male fans his tail to dazzle the female, and she pretends not to look.","雄鸟把尾巴张开，想晃花雌鸟的眼，她却装作没看见。"],["She will bear two eggs and raise them without any help.","她会下两个蛋，自己一个把小鸟带大。"],["One year he bungled the whole display and got nothing.","有一年他把整套表演搞砸了，什么也没得到。"],["The result is contingent on the weather in April.","成不成，全看四月的天气。"],["Two students have watched this field for eleven springs.","两个学生在这块地上看了十一个春天。"],["Their notes are the only record of it anywhere.","他们的笔记，是世上唯一的记录。"]]},{"t":"The Court Case","s":[["The decision was controversial, and the newspaper said so on page one.","这个判决有争议，报纸在头版就这么写了。"],["There is a correlation between the two sets of figures, but nobody knows why.","两组数字之间有关联，可没人知道为什么。"],["The credibility of the witness fell apart in ten minutes.","证人的可信度，十分钟就垮了。"],["The criminal had done the same thing in three counties.","这个犯人在三个郡干过同样的事。"],["A crisis in the housing office made the case wait a year.","房管处出了乱子，这案子就拖了一年。"],["The criticism came from people who had never read the report.","批评来自那些从没读过报告的人。"],["New rules aim to curb the number of empty flats.","新规定是想压住空置房的数量。"]]},{"t":"The Corner","s":[["The crash happened at the corner where two roads meet at an odd angle.","撞车就发生在两条路歪着交汇的那个拐角。"],["A man on a bike was hit by a car, and nobody was badly hurt.","一个骑车的人被车撞了，好在没人重伤。"],["The room behind the shop was damp all winter.","店后面那间屋子，一整个冬天都是潮的。"],["The paper came off the wall in long wet strips.","墙纸成条地往下掉，湿的。"],["The owner put a small heater in there and forgot about it.","老板放了个小暖炉进去，然后就把这事忘了。"],["By spring the smell had gone into the wood.","到了春天，那股味已经进了木头里。"]]},{"t":"The Election","s":[["The vote was democratic in name and confused in practice.","这场投票名义上是民主的，做起来一团乱。"],["A demographic study showed that half the town is over fifty.","一项人口统计显示，这镇上有一半人超过五十岁。"],["Two rooms were designated for counting, and one for tea.","两间房被指定用来数票，一间用来喝茶。"],["Police detained three people for an hour and then let them go.","警察留了三个人一个小时，然后放了。"],["The council refused to disclose how much the count had cost.","市政不肯公开清点花了多少钱。"],["The result was known by midnight and announced at nine the next morning.","结果半夜就清楚了，第二天早上九点才宣布。"],["Nobody complained, which was the surprise of the night.","没人抱怨，这才是那天晚上最意外的事。"]]},{"t":"The Print Shop","s":[["The deadline was Friday, and the machine broke on Thursday.","截止是周五，机器周四坏了。"],["The delay cost them the order and most of the profit.","这一耽搁，单子丢了，利也去了大半。"],["A dental appointment took the manager out for a whole morning.","经理去看牙，一上午不在。"],["The depression of that year was felt in every shop on the street.","那一年的萧条，这条街上每家店都感受到了。"],["A fire would devastate a place like this, with paper everywhere.","这种到处是纸的地方，一把火就全完了。"],["Two disparate groups of customers wanted the same thing at different prices.","两类完全不同的客人想要同一样东西，出的价却不一样。"],["The display in the window was changed every Monday.","橱窗里的陈列每个星期一换。"],["Roadworks disrupted the deliveries for six weeks.","修路把送货打断了六个星期。"],["The noise from the street distracted everyone at the counter.","街上的声音让柜台后的人都分了心。"],["Leaflets were distributed by hand to four hundred houses.","传单是一户一户手工发了四百家。"]]},{"t":"The Dictionary Man","s":[["The documentation for the machine is thicker than the machine is useful.","那台机器的说明书，比这台机器本身还厚。"],["He keeps an encyclopaedia from 1911 and reads it for pleasure.","他留着一本一九一一年的百科全书，当闲书读。"],["He will elaborate on any question for an hour, whether you ask or not.","任何一个问题他都能讲一个钟头，你问不问都一样。"],["The exact meaning of that word is elusive, even in the old books.","那个词的确切意思很难捉摸，连古书里也说不清。"],["His domain is a room above the shop, with paper up to the ceiling.","他的地盘是店楼上那间屋，纸一直堆到天花板。"],["English is the dominant language in his files, though not in his kitchen.","他的档案里英语占主导，厨房里就不是了。"],["He writes every note by hand and files it twice.","他每张笔记都手写，归档还要归两遍。"]]},{"t":"The Farm in the Drought","s":[["The drought lasted two years and changed what the farm grows.","旱了两年，这块地上种什么就变了。"],["They built a durable fence that will outlast the house.","他们修了一道耐久的篱笆，比房子还能熬。"],["The new roof is eco-friendly and costs twice as much.","新屋顶是环保的，价钱也翻了一倍。"],["The elderly couple next door still keep bees.","隔壁那对老夫妻还在养蜂。"],["They tried to eliminate the weeds by hand, which is impossible.","他们想用手把草除干净，这根本做不到。"],["The pump works erratically, mostly at night.","那台泵时好时坏，多半在夜里出毛病。"],["The farm sits near the equator, so the days are the same length all year.","农场靠近赤道，一年里白天长短都一样。"]]},{"t":"The Empty Shop","s":[["A young entrepreneur took the empty shop and filled it with machines.","一个年轻创业者把空店接了下来，塞满了机器。"],["The change on the street was dramatic: three new shops in a year.","这条街变得很戏剧化，一年冒出三家新店。"],["One brand became dominant, and the others closed quietly.","一个牌子占了上风，别的不声不响地关了。"],["The rent went up twice, and nobody argued.","房租涨了两次，谁也没争。"],["Two of the machines take cards and one takes coins only.","两台机器能刷卡，一台只收硬币。"],["By winter there was a queue at eight in the morning.","到了冬天，早上八点就有人排队。"]]},{"t":"The Old Estate","s":[["The business was established in 1904 by two brothers.","这门生意是一九〇四年两兄弟立起来的。"],["The estate passed to a cousin who had never worked there.","这份产业传到一个从没在里面干过活的表亲手里。"],["An ethical question came up about the land, and nobody wanted it.","这块地引出一个道德问题，谁都不愿意接。"],["Eventually the family sold the whole thing and moved away.","最后这家人把全部卖了，搬走了。"],["There is no evidence that the first owner ever visited.","没有证据表明第一任主人来过这里。"],["The trade evolved slowly, and the tools hardly changed at all.","这行慢慢在变，工具却几乎没动。"],["Everyone was exhausted by the end of the sale.","卖完的时候，所有人都累垮了。"]]},{"t":"The Experiment","s":[["The first experiment failed because nobody wrote the settings down.","第一次试验失败，是因为没人把参数记下来。"],["One result was exceptional, and it turned out to be a mistake.","有一个结果特别突出，后来发现是弄错了。"],["The instructions were explicit: no samples after six in the evening.","规定写得很明确：晚上六点以后不再收样本。"],["Every material is finite, and the budget even more so.","材料都是有限的，预算更是。"],["The freeze came in November and stopped work for a week.","十一月一场冰冻，停工一星期。"],["A fragment of glass in the sample ruined the reading.","样本里一小片碎玻璃，把读数毁了。"],["They started again in the spring with a new notebook and a new rule.","开春他们重新开始，换了新本子，也添了新规矩。"]]},{"t":"The Old Recipe","s":[["He learned to exploit every part of the animal, and nothing was thrown away.","他学会了把牲口身上每一块都用上，什么都不扔。"],["They extended the field behind the house by two rows.","他们把屋后的地往外扩了两行。"],["The extract of that root is bitter and works better than tea.","那种根熬出来的汁很苦，却比茶管用。"],["The famine of 1846 is still spoken of in this valley.","一八四六年的饥荒，这条山谷里现在还有人提。"],["His fitness at seventy surprised the young men who came to help.","他七十岁的身体，让来帮忙的年轻人都吃了一惊。"],["A dry summer is the friend of the harvest and the foe of the river.","干夏天对收成是好事，对河却是敌人。"],["The old format was a single folded sheet, and it worked.","老版式就是一张对折的纸，挺好用。"],["He fulfilled a promise to his father by planting the last row himself.","最后一垄他自己种完，算是兑现了对父亲的承诺。"]]},{"t":"The Report on the Lake","s":[["The lake is the habitat of two kinds of fish and very little else.","这个湖是两种鱼的栖息地，别的几乎什么都没有。"],["Their hypothesis was that the water had warmed by one degree.","他们的假设是水温升高了一度。"],["The impact of the new road on the birds has never been measured.","新路对鸟的影响，从来没人测过。"],["The work was carried out in accordance with the rules of the county.","这项工作按郡里的规定来做。"],["Two pages of the report were inaccurate, and everybody quoted them.","报告里有两页是错的，偏偏人人都在引用那两页。"],["A graphic shows the fall in the water level since 1990.","有一张图，画出一九九〇年以来水位的下降。"],["The rest of the report is careful and rather dull.","其余部分写得很仔细，也相当闷。"]]},{"t":"The Long Winter","s":[["That winter was harsh: four months without a single thaw.","那年冬天很严酷，四个月没化过一次冻。"],["The hardship fell on the families with no wood stored.","困苦都落在那些没存柴火的人家身上。"],["Boats stayed in the harbor from November to March.","船从十一月到三月一直停在港里。"],["People were inactive for weeks and then worked day and night.","人们闲了好几周，然后日夜连轴转。"],["It was inappropriate, everyone agreed, to hold a party that April.","大家都觉得，那年四月办聚会不合适。"],["The children indulged in nothing but snow and sleep.","孩子们除了雪和睡觉，什么也不贪。"],["By spring the town had almost forgotten how cold it had been.","到了春天，镇上人几乎忘了当初有多冷。"]]},{"t":"The Two Students","s":[["One gene decides the colour of the flower, and eleven decide its shape.","一个基因决定花的颜色，另外十一个决定它的形状。"],["The gifted student finished in an hour and then helped the others.","有天赋的那个一小时就做完了，然后去帮别人。"],["Her memory is impressive, though she says it is only habit.","她的记性让人印象深刻，她自己说那只是习惯。"],["Intelligence is easier to measure than to define.","智力这东西，量起来比定义起来容易。"],["Both of them come from the same small school on the hill.","两个人都是从山上那所小学校出来的。"],["Their teacher says the difference is reading, not talent.","他们的老师说，差的是读书，不是天分。"],["They meet on Sundays to argue about the questions.","星期天他们碰面，就为那些题目争。"]]},{"t":"The Flat Below","s":[["The building was infested with mice for two winters.","这栋楼有两年冬天闹老鼠。"],["The new windows are paid for in monthly installments.","新窗户是按月分期付的。"],["The heat in July was intense, and the fans did nothing.","七月热得厉害，风扇一点用没有。"],["There is very little interaction between the two floors.","两层楼之间几乎没什么来往。"],["Interference from the radio next door ruined every evening.","隔壁收音机的干扰，把每个晚上都搅了。"],["The interior was repainted in a colour that nobody had chosen.","屋里重新刷了一遍，颜色谁也没挑过。"],["By the third year people stopped complaining and started moving out.","到第三年，大家不抱怨了，开始往外搬。"]]},{"t":"The Quiet One","s":[["He is introverted without being shy, and people mistake the two.","他内向，但并不怕人，这两样常被弄混。"],["Nobody should interrupt him while he is drawing.","他画画的时候，谁都不该打断他。"],["He is keen on old maps and knows every hill by name.","他特别迷旧地图，每座山都叫得出名字。"],["They label him the quiet one, which he finds funny.","大家给他贴上“安静那个”的标签，他觉得好笑。"],["A lack of money ended the project long before a lack of ideas did.","项目停掉是因为没钱，远早于因为没想法。"],["The landscape here is flat for twenty miles and then drops away.","这里的风景平了二十英里，然后一下就掉下去。"],["He walks it in every season and says almost nothing about it.","他四季都在那里走，却几乎不提。"]]},{"t":"The Whale Watch","s":[["The marine biologist has followed the same group for nine years.","这位海洋生物学家跟踪同一群鲸已经九年。"],["A whale is a mammal that has no limbs and cannot live on land.","鲸是哺乳动物，没有四肢，也不能在陆上生活。"],["Each female has one mate and keeps him for a season.","每条雌鲸有一个配偶，只维持一个季节。"],["The likelihood of seeing one in May is high; in August it is low.","五月看到的机会大，八月就小了。"],["The boat leaves at six and is back by two.","船六点出发，两点前回来。"],["Nobody is allowed to swim anywhere near them.","谁都不许在它们附近下水。"],["Her notes fill four boxes in the office upstairs.","她的记录，把楼上办公室的四个箱子塞满了。"]]},{"t":"The Factory Report","s":[["The factory manufactures parts for pumps and nothing else.","这家厂只生产泵的零件，别的不做。"],["A malfunction in the second press stopped the line for a day.","第二台压机出了故障，生产线停了一天。"],["Every stop is entered in a log by the shift leader.","每次停机，都由班长记进日志。"],["The mechanism that feeds the metal is older than the building.","送料的机械结构，比这厂房还老。"],["The delays were mainly caused by deliveries, not by the machines.","延误主要是送货造成的，不是机器。"],["The report was two pages long, and nobody argued with it.","报告只有两页，谁都没意见。"],["By June the line was running again at full speed.","到六月，生产线又满速跑起来了。"]]},{"t":"The Language Study","s":[["The linguistic study took three years and two villages.","这项语言研究做了三年，跑了两个村子。"],["They managed to do the whole survey with only four people.","他们只靠四个人，把整个调查做完了。"],["The difference shows up in the verbs before it manifests anywhere else.","这种差别先出现在动词上，别处还看不出来。"],["A lopsided result, with one village far ahead, made them doubt the method.","结果一边倒，一个村子遥遥领先，他们开始怀疑方法。"],["In the second village they had no look-in at all, because nobody would talk.","在第二个村子他们一点机会都没有，没人愿意开口。"],["The book about it came out in 1997 and sold badly.","讲这件事的书一九九七年出版，卖得很差。"],["The tapes are still in a cupboard at the university.","那些录音带，现在还锁在大学的一个柜子里。"]]},{"t":"The Weather Station","s":[["The meteorological station on the hill sends a reading every hour.","山上那个气象站，每小时发一次数据。"],["The old thermometer used mercury; the new one uses nothing at all.","旧温度计用水银，新的什么都不用。"],["Moisture in the air is measured twice a day.","空气里的水分一天测两次。"],["They monitor the birds that migrate along the coast each autumn.","他们监测每年秋天沿海岸迁徙的鸟。"],["A nocturnal animal is rarely seen, which is rather the point.","夜行的动物很少被看见，这恰好就是关键。"],["One student watches the bats, which nobody else wants to do.","有一个学生专门看蝙蝠，这活没人愿意干。"],["The station has been run by two people since 1979.","这个站从一九七九年起就两个人管着。"]]},{"t":"The Village Artist","s":[["The same motif appears on every pot in the museum.","博物馆里每一只罐子上都有同一个图案。"],["He moulds the clay by hand, and no two pieces are alike.","他用手捏泥，没有两件是一样的。"],["The plant is native to this valley and grows nowhere else.","这种植物原产这条山谷，别处不长。"],["Working on Sunday became the norm after the war.","战后，星期天干活成了常态。"],["His notoriety came from one photograph, not from his pots.","他的名声来自一张照片，不是来自那些罐子。"],["The work is slow and, he says, good for his mental state.","这活做得很慢，他说对自己的精神有好处。"],["He sells three or four pieces a year, mostly to neighbours.","他一年卖三四件，多半卖给邻居。"]]},{"t":"The Letter from the Office","s":[["The official letter arrived on a Saturday, which is unusual.","那封正式来函星期六到，这不太寻常。"],["It set out one obligation: the report must be in by June.","信里写明一项义务：报告六月前必须交。"],["He had to obtain three signatures before the end of the week.","他得在周末之前拿到三个签名。"],["Their objective was simple and, as usual, not stated.","他们的目标很简单，也照旧没有明说。"],["The language of the letter was deliberately obscure.","这封信的措辞是故意写得含混的。"],["He read it twice and then called his brother.","他读了两遍，然后打给了他哥。"],["His brother said the same thing in four words.","他哥用四个字说了同一件事。"]]},{"t":"The Kitchen Smell","s":[["There was an odour in the kitchen that no amount of cleaning removed.","厨房里有股气味，怎么擦都去不掉。"],["It was odd, because the flat had been empty for a year.","这挺古怪，因为这套房子空了一整年。"],["The smell was not offensive, only strange.","那味道不冒犯人，只是怪。"],["An ordinary fan did nothing at all.","一台普通风扇一点用也没有。"],["The optimum place for the fan, it turned out, was the window.","后来发现，风扇最合适的位置是窗口。"],["The organ of smell is quick to notice and slow to forget.","嗅觉这个器官，发现得快，忘得慢。"],["A new cooker was out of the question that year.","那年换新灶是不可能的事。"],["They had to overcome the problem by leaving the window open all winter.","他们的办法是整个冬天开着窗。"],["By spring the old smell had gone, and paint began to overtake everything.","到春天旧味没了，油漆味又开始占上风。"]]},{"t":"The Old Hospital","s":[["A fall paralysed him from the waist down when he was forty.","他四十岁那年摔了一跤，从腰以下就瘫了。"],["As a patient he was difficult, and as a man he was kind.","当病人时他很难缠，做人却很好。"],["Physical work was over for him, and he knew it before the doctors said it.","体力活对他算是结束了，医生没说他就知道。"],["The first phase of the treatment lasted six weeks.","治疗的第一阶段持续了六个星期。"],["He reached his peak in the second month and then stopped improving.","他在第二个月到了顶点，之后就没再好转。"],["Getting him home was paramount, whatever it cost.","不管花多少，最重要的都是让他回家。"],["The stairs were changed into a slope, and he began to go out again.","楼梯改成了斜坡，他又开始出门了。"]]},{"t":"The Exam Rules","s":[["Only students who registered in March may participate.","只有三月登记过的学生才能参加。"],["A letter from the office gave him a permit to sit the exam late.","办公室给了他一封信，允许他晚考。"],["Nobody could persuade the examiner to change the date.","谁也没能说服考官改日期。"],["He was pessimistic about the essay and wrote it twice.","他对那篇文章很悲观，写了两遍。"],["Two students plagiarised the same page, and both were caught.","两个学生抄了同一页，都被抓了。"],["There was plenty of time and very little paper.","时间很充裕，纸却少得可怜。"],["The question asked students to plot the change on a graph.","题目让学生把变化画成图。"],["A hard question can pose a problem even for the best writer.","再会写的人，碰上难题也会卡住。"]]},{"t":"The Village Shop","s":[["A portable radio was the only entertainment in the back room.","后面那间屋里唯一的娱乐，是一台能拎着走的收音机。"],["Poverty here looks like a car that has not moved in years.","这儿的穷，看起来就是一辆几年没动过的车。"],["The shop won praise from a newspaper for staying open in the snow.","这家店下雪天照常开门，被报纸夸了一回。"],["Nobody could predict which week would be the busiest.","谁也说不准哪个星期最忙。"],["The most pressing problem was the roof above the flour.","最急的是面粉上面那块屋顶。"],["He kept a private list of who owed what, and never showed it to anyone.","他私下记着谁欠多少，从不给人看。"],["The shop closed in 2009, and the list was never found.","店二〇〇九年关了，那份账再没找到。"]]},{"t":"New Rules for the Market","s":[["New rules prohibit selling meat without a cover.","新规定禁止卖没有遮盖的肉。"],["An argument about the awning prolonged the meeting by an hour.","为一个遮阳棚争起来，会多开了一个钟头。"],["The council wants to promote the market to visitors from the city.","市政想把市场推介给城里来的游客。"],["Three stalls prospered and six closed within a year.","三个摊子做起来了，六个一年之内关了。"],["Water from the well is purified before it is sold.","井水净化之后才卖。"],["Only farmers within the county qualify for the lower fee.","只有本郡的农户才有资格交低费。"],["The change was radical for a market this old.","对一个这么老的市场，这变化算是彻底的。"],["The range of goods on offer has not changed since 1960.","摊位上的货色，从一九六〇年起就没变过。"]]},{"t":"The Play","s":[["The rehearsal on Thursday was the fourth, and the play opened on Friday.","星期四那次是第四遍排演，星期五就开演了。"],["The audience reacted well, though the back rows could not hear.","观众反应不错，只是后排听不清。"],["Two critics rejected the play, and one called it the best of the year.","两个评论家否了这个戏，一个说它是全年最好的。"],["Some of the jokes were not relevant to the story, and they went.","有些笑话跟剧情没关系，就删了。"],["The actor was reluctant to cut his own scene.","那个演员不太情愿删自己那场。"],["The person responsible for the lights fell asleep twice.","管灯的那个人睡了两次。"],["There were three revisions of the second act before opening night.","第二幕在首演前改了三稿。"],["Nobody could reproduce the sound of the door, so they used a real one.","那扇门的声音谁也没法复制，最后用了真的门。"]]},{"t":"The Church on the Hill","s":[["The building was religious for four hundred years and is a museum now.","这栋楼做了四百年宗教场所，现在是博物馆。"],["A society was formed to revive the old market in the square.","有人组了个会，想把广场上的老集市重新办起来。"],["The east wall is a ruin, and nobody can afford to fix it.","东墙已经塌成废墟，谁都出不起修的钱。"],["The road up is scenic and dangerous in exactly the same way.","上山的路很美，危险的方式也一模一样。"],["There is shade on one side of the path all afternoon.","小路一边整个下午都有荫。"],["The land is owned solely by the trust, which meets twice a year.","这块地只归那个理事会，他们一年开两次会。"],["A local solicitor did the paperwork for nothing.","本地的律师免费办了那些手续。"]]},{"t":"The Doubt","s":[["There was skepticism about the figures from the first day.","那些数字从第一天起就有人怀疑。"],["The neighbours grew suspicious when the van came at night.","夜里那辆货车一来，邻居就起了疑心。"],["The change was subtle: one word on the label.","变化很微妙，标签上只动了一个词。"],["A cough is a symptom, not a disease.","咳嗽是症状，不是病。"],["The tension in the room could be felt from the doorway.","站在门口就能感到屋里的紧张。"],["The term used in the report is not the one the patients use.","报告里用的术语，跟病人自己说的不是一回事。"],["The noise went on throughout the summer.","那噪音整个夏天都没停。"],["The toll on the family was never counted by anyone.","这家人为此付出的代价，没人算过。"]]},{"t":"The Boat Race","s":[["Costs soared in the second year, and the club nearly closed.","第二年开销猛涨，俱乐部差点散了。"],["One man steers and four men row, and nobody speaks.","一个人掌舵，四个人划，全程不说话。"],["A small prize was enough to stimulate eight entries.","一个小小的奖，就招来了八个报名。"],["They covered the last stretch in twenty long strides.","最后一段，他们二十步就跨过去了。"],["Two of the crew succumbed to the cold and were pulled out.","两个队员被冻得撑不住，被拉了上来。"],["The long field was subdivided into six narrow strips.","那块长地被分成了六条窄条。"],["The old wooden boats were superseded by glass ones in 1994.","一九九四年，玻璃船取代了旧木船。"],["They could not suppress their laughter when the boat sank.","船沉的时候，他们忍不住笑。"]]},{"t":"The Survey","s":[["There is a sufficiency of data and a shortage of people to read it.","数据是充足的，缺的是读数据的人。"],["Music can transcend language, which is why it travels so well.","音乐能超越语言，所以才走得那么远。"],["The goods are damaged in transit more often than in the shop.","货在路上坏的次数，比在店里多。"],["The difference in price between the two years was tremendous.","两年的价钱差得惊人。"],["One bad report triggered a second survey and a long argument.","一份糟糕的报告引发了第二次调查，还有一场长争论。"],["The tropical heat made the work slow and the paper damp.","热带的高温让人干得慢，纸也潮。"],["An unbiased reader would find the report dull and honest.","不带偏见的读者会觉得这报告又闷又老实。"],["The results were uniform across all four villages.","四个村子的结果全都一样。"]]},{"t":"The View from the Top","s":[["The most valuable part of the study is the interviews, not the numbers.","这项研究最有价值的是访谈，不是数字。"],["A versatile tool like this one has no single use.","像这样多用途的工具，没有一个固定用法。"],["From the top you get a view of the whole valley.","站在顶上，整个山谷都在眼里。"],["The storm was violent for two hours and then simply passed.","风暴猛烈了两个小时，然后就那么过去了。"],["The damage is visible from the road but not from the house.","从路上看得见这处损坏，从房子里看不见。"],["A visual check found three cracks that the machine had missed.","肉眼一看就找出三道裂缝，仪器没测出来。"],["Sleep is the cheapest way to improve your well-being.","改善身心状态最便宜的办法，就是睡觉。"],["There is no trace of the old path anywhere on the hill.","那座山上，老路的痕迹一点都找不到了。"]]},{"t":"The Mountain Road","s":[["The rate of accidents on this road has doubled since the quarry opened.","采石场开了以后，这条路的出事率翻了一倍。"],["The lake is used for recreation and nothing else.","这个湖只用来消遣，别的没有。"],["A reduction in the speed limit was refused twice.","限速调低的提议被否了两次。"],["The report refers to the quarry by name, which annoyed the owner.","报告点名提到了那个采石场，老板很不高兴。"],["A sticky substance on the surface makes the road worse in the rain.","路面上有种黏的东西，一下雨就更糟。"],["The quarry argues for supremacy over the road, and usually wins.","采石场争的是对这条路的支配权，而且多半能赢。"],["A sustainable plan would move the lorries onto the old railway line.","一个可持续的办法，是把卡车挪到旧铁路上去。"]]}],"4":[{"t":"The Trip","s":[["We had to reserve the room two months in advance.","房间得提前两个月预订。"],["The fee was small, and the transfer from the airport was included.","费用不多，机场接送也算在里面。"],["You have to show your passport for an international flight.","坐国际航班得出示护照。"],["The airline had to adjust the time twice in one week.","航空公司一个星期里改了两次时间。"],["A lorry took the boxes for export at four in the morning.","凌晨四点，一辆卡车把要出口的箱子拉走了。"],["Nobody minded, because the seats were wide and the coffee was free.","没人计较，座位宽，咖啡还免费。"],["At the desk a woman explained that the gate had changed.","柜台后的女人说，登机口换了。"]]},{"t":"The Island","s":[["The island is famous for the diversity of its birds.","这个岛以鸟的种类之多出名。"],["A weather station was established there in 1954 and never closed.","一九五四年在岛上建了个气象站，一直没关。"],["The habitat of one small fox is a strip of sand fifty metres wide.","一种小狐狸的栖息地，是五十米宽的一条沙地。"],["The vegetation changes within a hundred metres of the shore.","离岸一百米内，植被就变了个样。"],["No large animal has ever lived here.","大型动物从来没在这里待过。"],["The main feature of the place is the wind.","这地方最大的特点就是风。"],["Half the young people emigrate before they are twenty-five.","一半的年轻人在二十五岁之前就迁走了。"]]},{"t":"The Gallery","s":[["The gallery serves food on the top floor, and the queue is long at one.","美术馆顶楼有吃的，一点钟要排长队。"],["One guard is allergic to the flowers in the first room.","有个保安对第一间展厅里的花过敏。"],["A fitness class meets in the courtyard twice a week.","院子里每周有两次健身课。"],["The building has a tradition of free entry on Sundays.","这栋楼有个传统，星期天免费进。"],["There is not much entertainment in the evening, apart from a movie on Fridays.","晚上没什么娱乐，除了星期五放一场电影。"],["The press came once, and the publicity lasted a month.","媒体来过一次，宣传效果持续了一个月。"],["Tickets are cheaper online than at the door.","网上买票比门口便宜。"],["One picture was stolen in 1998 and came back in 2004.","有幅画一九九八年被偷，二〇〇四年又回来了。"],["The jewellery is kept in a room with two doors.","珠宝放在一个有两道门的房间里。"],["The artwork on the stairs is newer than the building itself.","楼梯上的那些作品，比这栋楼还新。"],["A statue in the garden has no head, and nobody knows why.","园子里有座雕像没有头，谁也不知道为什么。"]]},{"t":"The Coast","s":[["The geology of this coast is simple: soft rock and a hard sea.","这段海岸的地质很简单：软石头，硬海水。"],["The countryside here begins where the last house ends.","这里的乡村，从最后一栋房子那里开始。"],["The urban part is three streets and a station.","算城里的部分，就是三条街加一个车站。"],["The coastline has moved thirty metres in ninety years.","九十年里，海岸线退了三十米。"],["The environment is protected, which keeps the hotels out.","这一带环境受保护，所以酒店进不来。"],["It is noisy only in August, when the fair comes.","只有八月集市来的时候才吵。"],["The car park has the capacity for forty cars and takes sixty.","停车场标称能停四十辆，实际停了六十辆。"],["An outdoor pool was built in 1971 and closed in 1999.","露天泳池一九七一年建，一九九九年关了。"],["Accommodation is scarce, and most visitors stay in the next town.","住的地方很少，多数游客住到邻镇。"],["It is a good place for a quiet week.","想安静过一周，这地方不错。"],["The nearest shop is two miles away, and the nearest hospital is twenty.","最近的店在两英里外，最近的医院在二十英里外。"],["A remote farm above the bay has no road, only a path.","海湾上方有个偏远的农场，没路，只有一条小径。"]]},{"t":"The Course","s":[["The education department moved into the old library last year.","教育系去年搬进了老图书馆。"],["Each student gets two hours with a tutor every week.","每个学生每星期有两个小时跟导师。"],["The purpose of the first term is to teach them how to read a paper.","第一学期的目标，是教他们怎么读一篇论文。"],["There is a structure to the course, but nobody follows it exactly.","这门课有个结构，只是没人严格照着走。"],["The reference materials fill one shelf behind the desk.","参考资料把桌后那一格书架塞满了。"],["Her knowledge of the subject is extensive and slightly old-fashioned.","她在这门学问上知识很广，只是有点旧派。"],["The expertise in the room was mostly in the hands of one person.","屋里那点专长，基本都在一个人手上。"],["A small café near the entrance sells tea to students all day.","入口附近有家小咖啡馆，一整天都在卖茶给学生。"]]},{"t":"The Two Shops","s":[["The advantage of the corner shop is that it opens at six.","拐角那家店的好处是六点就开门。"],["The disadvantage is the price, which is a fifth higher than the supermarket.","缺点是价钱，比超市贵两成。"],["Ordinary people here buy bread daily and meat twice a week.","这儿的普通人天天买面包，肉一星期买两次。"],["A group of neighbours tried to buy the shop together in 2015.","二〇一五年，一群邻居想合伙把这家店买下来。"],["The owner refused, and then sold it to a chain two years later.","老板当时不肯，两年后卖给了连锁店。"],["The chain kept the name and changed everything else.","连锁店把名字留着，别的全换了。"]]},{"t":"The Project Meeting","s":[["People associate this company with cheap furniture, which annoys the manager.","大家把这家公司跟便宜家具联系在一起，经理很恼。"],["Their approach is to build one thing well and sell it for years.","他们的做法是把一样东西做好，然后卖很多年。"],["A bonus motivates the sales team and does nothing for the workshop.","奖金能激励销售，对车间一点用没有。"],["The new design improves the handle and nothing else.","新设计改了把手，别的都没动。"],["They overlooked one detail: the box does not fit in a car.","他们漏了一个细节：这箱子塞不进车里。"],["The report will omit the two years when the firm lost money.","报告打算省掉公司亏钱的那两年。"],["Nobody at the meeting mentioned the box until the very end.","会上一直没人提那只箱子，直到最后。"]]},{"t":"The Tutorial","s":[["He could not find the room, and the lecture had already started.","他没找到教室，课已经开了。"],["The opportunity came in the second term, and he took it.","机会在第二学期来了，他抓住了。"],["The first thing you learn is how to take notes in a lecture.","首先要学的，是听课时怎么记笔记。"],["The reading was difficult, and half the group stopped after ten pages.","材料很难，一半人看到第十页就停了。"],["Rain prevented anyone from going out at lunchtime.","下雨，午饭时谁都没出去。"],["It is easy to misunderstand the question and write about the wrong war.","看错题很容易，一写就写到一场不相干的战争上。"],["She tried hard to be fair in her comments.","她尽力让自己的评语公道。"],["The feedback was three lines long and extremely useful.","反馈只有三行，却非常有用。"]]},{"t":"The Experiment Report","s":[["The weather affected the second set of readings.","天气影响了第二组读数。"],["The analysis took longer than the experiment itself.","分析花的时间比实验还长。"],["The result was clear enough to publish and dull enough to forget.","结果清楚到可以发表，也平淡到转头就忘。"],["Nobody knew how to handle the machine after the engineer left.","工程师走了以后，没人知道怎么操作那台机器。"],["The department agreed to support the work for one more year.","系里同意再支持这项工作一年。"],["The old building is not an ideal place for this kind of work.","这栋老楼不适合做这类工作。"],["A new lab was promised, and the promise is still on the wall.","新实验室答应过，那张纸还贴在墙上。"]]},{"t":"The Rules of the Competition","s":[["The rules are rigorous about how the samples are stored.","规则对样本怎么存放要求很严格。"],["They restrict the number of people in the room to four.","他们限制屋里最多四个人。"],["Two entries were so similar that the judges asked for the notes.","有两份作品太像，评委要了笔记来看。"],["One particular photograph won, and nobody could say exactly why.","有一张照片得了奖，谁也说不清为什么。"],["A copy of the original must be sent with the entry.","交作品时得附一份原件复印。"],["The statistics were checked by a second person and then by a third.","统计数字先由第二个人核，再由第三个人核。"],["The prize was a book token and a letter of praise.","奖品是一张书券和一封表扬信。"]]},{"t":"The Hall","s":[["The maximum number of people in the hall is two hundred.","礼堂最多容两百人。"],["The minimum is four, or the evening is cancelled.","最少四个人，不然就取消。"],["The initial plan had a stage at the north end.","最初的方案是舞台放在北头。"],["Seating is limited, so tickets are sold by phone only.","座位有限，票只能电话订。"],["They had to shorten the programme by twenty minutes.","节目单只好砍掉二十分钟。"],["A decrease in the budget ended the free tea.","预算减了，免费茶也就没了。"],["The lack of a fire exit was noticed in 2016.","没有消防通道这件事，二〇一六年才被人发现。"],["The amount of money needed was never made public.","到底要多少钱，从来没有公开过。"],["The majority of the members voted for the smaller plan.","多数成员投了那个小一点的方案。"]]},{"t":"The Figures","s":[["The figures for last year are large enough to be interesting.","去年的数字够大，值得一看。"],["The number of visitors doubled between 2010 and 2019.","二〇一〇到二〇一九年，游客数翻了一倍。"],["More than half of them come in July and August.","其中一多半是七八月来的。"],["At present there are three staff and one telephone.","目前有三个人，一部电话。"],["The website is updated once a month, if anyone remembers.","网站一个月更新一次，前提是有人记得。"],["The car park fills by ten in the morning.","停车场上午十点就满了。"],["Nobody expects these numbers to stay the same.","谁都不指望这些数字一直不变。"]]},{"t":"The Old Bridge","s":[["The newest part of the bridge is forty years old.","这座桥最新的部分也有四十年了。"],["The old crossing will close soon, and nobody knows for how long.","老渡口很快就要关，关多久没人知道。"],["The signs are out of date and point to a road that no longer exists.","路牌过时了，指的那条路早就不在了。"],["An ancient track runs under the arches.","桥洞底下有一条古道。"],["A temporary path was laid across the field in March.","三月在田里铺了一条临时的小路。"],["The deadline for the repair is the end of September.","修好的截止时间是九月底。"],["A permanent solution would cost more than the bridge is worth.","要彻底解决，花的钱比这座桥本身还值钱。"]]},{"t":"The Fair","s":[["The fair comes more often than it used to, sometimes twice a year.","集市来得比以前勤，有时候一年两次。"],["The annual show in June is the one people dress up for.","六月那场年度展，大家才郑重打扮。"],["The market is held every month on the second Saturday.","集市每个月第二个星期六办。"],["Bread is baked every day, and cakes only on Fridays.","面包天天烤，蛋糕只在星期五。"],["A small band plays on the corner when the weather is kind.","天气好的时候，拐角有支小乐队。"],["By nine in the evening the square is empty again.","到晚上九点，广场又空了。"]]},{"t":"The Store Room","s":[["Everything in the store room must be classified by size.","库房里的东西都得按大小分类。"],["The entrance is at the back, behind the bins.","入口在后面，垃圾桶后头。"],["The boxes below the window are the oldest in the building.","窗户底下那些箱子，是楼里最老的。"],["A small desk sits beside the door, with nothing on it.","门边有张小桌子，上面什么都没有。"],["Only two trolleys are available, and both are broken.","能用的推车只有两辆，还都坏了。"],["The room has no light of its own.","这间屋自己没有灯。"],["A torch hangs by the door for that reason.","所以门边挂着一只手电。"]]},{"t":"The Warning","s":[["The talk was boring, and half the room left before the end.","那场讲座很无趣，一半人没听完就走了。"],["The trend in the figures is clear and slightly worrying.","数字的走向很清楚，也让人有点担心。"],["It is risky to cross the river in November.","十一月过河很危险。"],["Some of the plants along the path are poisonous.","路边有些植物有毒。"],["A warning sign went up after the second accident.","第二次出事以后，立了块警报牌。"],["Handle the old pipes with care, because they crack easily.","旧管子要小心搬，很容易裂。"],["The sign is small, and almost nobody reads it.","那块牌子很小，几乎没人看。"]]},{"t":"The Airport Desk","s":[["The form asks for specific dates, and nobody at the desk has them.","表上要填具体日期，柜台后没人知道。"],["A special request for a seat by the window was ignored.","有人特别要求靠窗的座位，没人理。"],["The announcement was not clear, and two people missed the flight.","广播说得不清楚，两个人误了飞机。"],["Air travel is cheaper now than it was in 1990.","现在坐飞机比一九九〇年便宜。"],["Public transport to the airport stops at ten in the evening.","去机场的公共交通晚上十点就停了。"],["You cannot rely on the bus in winter.","冬天指望不上那趟公交。"],["A man at the desk explained the whole thing twice, slowly.","柜台后一个男人把整件事慢慢讲了两遍。"]]},{"t":"The Old Base","s":[["Someone tried to steal the fuel at night, and failed.","有人夜里想偷燃料，没成。"],["The injury was small, but it ended his season.","伤不重，可他那季就这样结束了。"],["The site was military for forty years and is a museum now.","这地方做了四十年军事用地，现在是博物馆。"],["The tactics used in training have not changed since 1975.","训练里的那套策略，从一九七五年起没变过。"],["Space travel is still the most expensive way to leave the ground.","太空旅行仍是离开地面最贵的办法。"],["A freeze in October closed the road for a week.","十月一场冰冻，路封了一个星期。"],["The guards still wear the old uniform on Sundays.","星期天，守卫还穿着旧制服。"]]},{"t":"The Club","s":[["The organization has forty members and no office.","这个组织有四十个成员，没有办公室。"],["One woman organizes everything, from the keys to the tea.","所有事都由一个女人安排，从钥匙到茶叶。"],["They produce a small magazine twice a year.","他们一年出两期小杂志。"],["The money is administered by two people who have never met.","钱由两个人管，这两人从没见过面。"],["Members come from every occupation, and one of them is a pilot.","成员干什么的都有，其中一个是飞行员。"],["The club is open to all ages, though most members are over sixty.","俱乐部不分年龄，不过多数成员超过六十岁。"],["The youth group meets on Fridays and has its own key.","年轻人那组星期五活动，有自己的钥匙。"],["His old mate from the navy runs the bar.","他海军时的老伙伴管着吧台。"],["The staff are all volunteers, and there are six of them.","工作人员全是志愿者，一共六个。"],["A sale in June raised enough money for a new roof.","六月一次义卖，筹够了换屋顶的钱。"],["Everything is cheap, and the discount for students is fifty per cent.","东西都便宜，学生还能打五折。"]]},{"t":"The Hotel","s":[["The tower is round, which makes the rooms awkward.","这塔楼是圆的，房间都不好摆。"],["In order to fill them, the owner cut the prices.","为了把房住满，老板把价降了。"],["They plan to renovate the top two floors next year.","他们打算明年翻修上面两层。"],["The manager runs the place alone in winter.","冬天，经理一个人撑着这家店。"],["Her hospitality is famous, and so is her soup.","她待客的热情出了名，她的汤也是。"],["The old market hall has a shape like nothing else in the town.","老市场那个厅，形状在镇上找不出第二个。"],["The closing of the pool depressed everyone in the village.","泳池一关，全村人都沮丧。"],["The hotel is well-known for its breakfast rather than its beds.","这家店出名的是早饭，不是床。"],["Two of the staff specialize in walking tours of the old town.","有两个员工专做老城的步行导览。"],["The kitchen is the busiest part of the building.","整栋楼里最忙的是厨房。"]]},{"t":"Two Villages","s":[["A typical house here has two rooms and a stove.","这儿的典型住房就是两间屋加一个炉子。"],["It is uncommon to see a car in the old quarter.","在老城区看见一辆汽车是少见的事。"],["The map was drawn accurately for the first time in 1902.","这张图一九〇二年第一次画得准确。"],["Two families have lived in the same house since then.","从那以后，有两户人家一直住同一栋房子。"],["The well in the square still works in dry summers.","广场上那口井，干旱的夏天还能用。"],["Visitors come for the quiet and leave before dark.","游客为了清静而来，天黑前就走了。"]]},{"t":"The Power Station","s":[["The power station burned coal for sixty years and closed in 1981.","这座电站烧了六十年煤，一九八一年关了。"],["The fuel arrived by rail, twelve wagons a day.","燃料走铁路来，一天十二节车皮。"],["They wanted to expand in 1955 and could not buy the land.","一九五五年他们想扩建，地买不下来。"],["Smoke could be seen from the hill, and the path to climb it is still there.","从山上能看见烟，爬上去的那条小路还在。"],["A plan to enhance the river bank was never paid for.","改善河岸的计划，一直没人出钱。"],["The building was refurbished in 2004 and is now flats.","这栋楼二〇〇四年重新装修，现在住人。"],["A disused tunnel runs under the car park.","停车场底下有一条废弃的隧道。"]]},{"t":"The Machine","s":[["The computer in the office is older than the person who uses it.","办公室那台电脑，比用它的人还老。"],["A handy list of numbers hangs beside the phone.","电话旁边挂着一张方便查的号码表。"],["He will demonstrate the machine to anyone who asks.","谁问，他都愿意演示那台机器怎么用。"],["The most important thing is to turn it off at night.","最重要的，是夜里把它关掉。"],["The instructions are straightforward: press once and wait.","操作很简单：按一下，然后等。"],["Her preference is for paper, and she keeps a notebook.","她更偏爱纸，随身带一个本子。"],["You can trust the figures, because two people check them.","这些数字可以信，因为有两个人核过。"]]},{"t":"The Workshop","s":[["Someone donated an old lathe, and it still turns.","有人捐了一台旧车床，还能转。"],["His work is the best in the room and sells for very little.","他的作品是屋里最好的，卖的价钱却很低。"],["The information on the wall is out of date and nobody has changed it.","墙上那些信息都过时了，也没人换。"],["He asks students to visualize the finished piece before they cut.","他让学生动手之前先在心里看见成品。"],["Repetition is how the hand learns what the eye has seen.","手要学会眼睛看见的东西，靠的就是重复。"],["The light is poor, so nobody works after four.","光线不好，四点以后就没人干活。"],["A durable finish takes three coats and a day of waiting.","要做得耐久，得刷三遍，再等一天。"],["The dust is a pollutant, and the masks have gone missing.","那些粉尘是污染物，口罩却找不着了 function forms(w){
 var sp=w.indexOf(' ');
 if(sp>-1){
  var head=w.slice(0,sp), rest=w.slice(sp), out=[w], bs=forms(head), i;
  for(i=0;i<bs.length;i++) out.push(bs[i]+rest);
  if(head==='be') out.push('is'+rest,'are'+rest,'was'+rest,'were'+rest,'been'+rest,'being'+rest);
  return out;
 }
 var f=[w,w+'s',w+'es',w+"'s",w+'ed',w+'ing',w+'ly'];
 if(/e$/.test(w)) f.push(w+'d', w.slice(0,-1)+'ing');
 if(/y$/.test(w)) f.push(w.slice(0,-1)+'ies', w.slice(0,-1)+'ied');
 if(/or$/.test(w)) f.push(w.slice(0,-2)+'our');
 if(/ize$/.test(w)) f.push(w.slice(0,-3)+'ise');
 if(/yze$/.test(w)) f.push(w.slice(0,-3)+'yse');
 return f;
}
function esc(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') }

 if(RE[ch]) return RE[ch];
 var list=CHS[ch]||[], fm=[], map={};
 for(var i=0;i<list.length;i++){
  var w=list[i][0], ws=forms(w);
  for(var j=0;j<ws.length;j++){
   var k=ws[j].toLowerCase();
   if(!map[k]){ map[k]={b:w, s:list[i][2]||''}; fm.push(ws[j]) }
  }
 }
 fm.sort(function(a,b){ return b.length-a.length });
 RE[ch]={re:new RegExp('(?<![A-Za-z])('+fm.map(esc).join('|')+')(?![A-Za-z])','gi'), map:map};
 return RE[ch];
}

var RAD={'\u2ecb':'车','\u2ed3':'长','\u2edb':'风','\u2edd':'食','\u2ee2':'马','\u2ec4':'西',
 '\u2ec5':'见','\u2ec6':'角','\u2ea0':'民','\u2ee3':'骨','\u2ed8':'青','\u2edc':'飞','\u2ee9':'黄',
 '\u2ed4':'门','\u2ee8':'麦','\u2ee5':'鱼','\u2ef0':'龙','\u2ee6':'鸟','\u2eec':'齐','\u2ec1':'虎',
 '\u2ee4':'鬼','\u2eee':'齿','\u2eda':'页','\u2ec9':'贝'};
function normCJK(s){ return s.replace(/[\u2E80-\u2FDF]/g, function(c){ return RAD[c]||c }) }
function glossFrags(mean){
 if(!mean) return [];
 var t=normCJK(String(mean)).replace(/[（(][^）)]*[）)]/g,' ').replace(/(v|n|adj|adv|prep|conj|int|num|pron|vt|vi|phrase|aux|art|abbr)\./g,' ');
 var out=[], segs=t.split(/[；;，,、\/|]/);
 for(var i=0;i<segs.length;i++){
  var x=segs[i].replace(/[\s.…]/g,'').replace(/某人|某物|某事/g,'');
  if(x.length>=2 && /[\u4e00-\u9fff]/.test(x)) out.push(x);
 }

}

function gl(ch){
 if(GLM[ch]) return GLM[ch];
 var m={}, L=CHS[ch]||[];

function zhMark(zh, hits, G){
 if(!zh||!hits||!hits.length) return zh;
 var spans=[], i, j, k;
 for(i=0;i<hits.length;i++){
  var fr=G[hits[i]]||[], best=null;
  for(j=0;j<fr.length;j++){
   var f=fr[j], cands=[f];
   if(f.length>2){ cands.push(f.slice(0,2)); cands.push(f.slice(-2)); }
   for(k=0;k<cands.length;k++){
    var c=cands[k];
    if(c.length<2) continue;
    var p=zh.indexOf(c);
    if(p>=0 && (!best || c.length>best.sc)) best={s:p,e:p+c.length,sc:c.length};
   }
  }
  if(best) spans.push(best);
  else if(fr.length && !/[的地性化度者]$/.test(fr[0])){
   var ch0=fr[0].charAt(0);
   if(ch0 && '而就都也又还在是有把被让使对给从向跟和与或的地得着了过们'.indexOf(ch0)<0
      && zh.split(ch0).length===2){ spans.push({s:zh.indexOf(ch0),e:zh.indexOf(ch0)+1,sc:1}); }
  }
 }
 if(!spans.length) return zh;
 spans.sort(function(x,y){ return y.sc-x.sc || x.s-y.s });
 var keep=[];
 for(i=0;i<spans.length;i++){
  var sp=spans[i], ok=1;
  for(j=0;j<keep.length;j++){ if(sp.s<keep[j].e && keep[j].s<sp.e){ ok=0; break; } }
  if(ok) keep.push(sp);
 }
 keep.sort(function(x,y){ return x.s-y.s });
 var out='', last=0;
 for(i=0;i<keep.length;i++){
  out+=zh.slice(last,keep[i].s)+'<b class="zw">'+zh.slice(keep[i].s,keep[i].e)+'</b>';
  last=keep[i].e;
 }
 return out+zh.slice(last);
}

function stop(){ if(RT.on&&canSpeak()) speechSynthesis.cancel();
 RT.on=false; var c=document.querySelectorAll('.sn.cur'); for(var i=0;i<c.length;i++) c[i].classList.remove('cur');
 if(RT.b) RT.b.classList.remove('on'); RT.b=null;
 var b=document.querySelector('.acts button[data-a="read"]'); if(b&&!RT.on) b.textContent='朗读' }
function step(){
 if(!RT.on) return;
 var c=document.querySelectorAll('.sn.cur'); for(var i=0;i<c.length;i++) c[i].classList.remove('cur');
 if(RT.n>=RT.q.length){ stop(); return }
 var node=RT.q[RT.n]; node.classList.add('cur');
 var y=node.getBoundingClientRect().top;
 if(y<70||y>innerHeight-100) node.scrollIntoView({block:'center',behavior:'smooth'});
 var u=new SpeechSynthesisUtterance(node.querySelector('.en').textContent);
 u.lang='en-GB'; u.rate=parseFloat(get(RATE,'0.95'))||0.95;
 u.onend=function(){ RT.n++; step() };
 u.onerror=function(){ RT.n++; step() };
 speechSynthesis.speak(u);
}

document.addEventListener('click', function(e){
 var t=e.target;
 var qo=t.closest('.qo button'); if(qo){ qAnswer(qo); return }
 if(t.closest('.qnext')){ qNext(); return }
 if(t.closest('.qagain')){ qStart(QZ.p); return }
 if(t.closest('.qclose')){ qClose(); return }
 var qb=t.closest('.qbb'); if(qb){ qStart(+qb.getAttribute('data-i')); return }
 var cb=t.closest('.cb'); if(cb){ go(parseInt(cb.getAttribute('data-ch'),10)); return }
 var b=t.closest('.acts button'); if(b){ act(b.getAttribute('data-a'), b); return }
 var sb=t.closest('.say');
 if(sb){ if(!canSpeak()){ toast('这个浏览器不支持朗读'); return }
  speechSynthesis.cancel();
  var n=+sb.getAttribute('data-say'), nodes=document.querySelectorAll('.pass[data-i="'+n+'"] .sn'), q=[];
  for(var i=0;i<nodes.length;i++) q.push(nodes[i]);
  RT.q=q; RT.n=0; RT.on=true; RT.b=sb; sb.classList.add('on'); step(); return }
 var pb=t.closest('#pop button');
 if(pb){ var w=pop.getAttribute('data-cur');
  if(pb.getAttribute('data-p')==='say') sayOne(w); else { addBook(w); pb.textContent='★ 已收'; pb.classList.add('on') } return }
 var wc=t.closest('.wlist span'); if(wc){ showPop(wc, wc.getAttribute('data-ww')); return }
 if(document.body.classList.contains('blind')){
  var bl=document.body.classList.contains('sent')? t.closest('.sn') : t.closest('.ps');
  if(bl){ bl.classList.toggle('rev'); return }
 }
 var m=t.closest('mark.pv');
 if(m){ if(document.body.classList.contains('blurred')&&!m.classList.contains('on')){ m.classList.add('on'); return }
  showPop(m); return }
 if(pop.classList.contains('on')&&!t.closest('#pop')) closePop();
});
function sayOne(w){ if(!canSpeak()) return; speechSynthesis.cancel();
 var u=new SpeechSynthesisUtterance(w); u.lang='en-GB'; u.rate=0.85; speechSynthesis.speak(u) }
function act(a,b){
 if(a==='blur'){ document.body.classList.toggle('blurred'); b.classList.toggle('on');
  toast(document.body.classList.contains('blurred')?'遮挡模式：先猜词，点一下看答案':'已显示所有词') }
 else if(a==='mode'){ var cm=document.body.classList.contains('sent')?'s':'p'; setMode(cm==='p'?'s':'p',1) }
 else if(a==='zh'){ document.body.classList.toggle('nozh'); b.classList.toggle('on',!document.body.classList.contains('nozh')) }
 else if(a==='blind'){ document.body.classList.toggle('blind'); b.classList.toggle('on');
  toast(document.body.classList.contains('blind')?'盲读模式：只看中文，点英文句子显形':'已恢复') }
 else if(a==='read'){
  if(RT.on){ stop(); return }
  if(!canSpeak()){ toast('这个浏览器不支持朗读'); return }
  speechSynthesis.cancel();
  var nodes=document.querySelectorAll('.pass .sn'), q=[];
  for(var i=0;i<nodes.length;i++) q.push(nodes[i]);
  RT.q=q; RT.n=0; RT.on=true; RT.b=b; b.classList.add('on'); b.textContent='停止'; step() }
 else if(a==='th'){ var t2=get(TH,''); set(TH,t2===''?'dark':(t2==='dark'?'light':'')); applyTH();
  b.textContent=get(TH,'')==='dark'?'深':(get(TH,'')==='light'?'浅':'自'); b.classList.toggle('on',!!get(TH,'')) }
}
document.addEventListener('keydown', function(e){
 if(e.target.tagName==='INPUT') return;
 if(QZ.p>=0&&!QZ.done){
  if(e.key>='1'&&e.key<='4'){
   var ob=document.querySelector('.pass[data-i="'+QZ.p+'"] .qo button[data-o="'+(+e.key-1)+'"]');
   if(ob){ e.preventDefault(); qAnswer(ob); return }
  }
  if(e.key==='Enter'){
   var nb=document.querySelector('.pass[data-i="'+QZ.p+'"] .qnext');
   if(nb){ e.preventDefault(); qNext(); return }
  }
 }
 if(e.key==='ArrowRight'&&ch<4) go(ch+1);
 else if(e.key==='ArrowLeft'&&ch>1) go(ch-1);
 else if(e.key==='Escape'){ closePop(); stop() }
});
window.addEventListener('resize', function(){ closePop() });
window.addEventListener('scroll', function(){ if(pop.classList.contains('on')) closePop() }, {passive:true});
document.addEventListener('visibilitychange', function(){ if(document.hidden) stop() });

var ICON='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3.2 6.2v3.6h1.9L8 12.2V3.8L5.1 6.2H3.2z"/><path d="M10.4 6.3a2.5 2.5 0 0 1 0 3.4"/><path d="M12.1 4.7a4.8 4.8 0 0 1 0 6.6"/></svg>';
/* ================= 本篇小测 ================= */
var QK='kd-quiz';
var QZ={p:-1, qs:[], n:0, ok:0, bad:[], done:false};

function qrec(){ return J(QK,{}) }
function usable(w){ var m=TT.m[w]||''; return !!m && !/的衍生词$/.test(m) }
function posOf(m){ var x=(m||'').match(/^([a-z]+)\./); return x?x[1]:'' }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=a[i]; a[i]=a[j]; a[j]=t } return a }
function hesc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){
 return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c] }) }

function qPool(word, mean){
 var list=CHS[ch]||[], same=[], all=[], i, e;
 for(i=0;i<list.length;i++){
  e=list[i];
  if(e[0]===word||!usable(e[0])) continue;
  all.push(e[0]);
  if(posOf(e[1])===posOf(mean)) same.push(e[0]);
 }
 return same.length>=3? same : all;
}

function findSent(p, w){
 var fs=forms(w).map(function(x){ return x.toLowerCase() }), k, j;
 for(k=0;k<p.s.length;k++){
  var t=p.s[k][0], m=t.match(/[A-Za-z][A-Za-z'’-]*/g)||[];
  for(j=0;j<m.length;j++){
   if(fs.indexOf(m[j].toLowerCase())>-1) return {t:t, zh:p.s[k][1], form:m[j]};
  }
 }
 return null;
}

function inText(w, text){
 var fs=forms(w), i;
 for(i=0;i<fs.length;i++){
  if(new RegExp('(?<![A-Za-z])'+esc(fs[i])+'(?![A-Za-z])','i').test(text)) return true;
 }
 return false;
}
function optsFor(word, mean, type, ban){
 var pool=shuffle(qPool(word, mean)), out=[], seen={}, i, txt, pass;
 var right=(type==='e2z')? mean : word;
 out.push(right); seen[right]=1;
 for(pass=0;pass<2&&out.length<4;pass++){
  for(i=0;i<pool.length&&out.length<4;i++){
   if(pass===0 && ban && type!=='e2z' && inText(pool[i], ban)) continue;
   txt=(type==='e2z')? (TT.m[pool[i]]||'') : pool[i];
   if(!txt||seen[txt]) continue;
   seen[txt]=1; out.push(txt);
  }
 }
 return shuffle(out);
}

function qStart(i){
 var pass=document.querySelector('.pass[data-i="'+i+'"]');
 if(!pass) return;
 qClose();
 var ps=TXT[ch][i]; if(!ps) return;
 var ws=(pass.getAttribute('data-ws')||'').split('|').filter(function(w){ return w&&usable(w) });
 if(!ws.length){ toast('这一篇没有可以测的词'); return }
 shuffle(ws);
 var cnt = ws.length<=3? ws.length : (ws.length>=10?5:4);
 ws=ws.slice(0, cnt);
 var pat=['c','e2z','z2e','c','z2e'], qs=[];
 for(var k=0;k<ws.length;k++){
  var w=ws[k], mean=TT.m[w]||'';
  var s=(w.indexOf(' ')>=0)? null : findSent(ps, w);
  var type=pat[k]||'e2z';
  if(type==='c'&&!s) type='e2z';
  var q={w:w, m:mean, type:type, sent:s, picked:-1};
  if(type==='c'){
   q.zh=s.zh; q.form=s.form;
   q.blank=hesc(s.t).replace(new RegExp('(?<![A-Za-z])'+esc(s.form)+'(?![A-Za-z])'),
     '\u0001').replace('\u0001','<span class="blank"></span>');
   if(q.blank.indexOf('class="blank"')<0) type='e2z';
   q.fill=hesc(s.t).replace(new RegExp('(?<![A-Za-z])('+esc(s.form)+')(?![A-Za-z])'), '<b>$1</b>');
  }
  q.type=type;
  q.ans=(type==='e2z')? mean : w;
  q.opts=optsFor(w, mean, type, type==='c'? s.t : null);
  if(q.opts.indexOf(q.ans)<0) q.opts[0]=q.ans;
  qs.push(q);
 }
 QZ={p:i, qs:qs, n:0, ok:0, bad:[], done:false};
 var box=document.createElement('div'); box.className='qzbox';
 pass.appendChild(box);
 qRender();
}

function qRender(){
 if(QZ.p<0) return;
 var box=document.querySelector('.pass[data-i="'+QZ.p+'"] .qzbox');
 if(!box) return;
 var total=QZ.qs.length, head;
 if(QZ.done){
  var tip = QZ.bad.length? ('不太熟的 <b>'+QZ.bad.length+'</b> 个词已经收进生词本，复习时会再见到')
                        : '全对，这一篇的词基本认住了';
  box.innerHTML='<div class="qh"><span class="qn2">完成</span><span>本篇小测</span>'+
   '<button class="qclose">收起</button></div>'+
   '<div class="qdone">答对 <b>'+QZ.ok+'</b> / '+total+' · '+tip+'</div>'+
   (QZ.bad.length? '<div class="qbad">'+QZ.bad.map(function(w){
     return '<span data-ww="'+w+'">'+w+'</span>' }).join('')+'</div>' : '')+
   '<div class="qf"><button class="prim qagain">再测一遍</button><button class="qclose">收起</button></div>';
  return;
 }
 var q=QZ.qs[QZ.n];
 var tags={c:'看句子填词', e2z:'选中文释义', z2e:'选英文单词'};
 head='<div class="qh"><span class="qn2">'+(QZ.n+1)+'/'+total+'</span><span>'+tags[q.type]+'</span>'+
  '<button class="qclose">收起</button></div>';
 var body;
 if(q.type==='c'){
  body='<div class="qq">'+q.blank+
   (document.body.classList.contains('nozh')?'':'<span class="qzh">'+hesc(q.zh)+'</span>')+'</div>';
 } else if(q.type==='e2z'){
  body='<div class="qq"><b class="qw">'+hesc(q.w)+'</b></div>';
 } else {
  body='<div class="qq"><b class="qw">'+hesc(q.m)+'</b></div>';
 }
 var opts='<div class="qo">'+q.opts.map(function(x,k){
  return '<button data-o="'+k+'"><span class="oi">'+'ABCD'.charAt(k)+'</span>'+hesc(x)+'</button>' }).join('')+'</div>';
 box.innerHTML=head+body+opts+'<div class="qf"></div>';
}

function qAnswer(btn){
 if(QZ.p<0||QZ.done) return;
 var q=QZ.qs[QZ.n]; if(!q||q.picked>=0) return;
 var k=+btn.getAttribute('data-o');
 var ok=(q.opts[k]===q.ans);
 q.picked=k;
 if(ok) QZ.ok++; else { QZ.bad.push(q.w); addBook(q.w) }
 var box=document.querySelector('.pass[data-i="'+QZ.p+'"] .qzbox'); if(!box) return;
 var bs=box.querySelectorAll('.qo button');
 for(var i=0;i<bs.length;i++){
  if(q.opts[i]===q.ans) bs[i].classList.add('ok');
  else if(i===k) bs[i].classList.add('no');
  else bs[i].classList.add('dim');
 }
 var sy=(TT.s&&TT.s[q.w])||'';
 var fb=(ok?'<span class="qy">✓ 对了</span>':'<span class="qn">✗ 错了</span>');
 if(q.type==='c'){
  fb+=' · <b>'+hesc(q.w)+'</b> · '+hesc(q.m);
  if(q.sent.form.toLowerCase()!==q.w.toLowerCase())
   fb+='<i>（原句用的是 '+hesc(q.sent.form)+'）</i>';
  if(!ok) fb+='<span class="qzh">'+(q.fill||hesc(q.sent.t))+'<br>'+hesc(q.sent.zh)+'</span>';
 } else {
  fb+=' · <b>'+hesc(q.w)+'</b> · '+hesc(q.m);
 }

 if(sy) fb+='<span class="qzh">同义替换：'+hesc(sy)+'</span>';
 fb+='<button class="prim qnext">'+(QZ.n+1<QZ.qs.length?'下一题':'看结果')+'</button>';
 box.querySelector('.qf').innerHTML=fb;
}

function qNext(){
 if(QZ.p<0||QZ.done) return;
 QZ.n++;
 if(QZ.n>=QZ.qs.length){
  QZ.done=true;
  qsave(QZ.p, QZ.ok, QZ.qs.length);
  qRender(); qstat();
  if(QZ.bad.length) toast('答错 '+QZ.bad.length+' 个，已收进生词本');
  return;
 }
 qRender();
}

function qsave(i,r,n){
 var o=qrec(); if(!o[ch]) o[ch]={};
 o[ch][i]={r:r, n:n, t:Date.now()};
 set(QK, JSON.stringify(o));
}

function qstat(){
 var o=(qrec()[ch])||{}, k=0, r=0, n=0, i;
 for(i in o){
  if(!o[i]) continue;
  k++; r+=o[i].r||0; n+=o[i].n||0;
  var e=document.querySelector('.qsc[data-q="'+i+'"]');
  if(e) e.innerHTML='<b>'+o[i].r+'/'+o[i].n+'</b> 正确';
  var b=document.querySelector('.qbb[data-i="'+i+'"]');
  if(b) b.textContent='再测';
 }
 var sum=document.getElementById('qsum');
 if(sum) sum.innerHTML = k? ('已测 <b>'+k+'</b>/'+(TXT[ch]||[]).length+' 篇 · 平均 '+
   Math.round(r*100/Math.max(1,n))+'%') : '';
}

function qClose(){
 var b=document.querySelector('.qzbox');
 if(b&&b.parentNode) b.parentNode.removeChild(b);
 QZ={p:-1, qs:[], n:0, ok:0, bad:[], done:false};
}
document.getElementById('zhbtn').classList.add('on');
chips();
document.getElementById('cttl').innerHTML=TT[ch]+' <em>'+TT.sub[ch]+'</em>';
render();
</script>
