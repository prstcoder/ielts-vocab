*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 -apple-system,BlinkMacSystemFont,

.wrap{max-width:900px;margin:0 auto;padding:0 18px}

h1{margin:0;font-size:24px;font-weight:700}
.sub{color:var(--ink2);font-size:13px;margin-top:6px}
.back{display:inline-block;font-size:13px;color:var(--ink2);text-decoration:none;border:1px solid var(--line);
 border-radius:999px;padding:3px 12px;margin-bottom:14px;background:var(--panel)}
.back:hover{color:var(--accent);border-color:var(--accent)}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
textarea{width:100%;min-height:170px;resize:vertical;font:inherit;font-size:14.5px;line-height:1.75;
 color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 13px;outline:none}
textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--acc-soft)}
.acts{display:flex;gap:9px;margin-top:11px;flex-wrap:wrap;align-items:center}
.acts button{font:inherit;font-size:13.5px;font-weight:650;border-radius:9px;cursor:pointer;
 border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 15px}
.acts button:hover{border-color:var(--accent);color:var(--accent)}
.acts .pri{background:var(--accent);border-color:var(--accent);color:#fff}
.acts .pri:hover{color:#fff;filter:brightness(1.06)}
.acts .tip{font-size:12px;color:var(--ink2);margin-left:auto}
.res{margin-top:16px;display:none}
.res.on{display:block}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{font-size:12.5px;border-radius:999px;padding:3px 11px;background:var(--chip);color:var(--ink2)}
.chip b{color:var(--accent);font-variant-numeric:tabular-nums}
.pass{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;
 font-size:15.5px;line-height:2.05;white-space:pre-wrap;word-break:break-word}
mark.lk{background:var(--mark);color:inherit;border-radius:4px;padding:0 2px;cursor:pointer;
 box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--accent) 55%,transparent)}
mark.lk:hover{background:color-mix(in srgb,var(--accent) 18%,var(--mark))}
mark.lk.on{background:var(--accent);color:#fff}
mark.lk.syn{background:transparent;box-shadow:none;border-bottom:2px dotted var(--accent);border-radius:0}
body.onlyd mark.lk.syn{background:transparent;box-shadow:none;border-bottom:0;cursor:auto}
body.onlyd .hit.syn{display:none}
.tgx{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);cursor:pointer;user-select:none}
.tgx input{accent-color:var(--accent);width:14px;height:14px;cursor:pointer;margin:0}
.list{margin-top:14px}
.grp{margin-top:14px}
.gh{display:flex;align-items:baseline;gap:9px;font-size:13px;color:var(--ink2);margin-bottom:7px}
.gh b{font-size:13.5px;color:var(--ink)}
.gh a{color:var(--accent);text-decoration:none;font-size:12.5px}
.hit{display:flex;align-items:baseline;gap:9px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.hit:last-child{border-bottom:0}
.hit .w{font-weight:650;font-family:ui-serif,Georgia,serif;min-width:130px}
.hit .m{color:var(--ink2);font-size:13px;flex:1}
.hit .st{font-size:11px;border-radius:99px;padding:1px 8px;background:var(--chip);color:var(--ink2);flex:none}
.hit .st.good{background:color-mix(in srgb,var(--green) 16%,var(--panel));color:var(--green)}
.hit .st.new{background:color-mix(in srgb,var(--accent) 14%,var(--panel));color:var(--accent)}
.empty{padding:26px;text-align:center;color:var(--ink2);font-size:13.5px}
@media (max-width:620px){.wrap{padding:0 12px}h1{font-size:20px}.pass{font-size:15px;line-height:1.95}
 .hit .w{min-width:0}.acts .tip{display:none}}

var REC='kd-rec', BOOK='kd-book';

var PH={};
for(var sk in SYN){ if(sk.indexOf(' ')>-1){ var a=sk.split(/\s+/); (PH[a[0]]=PH[a[0]]||[]).push(a) } }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
 return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c] }) }
function lemma(t){
 var a=[];
 if(/ies$/.test(t)) a.push(t.slice(0,-3)+'y');
 if(/ves$/.test(t)) a.push(t.slice(0,-3)+'f',t.slice(0,-3)+'fe');
 if(/(ses|xes|zes|ches|shes)$/.test(t)) a.push(t.slice(0,-2));
 if(/s$/.test(t)&&!/ss$/.test(t)) a.push(t.slice(0,-1));
 if(/ied$/.test(t)) a.push(t.slice(0,-3)+'y');
 if(/ed$/.test(t)){ a.push(t.slice(0,-2),t.slice(0,-1)); if(/(.)\1ed$/.test(t)) a.push(t.slice(0,-3)) }
 if(/ing$/.test(t)){ a.push(t.slice(0,-3),t.slice(0,-3)+'e'); if(/(.)\1ing$/.test(t)) a.push(t.slice(0,-4)) }
 if(/ly$/.test(t)) a.push(t.slice(0,-2));
 if(/er$/.test(t)) a.push(t.slice(0,-2),t.slice(0,-1));
 if(/est$/.test(t)) a.push(t.slice(0,-3),t.slice(0,-2));
 if(/ally$/.test(t)) a.push(t.slice(0,-4));
 return a;
}
function viak(key,t){
 var a=SYN[key];
 if(!a||!a.length) return null;
 for(var i=0;i<a.length;i++) if(LEX[a[i]]) return {w:a[i],e:LEX[a[i]],s:t,kind:'s'};
 return null;
}
function find(t){
 if(LEX[t]) return {w:t,e:LEX[t],kind:'d'};
 var v=viak(t,t); if(v) return v;
 var c=lemma(t);
 for(var i=0;i<c.length;i++){
  if(LEX[c[i]]) return {w:c[i],e:LEX[c[i]],kind:'d'};
  v=viak(c[i],c[i]); if(v) return v;
 }
 return null;
}
function scan(text){
 var re=/[A-Za-z][A-Za-z'\-]*/g, m, toks=[];
 while((m=re.exec(text))) toks.push({s:m.index,e:m.index+m[0].length,t:m[0]});
 var out=[], cur=0, hits=[], seen={}, i, ntok=toks.length;
 for(i=0;i<ntok;i++){
  var low=toks[i].t.toLowerCase(), got=null, span=1;
  if(PH[low]){
   for(var j=0;j<PH[low].length;j++){
    var p=PH[low][j];
    if(i+p.length-1>=ntok) continue;
    var ok=true;
    for(var q=0;q<p.length;q++){ if(toks[i+q].t.toLowerCase()!==p[q]){ ok=false; break } }
    if(ok){ var hp=SYN[p.join(' ')]||[], hw=''; for(var z=0;z<hp.length;z++) if(LEX[hp[z]]){ hw=hp[z]; break }
     if(!hw) continue;
     got={w:hw,e:LEX[hw],s:p.join(' '),kind:'s'}; span=p.length; break }
   }
  }
  if(!got) got=find(low);
  if(got){
   var et=toks[i+span-1];
   out.push(esc(text.slice(cur,toks[i].s)));
   out.push('<mark class="lk '+(got.kind==='s'?'syn':'')+'" data-w="'+esc(got.w)+'">'+esc(text.slice(toks[i].s,et.e))+'</mark>');
   cur=et.e; i+=span-1;
   if(!seen[got.w]){ seen[got.w]=1; hits.push({w:got.w,e:got.e,s:got.s,k:got.kind}) }
  }
 }
 out.push(esc(text.slice(cur)));
 return {html:out.join(''),hits:hits,words:ntok};
}
function state(w){
 var rec={}, bk={};
 try{ rec=JSON.parse(localStorage.getItem(REC)||'{}') }catch(e){}
 try{ bk=JSON.parse(localStorage.getItem(BOOK)||'{}') }catch(e){}
 var a=rec[w]||bk[w]||null;
 if(!a) return ['',''];
 if((a.lv||0)>=7) return ['good','已掌握'];
 return ['new',(a.wr||a.lv)?'在复习':'生词本'];
}
function render(text){
 var r=scan(text);
 var box=document.getElementById('res'), pass=document.getElementById('pass'),
     list=document.getElementById('list'), chips=document.getElementById('chips');
 box.classList.add('on');
 pass.innerHTML=r.html;
 if(!r.hits.length){
  chips.innerHTML='<span class="chip">这篇里没命中本书的词</span>';
  list.innerHTML=''; return;
 }
 var byCh={}, i, h;
 for(i=0;i<r.hits.length;i++){
  h=r.hits[i]; var ch=h.e[1]||'';
  (byCh[ch]=byCh[ch]||[]).push(h);
 }
 var keys=Object.keys(byCh).sort(), nd=0, ns=0;
 for(i=0;i<r.hits.length;i++){ if(r.hits[i].k==='s') ns++; else nd++ }
 chips.innerHTML='<span class="chip">直接命中 <b>'+nd+'</b> 个词</span>'
  +(ns?'<span class="chip">同义替换 <b>'+ns+'</b> 处</span>':'')
  +'<span class="chip">涉及 <b>'+keys.length+'</b> '+(META.unitLabel||'处')+'</span>'
  +'<span class="chip">全文 <b>'+r.words+'</b> 词</span>';
 var html=[];
  keys.forEach(function(ch){
  var arr=byCh[ch];
  var href=META.links?(META.links[ch]||''):(META.page?META.page.replace('__CH__',ch):'');
  html.push('<div class="grp"><div class="gh"><b>'+(CHN[ch]||ch)+'</b>'
   +'<span>'+arr.length+' 词</span>'
   +(href?'<a href="'+href+'">打开这一'+META.unitLabel+' →</a>':'')+'</div>');
  arr.forEach(function(x){
   var st=state(x.w);
   html.push('<div class="hit'+(x.k==='s'?' syn':'')+'"><span class="w">'+esc(x.w)+'</span>'
    +'<span class="m">'+esc(x.e[0]||'')+(x.s&&x.s!==x.w?('　← 原文里是 <b>'+esc(x.s)+'</b>'):'')+'</span>'
    +(st[1]?'<span class="st '+st[0]+'">'+st[1]+'</span>':'')+'</div>');
  });
  html.push('</div>');
 });
 list.innerHTML=html.join('');
}

document.addEventListener('click',function(e){

 var on=document.querySelectorAll('mark.lk.on');
 for(var i=0;i<on.length;i++) on[i].classList.remove('on');
 m.classList.add('on');
 var w=m.getAttribute('data-w'), hs=document.querySelectorAll('.hit');
 for(var j=0;j<hs.length;j++){
  var el=hs[j];
  if(el.querySelector('.w') && el.querySelector('.w').textContent===w){
   el.scrollIntoView({block:'center',behavior:'smooth'});
   el.style.transition='background .2s'; el.style.background='var(--mark)';
   setTimeout(function(){el.style.background=''},900);
   break;
  }
 }
});
